{{- if .Values.externalSecret.enabled }}
# Pulls this env's TenthMatrix secrets from Vault (vault.workstation.co.uk, KV v2
# compat mount `kv`) through the External Secrets Operator, using the SAME
# ClusterSecretStore Workstation uses (wslvault-backend).
#
# Per-environment key (root of the kv mount, prefixed by namespace slug):
#   tenthmatrix/<env>/config  ->  GET /v1/kv/data/tenthmatrix/<env>/config
# Seed it with devops/vault/seed-tm-secrets.sh (dry-run by default).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tm-chart.secretName" . | quote }}
  labels:
    {{- include "tm-chart.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1m" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName | quote }}
    kind: {{ .Values.externalSecret.storeKind | default "ClusterSecretStore" }}
  target:
    name: {{ include "tm-chart.secretName" . | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ printf "%s/%s/config" (.Values.externalSecret.pathPrefix | default "tenthmatrix") .Values.env | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
