<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">OpenShell architecture</title>
  <desc id="d">The gateway control plane holds policy, providers, the policy prover and the policy advisor. On each host a compute driver starts a sandbox and a supervisor. The agent inside the sandbox has no direct network; each file access is limited by Landlock and each connection or DNS lookup is passed to the supervisor, which checks policy, injects the real credential for approved endpoints and opens the connection to the internet or model provider.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#0b1020"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="26" font-weight="700" fill="#ffffff">The agent asks, the supervisor decides</text>
    <text x="40" y="84" font-size="17" fill="#94a3b8">The sandbox never makes policy decisions. Real credentials and real network connections live on the trusted side.</text>

    <!-- gateway -->
    <rect x="40" y="112" width="1120" height="128" rx="16" fill="#0f1a33" stroke="#1e3a8a"/>
    <text x="62" y="142" font-size="15" font-weight="700" fill="#93c5fd" letter-spacing="1.5">GATEWAY (CONTROL PLANE)</text>
    <g font-size="16">
      <rect x="62" y="158" width="240" height="64" rx="12" fill="#1e293b" stroke="#475569"/>
      <text x="182" y="186" text-anchor="middle" font-weight="700" fill="#f8fafc">Sandbox lifecycle</text>
      <text x="182" y="208" text-anchor="middle" font-size="14" fill="#cbd5e1">create · connect · logs</text>
      <rect x="322" y="158" width="240" height="64" rx="12" fill="#1e293b" stroke="#475569"/>
      <text x="442" y="186" text-anchor="middle" font-weight="700" fill="#f8fafc">Policy + revisions</text>
      <text x="442" y="208" text-anchor="middle" font-size="14" fill="#cbd5e1">global · sandbox · image</text>
      <rect x="582" y="158" width="270" height="64" rx="12" fill="#1e293b" stroke="#475569"/>
      <text x="717" y="186" text-anchor="middle" font-weight="700" fill="#f8fafc">Prover + advisor</text>
      <text x="717" y="208" text-anchor="middle" font-size="14" fill="#cbd5e1">verify rules · review proposals</text>
      <rect x="872" y="158" width="266" height="64" rx="12" fill="#1e293b" stroke="#475569"/>
      <text x="1005" y="186" text-anchor="middle" font-weight="700" fill="#f8fafc">Providers</text>
      <text x="1005" y="208" text-anchor="middle" font-size="14" fill="#cbd5e1">real keys, bound to endpoints</text>
    </g>

    <path d="M600 240 L600 290" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <text x="612" y="272" font-size="14" fill="#94a3b8">policy + settings</text>

    <!-- host -->
    <rect x="40" y="296" width="1120" height="384" rx="16" fill="#0d1526" stroke="#334155"/>
    <text x="62" y="326" font-size="15" font-weight="700" fill="#cbd5e1" letter-spacing="1.5">HOST · compute driver: Docker, Podman, Kubernetes or microVM</text>

    <!-- sandbox -->
    <rect x="62" y="346" width="470" height="312" rx="14" fill="#1a1020" stroke="#f87171" stroke-dasharray="7 5"/>
    <text x="84" y="376" font-size="15" font-weight="700" fill="#fca5a5" letter-spacing="1.5">SANDBOX (UNTRUSTED)</text>
    <rect x="84" y="394" width="426" height="78" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="297" y="426" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Agent: Claude Code, OpenCode…</text>
    <text x="297" y="454" text-anchor="middle" font-size="14" fill="#cbd5e1">non-root · no Linux capabilities · no direct network</text>
    <rect x="84" y="488" width="204" height="70" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="186" y="518" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Landlock</text>
    <text x="186" y="540" text-anchor="middle" font-size="13" fill="#cbd5e1">read-only / read-write paths</text>
    <rect x="306" y="488" width="204" height="70" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="408" y="518" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">seccomp notify</text>
    <text x="408" y="540" text-anchor="middle" font-size="13" fill="#cbd5e1">TCP opens + DNS staged</text>
    <rect x="84" y="574" width="426" height="64" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="297" y="602" text-anchor="middle" font-size="15" fill="#f8fafc">env: GITHUB_TOKEN=openshell:resolve:env:GITHUB_TOKEN</text>
    <text x="297" y="624" text-anchor="middle" font-size="13" fill="#94a3b8">a placeholder, not the secret</text>

    <path d="M532 520 L612 520" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <text x="572" y="508" text-anchor="middle" font-size="13" fill="#94a3b8">request</text>

    <!-- supervisor -->
    <rect x="616" y="346" width="330" height="312" rx="14" fill="#0f2416" stroke="#4ade80"/>
    <text x="638" y="376" font-size="15" font-weight="700" fill="#86efac" letter-spacing="1.5">SUPERVISOR (TRUSTED)</text>
    <g font-size="15" fill="#e2e8f0">
      <text x="638" y="414">1. Which binary is calling?</text>
      <text x="638" y="446">2. Does a rule allow this host,</text>
      <text x="660" y="468">port, method and path?</text>
      <text x="638" y="500">3. Resolve DNS, block metadata</text>
      <text x="660" y="522">and loopback addresses</text>
      <text x="638" y="554">4. Swap placeholder for the real</text>
      <text x="660" y="576">key, if bound to this endpoint</text>
      <text x="638" y="608">5. Open the connection, log it</text>
    </g>
    <text x="638" y="640" font-size="13" fill="#fca5a5">No rule → denied · bad binding → 403</text>

    <path d="M946 470 L1006 470" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

    <rect x="1010" y="380" width="128" height="72" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="1074" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">GitHub,</text>
    <text x="1074" y="434" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">registries</text>
    <rect x="1010" y="470" width="128" height="72" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="1074" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Model</text>
    <text x="1074" y="524" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">providers</text>
    <rect x="1010" y="560" width="128" height="72" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="1074" y="592" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">MCP,</text>
    <text x="1074" y="614" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">your APIs</text>
  </g>
</svg>
