  <text fill="#ffffff" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" x="60" y="150">Uncovering LLM Bottlenecks</text>
  <text fill="#ffffff" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" x="60" y="198">Traces, metrics, and FinOps for agent pipelines</text>
  <text fill="rgba(255,255,255,0.82)" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" x="60" y="250">Find where tokens, latency, and money leak — then fix them with evidence.</text>
