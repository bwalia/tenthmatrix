      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#132033"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.2" cy="0.25" r="0.55">
