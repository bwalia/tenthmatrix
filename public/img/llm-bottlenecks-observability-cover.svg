    <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="24" y="350">Without telemetry, the model is slow</text>
    <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="24" y="372">is a guess — not an engineering decision.</text>
    <text fill="#34d399" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" x="24" y="404">Measure ��→ attribute ��→ cap ��→ improve</text>
