<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="PagedAttention maps sequence tokens to non-contiguous KV cache blocks">
  <rect width="1200" height="560" fill="#0f172a"/>
  <text fill="#67e8f9" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" x="40" y="42">PAGEDATTENTION = VIRTUAL MEMORY FOR KV CACHE</text>
  <text fill="#e2e8f0" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" x="40" y="78">Logical sequence pages to physical GPU blocks</text>
  <rect x="40" y="110" width="520" height="390" rx="14" fill="#111827" stroke="#334155"/>
  <text fill="#93c5fd" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" x="60" y="142">LOGICAL (per request)</text>
  <rect x="60" y="164" width="480" height="48" rx="8" fill="#1e3a5f" stroke="#38bdf8"/>
  <text fill="#e0f2fe" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" x="80" y="194">tokens 0-15   page 0</text>
  <rect x="60" y="224" width="480" height="48" rx="8" fill="#1e3a5f" stroke="#38bdf8"/>
  <text fill="#e0f2fe" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" x="80" y="254">tokens 16-31  page 1</text>
  <rect x="60" y="284" width="320" height="48" rx="8" fill="#1e3a5f" stroke="#38bdf8"/>
  <text fill="#e0f2fe" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" x="80" y="314">tokens 32-39  page 2 (partial)</text>
  <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="60" y="370">Pre-allocate a giant contiguous KV slab? Waste.</text>
  <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="60" y="394">Grow/shrink per decode step instead.</text>
  <text fill="#67e8f9" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" x="60" y="430">Tune: block size, max model len, GPU util.</text>
  <rect x="640" y="110" width="520" height="390" rx="14" fill="#111827" stroke="#334155"/>
  <text fill="#c4b5fd" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" x="660" y="142">PHYSICAL GPU BLOCK POOL</text>
  <rect x="660" y="164" width="110" height="70" rx="8" fill="#312e81" stroke="#a78bfa"/>
  <text fill="#ede9fe" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" x="688" y="204">blk 7</text>
  <rect x="790" y="164" width="110" height="70" rx="8" fill="#164e63" stroke="#22d3ee"/>
  <text fill="#cffafe" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" x="818" y="204">blk 2</text>
  <rect x="920" y="164" width="110" height="70" rx="8" fill="#14532d" stroke="#34d399"/>
  <text fill="#d1fae5" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" x="948" y="204">blk 11</text>
  <rect x="660" y="252" width="110" height="70" rx="8" fill="none" stroke="#64748b" stroke-dasharray="4 3"/>
  <text fill="#64748b" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" x="688" y="292">free</text>
  <rect x="790" y="252" width="110" height="70" rx="8" fill="#3f1d2e" stroke="#f472b6"/>
  <text fill="#fce7f3" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" x="818" y="292">blk 4</text>
  <rect x="920" y="252" width="110" height="70" rx="8" fill="none" stroke="#64748b" stroke-dasharray="4 3"/>
  <text fill="#64748b" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" x="948" y="292">free</text>
  <path d="M560 188 L640 198" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="none"/>
  <path d="M560 248 L640 198" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M380 308 L790 288" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="660" y="360">Block table maps request -&gt; physical blocks.</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="660" y="384">Copy-on-write sharing for beam / prefix cache.</text>
  <text fill="#67e8f9" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" x="660" y="420">Result: near-zero fragmentation waste.</text>
</svg>
