<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img"><title>Keeping data in sync with Microsoft Graph: first a full delta sync, then a subscription validated within 10 seconds, notifications acknowledged within 3 seconds and queued, a delta call fetches the changes, and the subscription is renewed before it expires</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44565b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f63c6"/></marker></defs><rect width="1200" height="470" fill="#ffffff"/><text x="20" y="28" text-anchor="start" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">FIRST RUN</text><rect x="20" y="42" width="230" height="78" rx="8" fill="#e3eefc" stroke="#1f63c6" stroke-width="1.4"/><text x="135.0" y="70.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Full sync with delta</text><text x="135.0" y="86.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">GET /users/delta</text><text x="135.0" y="102.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">follow @odata.nextLink</text><rect x="290" y="42" width="230" height="78" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.4"/><text x="405.0" y="70.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Save the deltaLink</text><text x="405.0" y="86.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">last page returns</text><text x="405.0" y="102.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">@odata.deltaLink</text><rect x="560" y="42" width="290" height="78" rx="8" fill="#e3eefc" stroke="#1f63c6" stroke-width="1.4"/><text x="705.0" y="62.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Create a subscription</text><text x="705.0" y="78.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">POST /subscriptions</text><text x="705.0" y="94.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">resource, changeType, clientState,</text><text x="705.0" y="110.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">notificationUrl, expirationDateTime</text><rect x="890" y="42" width="290" height="78" rx="8" fill="#fde7e7" stroke="#c2373a" stroke-width="1.4"/><text x="1035.0" y="62.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Graph validates the URL</text><text x="1035.0" y="78.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">POST ?validationToken=…</text><text x="1035.0" y="94.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">reply 200, text/plain, the token</text><text x="1035.0" y="110.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">within 10 seconds</text><polyline points="250,81 288,81" fill="none" stroke="#44565b" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="520,81 558,81" fill="none" stroke="#44565b" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="850,81 888,81" fill="none" stroke="#44565b" stroke-width="1.5" marker-end="url(#ah)"/><text x="20" y="170" text-anchor="start" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">EVERY CHANGE AFTER THAT</text><rect x="20" y="186" width="200" height="78" rx="8" fill="#ece9fb" stroke="#5847c2" stroke-width="1.4"/><text x="120.0" y="214.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Change happens</text><text x="120.0" y="230.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">user updated, mail</text><text x="120.0" y="246.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">arrives, file edited</text><rect x="260" y="186" width="200" height="78" rx="8" fill="#e3eefc" stroke="#1f63c6" stroke-width="1.4"/><text x="360.0" y="214.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Notification arrives</text><text x="360.0" y="230.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">value[]: subscriptionId,</text><text x="360.0" y="246.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">changeType, clientState</text><rect x="500" y="186" width="200" height="78" rx="8" fill="#ddf1ec" stroke="#00806b" stroke-width="1.4"/><text x="600.0" y="214.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Check and queue</text><text x="600.0" y="230.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">clientState matches?</text><text x="600.0" y="246.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">reply 202 within 3 s</text><rect x="740" y="186" width="200" height="78" rx="8" fill="#e3eefc" stroke="#1f63c6" stroke-width="1.4"/><text x="840.0" y="214.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Worker calls delta</text><text x="840.0" y="230.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">GET saved deltaLink</text><text x="840.0" y="246.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">apply adds, edits, @removed</text><rect x="980" y="186" width="200" height="78" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.4"/><text x="1080.0" y="214.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Store new deltaLink</text><text x="1080.0" y="230.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">ready for the</text><text x="1080.0" y="246.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">next notification</text><polyline points="220,225 258,225" fill="none" stroke="#44565b" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="460,225 498,225" fill="none" stroke="#44565b" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="700,225 738,225" fill="none" stroke="#44565b" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="940,225 978,225" fill="none" stroke="#44565b" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="1080,264 1080,300 360,300 360,266" fill="none" stroke="#44565b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="720" y="318" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400">repeat for every notification</text><text x="20" y="360" text-anchor="start" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">IN THE BACKGROUND</text><rect x="20" y="376" width="270" height="78" rx="8" fill="#fcefd9" stroke="#a85f00" stroke-width="1.4"/><text x="155.0" y="404.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Renew before expiry</text><text x="155.0" y="420.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">PATCH /subscriptions/{id}</text><text x="155.0" y="436.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">e.g. Teams chats: 3 days</text><rect x="310" y="376" width="270" height="78" rx="8" fill="#fcefd9" stroke="#a85f00" stroke-width="1.4"/><text x="445.0" y="404.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Lifecycle notifications</text><text x="445.0" y="420.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">reauthorization required,</text><text x="445.0" y="436.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">missed notifications</text><rect x="600" y="376" width="270" height="78" rx="8" fill="#fde7e7" stroke="#c2373a" stroke-width="1.4"/><text x="735.0" y="404.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">410 Gone on delta</text><text x="735.0" y="420.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">token expired or reset:</text><text x="735.0" y="436.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">run a full sync again</text><rect x="890" y="376" width="270" height="78" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.4"/><text x="1025.0" y="404.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Endpoint too slow?</text><text x="1025.0" y="420.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">deliver to Event Hubs or</text><text x="1025.0" y="436.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Event Grid instead</text></svg>
