<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img"><title>The graph in Microsoft Graph: a user connected to messages, events, drive, joined teams, groups, manager, managed devices, To Do lists and people, each reached by a path under /me, with tenant-wide resources listed below</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44565b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f63c6"/></marker></defs><rect width="1200" height="760" fill="#ffffff"/><rect x="330" y="18" width="540" height="46" rx="23" fill="#e3eefc" stroke="#1f63c6" stroke-width="1.4"/><text x="600" y="47" text-anchor="middle" fill="#1f63c6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">GET https://graph.microsoft.com/v1.0/me/{relationship}</text><line x1="600" y1="360" x2="300" y2="170" stroke="#9fb0b4" stroke-width="2"/><line x1="600" y1="360" x2="600" y2="140" stroke="#9fb0b4" stroke-width="2"/><line x1="600" y1="360" x2="900" y2="170" stroke="#9fb0b4" stroke-width="2"/><line x1="600" y1="360" x2="1040" y2="350" stroke="#9fb0b4" stroke-width="2"/><line x1="600" y1="360" x2="900" y2="530" stroke="#9fb0b4" stroke-width="2"/><line x1="600" y1="360" x2="600" y2="560" stroke="#9fb0b4" stroke-width="2"/><line x1="600" y1="360" x2="300" y2="530" stroke="#9fb0b4" stroke-width="2"/><line x1="600" y1="360" x2="160" y2="350" stroke="#9fb0b4" stroke-width="2"/><line x1="1040" y1="350" x2="1095" y2="215" stroke="#c9d4d6" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="160" y1="350" x2="95" y2="200" stroke="#c9d4d6" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="900" y1="170" x2="1080" y2="100" stroke="#c9d4d6" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="300" cy="170" r="46" fill="#e1f1fb" stroke="#0f7bb8" stroke-width="2"/><text x="300" y="175" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">messages</text><text x="300" y="236" text-anchor="middle" fill="#0f7bb8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">/me/messages</text><circle cx="600" cy="140" r="46" fill="#e1f1fb" stroke="#0f7bb8" stroke-width="2"/><text x="600" y="145" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">events</text><text x="600" y="206" text-anchor="middle" fill="#0f7bb8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">/me/events</text><circle cx="900" cy="170" r="46" fill="#ddf1ec" stroke="#00806b" stroke-width="2"/><text x="900" y="175" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">drive</text><text x="900" y="236" text-anchor="middle" fill="#00806b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">/me/drive/root/children</text><circle cx="1040" cy="350" r="46" fill="#f6e6f7" stroke="#9a3aa6" stroke-width="2"/><text x="1040" y="355" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">joinedTeams</text><text x="1040" y="416" text-anchor="middle" fill="#9a3aa6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">/me/joinedTeams</text><circle cx="900" cy="530" r="46" fill="#e8f4dc" stroke="#3f7d1d" stroke-width="2"/><text x="900" y="535" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">todo</text><text x="900" y="596" text-anchor="middle" fill="#3f7d1d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">/me/todo/lists</text><circle cx="600" cy="560" r="46" fill="#fcefd9" stroke="#a85f00" stroke-width="2"/><text x="600" y="565" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">devices</text><text x="600" y="626" text-anchor="middle" fill="#a85f00" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">/me/managedDevices</text><circle cx="300" cy="530" r="46" fill="#ece9fb" stroke="#5847c2" stroke-width="2"/><text x="300" y="535" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">manager</text><text x="300" y="596" text-anchor="middle" fill="#5847c2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">/me/manager</text><circle cx="160" cy="350" r="46" fill="#ece9fb" stroke="#5847c2" stroke-width="2"/><text x="160" y="355" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">memberOf</text><text x="160" y="416" text-anchor="middle" fill="#5847c2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">/me/memberOf</text><circle cx="1095" cy="215" r="34" fill="#f6e6f7" stroke="#9a3aa6" stroke-width="1.6"/><text x="1095" y="219" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">channels</text><text x="1095" y="173" text-anchor="middle" fill="#9a3aa6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400">/teams/{id}/channels</text><circle cx="95" cy="200" r="34" fill="#ece9fb" stroke="#5847c2" stroke-width="1.6"/><text x="95" y="204" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">group</text><text x="95" y="158" text-anchor="middle" fill="#5847c2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400">/groups/{id}</text><circle cx="1080" cy="100" r="34" fill="#ddf1ec" stroke="#00806b" stroke-width="1.6"/><text x="1080" y="104" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">site</text><text x="1080" y="58" text-anchor="middle" fill="#00806b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400">/sites/{id}</text><circle cx="600" cy="360" r="70" fill="#1f63c6"/><text x="600" y="356" text-anchor="middle" fill="#ffffff" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700">user</text><text x="600" y="378" text-anchor="middle" fill="#dbe8fb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">/me  ·  /users/{id}</text><circle cx="70" cy="668" r="8" fill="#ece9fb" stroke="#5847c2" stroke-width="2"/><text x="84" y="672" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Entra ID</text><circle cx="180.8" cy="668" r="8" fill="#e1f1fb" stroke="#0f7bb8" stroke-width="2"/><text x="194.8" y="672" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Exchange Online</text><circle cx="344.8" cy="668" r="8" fill="#ddf1ec" stroke="#00806b" stroke-width="2"/><text x="358.8" y="672" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">SharePoint / OneDrive</text><circle cx="554.4" cy="668" r="8" fill="#f6e6f7" stroke="#9a3aa6" stroke-width="2"/><text x="568.4" y="672" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Teams</text><circle cx="642.4" cy="668" r="8" fill="#fcefd9" stroke="#a85f00" stroke-width="2"/><text x="656.4" y="672" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Intune</text><circle cx="738.0" cy="668" r="8" fill="#e8f4dc" stroke="#3f7d1d" stroke-width="2"/><text x="752.0" y="672" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">To Do</text><rect x="20" y="692" width="1160" height="52" rx="8" fill="#eef2f1" stroke="#8a9a9e" stroke-width="1.4"/><text x="36" y="714" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Tenant-wide, usually with application permissions:</text><text x="36" y="734" text-anchor="start" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400">/users   /groups   /applications   /auditLogs/signIns   /security/alerts_v2   /deviceManagement/managedDevices   /sites   /reports</text></svg>
