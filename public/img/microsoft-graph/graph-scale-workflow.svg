<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img"><title>Calling Microsoft Graph at scale: combine up to 20 requests in one $batch call, read each response by id, retry only the items that returned 429 after the Retry-After delay, and move whole-tenant exports to Data Connect</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44565b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f63c6"/></marker></defs><rect width="1200" height="420" fill="#ffffff"/><rect x="20" y="40" width="250" height="150" rx="8" fill="#e3eefc" stroke="#1f63c6" stroke-width="1.4"/><text x="145.0" y="88.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">POST /v1.0/$batch</text><text x="145.0" y="104.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">up to 20 requests</text><text x="145.0" y="120.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">each with id, method, url</text><text x="145.0" y="136.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">dependsOn for order</text><text x="145.0" y="152.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">one HTTP round trip</text><rect x="320" y="40" width="250" height="150" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.4"/><text x="445.0" y="88.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Batch answers 200</text><text x="445.0" y="104.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">responses[] by id,</text><text x="445.0" y="120.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">in any order</text><text x="445.0" y="136.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">200 means parsed,</text><text x="445.0" y="152.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">not that each succeeded</text><polyline points="270,115 318,115" fill="none" stroke="#44565b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="620" y="40" width="280" height="44" rx="7" fill="#ddf1ec" stroke="#00806b" stroke-width="1.4"/><text x="634" y="67" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">201 / 200</text><text x="700" y="67" text-anchor="start" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400">done</text><rect x="620" y="92" width="280" height="44" rx="7" fill="#fcefd9" stroke="#a85f00" stroke-width="1.4"/><text x="634" y="119" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">424</text><text x="700" y="119" text-anchor="start" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400">a dependency failed</text><rect x="620" y="144" width="280" height="44" rx="7" fill="#fde7e7" stroke="#c2373a" stroke-width="1.4"/><text x="634" y="171" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">429</text><text x="700" y="171" text-anchor="start" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400">throttled: Retry-After: 10</text><polyline points="570,115 595,115 595,62 618,62" fill="none" stroke="#44565b" stroke-width="1.2" marker-end="url(#ah)"/><polyline points="570,115 595,115 595,114 618,114" fill="none" stroke="#44565b" stroke-width="1.2" marker-end="url(#ah)"/><polyline points="570,115 595,115 595,166 618,166" fill="none" stroke="#44565b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="930" y="120" width="250" height="70" rx="8" fill="#fde7e7" stroke="#c2373a" stroke-width="1.4"/><text x="1055.0" y="144.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Wait, then retry only</text><text x="1055.0" y="160.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">the 429 items; SDKs do this</text><text x="1055.0" y="176.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">for single calls, not in batches</text><polyline points="900,166 928,166" fill="none" stroke="#44565b" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="1055,120 1055,20 145,20 145,38" fill="none" stroke="#44565b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="600" y="14" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400">next batch</text><text x="20" y="236" text-anchor="start" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">WHAT GRAPH LIMITS</text><rect x="20" y="252" width="270" height="70" rx="8" fill="#e3eefc" stroke="#1f63c6" stroke-width="1.4"/><text x="155.0" y="276.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Per app, all tenants</text><text x="155.0" y="292.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">130,000 requests</text><text x="155.0" y="308.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">per 10 seconds</text><rect x="310" y="252" width="270" height="70" rx="8" fill="#ece9fb" stroke="#5847c2" stroke-width="1.4"/><text x="445.0" y="276.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Identity per app + tenant</text><text x="445.0" y="292.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">3,500 to 8,000 resource</text><text x="445.0" y="308.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">units per 10 s by tenant size</text><rect x="600" y="252" width="270" height="70" rx="8" fill="#fcefd9" stroke="#a85f00" stroke-width="1.4"/><text x="735.0" y="276.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Intune per app + tenant</text><text x="735.0" y="292.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">1,000 requests per 20 s;</text><text x="735.0" y="308.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">writes 100 per 20 s</text><rect x="890" y="252" width="270" height="70" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.4"/><text x="1025.0" y="276.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Writes</text><text x="1025.0" y="292.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">4 MB per request;</text><text x="1025.0" y="308.0" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">413 if larger</text><text x="20" y="356" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Cheaper calls: $select fewer properties, page with $top, use delta instead of polling, and batch related reads.</text><text x="20" y="378" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Whole-tenant exports belong in Microsoft Graph Data Connect, not in a loop of API calls.</text><text x="20" y="402" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">Limits are from Microsoft Learn (throttling-limits, Nov 2026) and can change; always obey Retry-After.</text></svg>
