<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Release workflow: CI builds and seeds int, CI promotes int to test, auto-promote carries test to acc, and acc to prod is gated by a change window, Go/No-Go sign-off, Jira change request, Grafana gate and the production password. Every hop is health and version checked, and a failed hop rolls back to the previous version." font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D6D3F0"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF004E"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#0D0B21"/>
  <text x="60" y="66" fill="#FF7AA2" font-size="20" font-weight="700" letter-spacing="4">RELEASE WORKFLOW DESIGN</text>
  <text x="60" y="114" fill="#FFFFFF" font-size="36" font-weight="800">CI builds once. Rings decide what earns prod.</text>

  <!-- CI band -->
  <rect x="60" y="148" width="1080" height="84" rx="16" fill="#221D4C" stroke="#5B53A6" stroke-width="2"/>
  <text x="88" y="200" fill="#FFFFFF" font-size="26" font-weight="700">CI: build + push image</text>
  <text x="420" y="200" fill="#D6D3F0" font-size="24" font-family="ui-monospace, Menlo, Consolas, monospace">curl --fail seed int  &#183;  promote int</text>

  <!-- arrows from CI to int/test -->
  <path d="M150,232 L150,300" stroke="#D6D3F0" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Rings -->
  <g font-weight="800">
    <rect x="60" y="306" width="220" height="140" rx="18" fill="#2C2559" stroke="#8B84D7" stroke-width="2"/>
    <text x="88" y="364" fill="#FFFFFF" font-size="40">int</text>
    <text x="88" y="404" fill="#B9B4E8" font-size="20" font-weight="600">seeded by CI</text>

    <rect x="346" y="306" width="220" height="140" rx="18" fill="#2C2559" stroke="#8B84D7" stroke-width="2"/>
    <text x="374" y="364" fill="#FFFFFF" font-size="40">test</text>
    <text x="374" y="404" fill="#B9B4E8" font-size="20" font-weight="600">auto_promote: true</text>

    <rect x="632" y="306" width="220" height="140" rx="18" fill="#2C2559" stroke="#8B84D7" stroke-width="2"/>
    <text x="660" y="364" fill="#FFFFFF" font-size="40">acc</text>
    <text x="660" y="404" fill="#B9B4E8" font-size="20" font-weight="600">auto_promote: false</text>

    <rect x="918" y="306" width="222" height="140" rx="18" fill="#2C2559" stroke="#FF004E" stroke-width="3"/>
    <text x="946" y="364" fill="#FFFFFF" font-size="40">prod</text>
    <text x="946" y="404" fill="#FFD1DE" font-size="20" font-weight="600">password required</text>
  </g>

  <!-- hop arrows + labels -->
  <path d="M282,376 L340,376" stroke="#D6D3F0" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M568,376 L626,376" stroke="#D6D3F0" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M854,376 L912,376" stroke="#FF004E" stroke-width="4" fill="none" marker-end="url(#arrowPink)"/>
  <text x="270" y="290" fill="#D6D3F0" font-size="19" font-weight="600">CI promote</text>
  <text x="560" y="290" fill="#D6D3F0" font-size="19" font-weight="600">auto hop</text>
  <text x="836" y="290" fill="#FF9BB8" font-size="19" font-weight="700">human hop</text>

  <!-- rollback arcs -->
  <path d="M410,448 C380,520 540,520 510,452" stroke="#FF004E" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrowPink)"/>
  <path d="M696,448 C666,520 826,520 796,452" stroke="#FF004E" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrowPink)"/>
  <path d="M982,448 C952,520 1112,520 1082,452" stroke="#FF004E" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrowPink)"/>
  <text x="60" y="540" fill="#FF9BB8" font-size="20" font-weight="600">Failed health or version check: that ring rolls back to its previous version</text>

  <!-- Gate panel -->
  <rect x="60" y="560" width="1080" height="160" rx="18" fill="#221D4C" stroke="#FF004E" stroke-width="2"/>
  <text x="88" y="604" fill="#FFFFFF" font-size="24" font-weight="800">Gates checked before deploy into guarded rings (e.g. acc, prod)</text>
  <g font-size="20" font-weight="700">
    <rect x="88" y="628" width="196" height="56" rx="12" fill="#0D0B21" stroke="#8B84D7"/>
    <text x="186" y="663" text-anchor="middle" fill="#FFFFFF">Change window</text>
    <rect x="295" y="628" width="196" height="56" rx="12" fill="#0D0B21" stroke="#8B84D7"/>
    <text x="393" y="663" text-anchor="middle" fill="#FFFFFF">Go/No-Go sign-off</text>
    <rect x="502" y="628" width="196" height="56" rx="12" fill="#0D0B21" stroke="#8B84D7"/>
    <text x="600" y="663" text-anchor="middle" fill="#FFFFFF">Jira CR code</text>
    <rect x="709" y="628" width="196" height="56" rx="12" fill="#0D0B21" stroke="#8B84D7"/>
    <text x="807" y="663" text-anchor="middle" fill="#FFFFFF">Grafana gate</text>
    <rect x="916" y="628" width="196" height="56" rx="12" fill="#0D0B21" stroke="#FF004E"/>
    <text x="1014" y="663" text-anchor="middle" fill="#FFFFFF">Prod password</text>
</g>
</svg>
