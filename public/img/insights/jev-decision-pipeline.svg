<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="jev-decision-pipeline.svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#151B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="592" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="70" fill="#3DD6C6" font-family="IBM Plex Sans,sans-serif" font-size="14" letter-spacing="2">DECISION PIPELINE</text>
  <text x="56" y="110" fill="#E8ECF8" font-family="Georgia,serif" font-size="34">State �→ questions �→ probabilities �→ gates</text>
  <rect x="60" y="220" width="200" height="140" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="76" y="248" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">State</text>
<text x="76" y="272" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">ticket + history</text>
  <rect x="320" y="180" width="220" height="80" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="336" y="208" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">Choice</text>
<text x="336" y="232" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">intent class</text>
  <rect x="320" y="290" width="220" height="80" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="336" y="318" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">Score</text>
<text x="336" y="342" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">urgency levels</text>
  <rect x="320" y="400" width="220" height="80" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="336" y="428" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">Noul</text>
<text x="336" y="452" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">needs human?</text>
  <rect x="620" y="250" width="240" height="140" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="636" y="278" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">Calibrated outputs</text>
<text x="636" y="302" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">p + confidence</text>
  <rect x="920" y="250" width="220" height="140" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="936" y="278" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">Code gates</text>
<text x="936" y="302" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">act / review / escalate</text>
  <path d="M260,290 L320,220" stroke="url(#accent)" stroke-width="2" marker-end="url(#m)"/>
  <path d="M260,300 L320,330" stroke="url(#accent)" stroke-width="2" marker-end="url(#m)"/>
  <path d="M260,320 L320,440" stroke="url(#accent)" stroke-width="2" marker-end="url(#m)"/>
  <path d="M540,300 L620,310" stroke="url(#accent)" stroke-width="2" marker-end="url(#m)"/>
  <path d="M860,320 L920,320" stroke="url(#accent)" stroke-width="2" marker-end="url(#m)"/>

</svg>
