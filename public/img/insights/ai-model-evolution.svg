<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="ai-model-evolution.svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#151B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="592" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="70" fill="#3DD6C6" font-family="IBM Plex Sans,sans-serif" font-size="14" letter-spacing="2">MODEL EVOLUTION</text>
  <text x="56" y="110" fill="#E8ECF8" font-family="Georgia,serif" font-size="32">From chat LLMs to composable AI systems</text>
  <path d="M80,500 C220,480 280,360 400,340 C520,320 560,220 700,210 C840,200 900,140 1100,120" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="120" cy="490" r="8" fill="#FF004E"/><text x="120" y="530" fill="#A7B0C8" font-size="13" text-anchor="middle" font-family="IBM Plex Sans,sans-serif">LLMs</text>
  <circle cx="280" cy="390" r="8" fill="#FF004E"/><text x="280" y="430" fill="#A7B0C8" font-size="13" text-anchor="middle" font-family="IBM Plex Sans,sans-serif">Tools</text>
  <circle cx="430" cy="335" r="8" fill="#FF004E"/><text x="430" y="375" fill="#A7B0C8" font-size="13" text-anchor="middle" font-family="IBM Plex Sans,sans-serif">Structured</text>
  <circle cx="580" cy="250" r="8" fill="#3DD6C6"/><text x="580" y="290" fill="#A7B0C8" font-size="13" text-anchor="middle" font-family="IBM Plex Sans,sans-serif">Reasoning</text>
  <circle cx="760" cy="205" r="8" fill="#3DD6C6"/><text x="760" y="245" fill="#A7B0C8" font-size="13" text-anchor="middle" font-family="IBM Plex Sans,sans-serif">Agents</text>
  <circle cx="940" cy="145" r="8" fill="#3DD6C6"/><text x="940" y="185" fill="#A7B0C8" font-size="13" text-anchor="middle" font-family="IBM Plex Sans,sans-serif">Routers</text>
  <circle cx="1100" cy="120" r="8" fill="#3DD6C6"/><text x="1100" y="160" fill="#E8ECF8" font-size="13" text-anchor="middle" font-family="IBM Plex Sans,sans-serif">Decision models</text>
  <text x="56" y="580" fill="#A7B0C8" font-family="IBM Plex Sans,sans-serif" font-size="15">Progress is not only bigger models — it is specialisation, orchestration, and economics.</text>

</svg>
