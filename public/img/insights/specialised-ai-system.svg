<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="specialised-ai-system.svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#151B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="592" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="70" fill="#3DD6C6" font-family="IBM Plex Sans,sans-serif" font-size="14" letter-spacing="2">COMPOSABLE AI SYSTEM</text>
  <text x="56" y="110" fill="#E8ECF8" font-family="Georgia,serif" font-size="32">Generate · Reason · Decide · Route · Evaluate</text>
  <rect x="80" y="200" width="200" height="100" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="96" y="228" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">Generate</text>
<text x="96" y="252" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">LLM</text>
  <rect x="340" y="200" width="200" height="100" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="356" y="228" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">Reason</text>
<text x="356" y="252" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">reasoning model</text>
  <rect x="600" y="200" width="200" height="100" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="616" y="228" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">Decide</text>
<text x="616" y="252" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">Jev / classifier</text>
  <rect x="860" y="200" width="240" height="100" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="876" y="228" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">Router</text>
<text x="876" y="252" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">workload map</text>
  <rect x="200" y="380" width="320" height="100" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="216" y="408" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">Tools + MCP</text>
<text x="216" y="432" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">actions / context</text>
  <rect x="600" y="380" width="320" height="100" rx="8" fill="#1A2144" stroke="rgba(255,255,255,0.14)"/>
<text x="616" y="408" fill="#E8ECF8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">Evaluation + feedback</text>
<text x="616" y="432" fill="#A7B0C8" font-family="IBM Plex Sans,Segoe UI,sans-serif" font-size="13">living benchmarks</text>
  <path d="M280,300 L300,380" stroke="url(#accent)" stroke-width="2" marker-end="url(#m)"/>
  <path d="M700,300 L740,380" stroke="url(#accent)" stroke-width="2" marker-end="url(#m)"/>
  <text x="56" y="560" fill="#A7B0C8" font-family="IBM Plex Sans,sans-serif" font-size="15">Production AI increasingly looks like a system of specialised models — not one model doing everything.</text>

</svg>
