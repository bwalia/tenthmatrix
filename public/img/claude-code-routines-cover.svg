<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Claude Code Routines: scheduled cloud agents, sub-routines and co-routines">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141019"/>
      <stop offset="1" stop-color="#2b1a14"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97757"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="10" height="630" fill="#d97757"/>
  <text fill="#d97757" font-family="system-ui,sans-serif" font-size="16" font-weight="700" letter-spacing="3" x="56" y="72">CLAUDE CODE  /  ROUTINES</text>
  <text fill="#ffffff" font-family="system-ui,sans-serif" font-size="50" font-weight="800" x="56" y="148">Agents that run</text>
  <text fill="#ffffff" font-family="system-ui,sans-serif" font-size="50" font-weight="800" x="56" y="208">while your laptop sleeps</text>
  <rect x="56" y="232" width="420" height="4" fill="#d97757"/>
  <text fill="#e7e5e4" font-family="system-ui,sans-serif" font-size="22" font-weight="600" x="56" y="284">Schedule  ·  API  ·  GitHub events  �→  cloud session  �→  PR</text>
  <g font-family="system-ui,sans-serif">
    <rect x="56" y="340" width="220" height="150" rx="14" fill="#211a1f" stroke="#d97757" stroke-width="2"/>
    <text fill="#f4a582" font-size="19" font-weight="700" x="78" y="378">Routine</text>
    <text fill="#a8a29e" font-size="15" x="78" y="410">prompt + repos</text>
    <text fill="#a8a29e" font-size="15" x="78" y="434">environment</text>
    <text fill="#a8a29e" font-size="15" x="78" y="458">connectors + triggers</text>
    <line x1="280" y1="415" x2="352" y2="415" stroke="#d97757" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="360" y="340" width="220" height="150" rx="14" fill="#211a1f" stroke="#8b5cf6" stroke-width="2"/>
    <text fill="#c4b5fd" font-size="19" font-weight="700" x="382" y="378">Sub-routines</text>
    <text fill="#a8a29e" font-size="15" x="382" y="410">subagents</text>
    <text fill="#a8a29e" font-size="15" x="382" y="434">skills in the repo</text>
    <text fill="#a8a29e" font-size="15" x="382" y="458">one run, many helpers</text>
    <line x1="584" y1="415" x2="656" y2="415" stroke="#d97757" stroke-width="3" marker-end="url(#ar)"/>
    <rect x="664" y="340" width="220" height="150" rx="14" fill="#211a1f" stroke="#10b981" stroke-width="2"/>
    <text fill="#6ee7b7" font-size="19" font-weight="700" x="686" y="378">Co-routines</text>
    <text fill="#a8a29e" font-size="15" x="686" y="410">routines that hand off</text>
    <text fill="#a8a29e" font-size="15" x="686" y="434">via PRs, labels, API</text>
    <text fill="#a8a29e" font-size="15" x="686" y="458">a pipeline of agents</text>
  </g>
  <g transform="translate(960,330)" font-family="ui-monospace,Menlo,monospace">
    <circle cx="90" cy="90" r="84" fill="none" stroke="#3f3a3f" stroke-width="10"/>
    <path d="M90,6 A84,84 0 1,1 6,90" fill="none" stroke="#d97757" stroke-width="10" stroke-linecap="round"/>
    <text fill="#ffffff" font-size="26" font-weight="700" x="90" y="88" text-anchor="middle">02:07</text>
    <text fill="#a8a29e" font-size="13" x="90" y="112" text-anchor="middle">nightly run</text>
  </g>
  <text fill="#78716c" font-family="system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="2" x="56" y="580">workstation.co.uk  /  research preview guide</text>
