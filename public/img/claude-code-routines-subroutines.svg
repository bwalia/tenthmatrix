<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Sub-routines: one routine run delegates work to subagents and repository skills, then merges their results into one pull request">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="16" fill="#15121a"/>
  <g font-family="system-ui,sans-serif">
    <text fill="#ffffff" font-size="26" font-weight="800" x="40" y="52">Sub-routines: one run, many focused helpers</text>
    <text fill="#a8a29e" font-size="15" x="40" y="80">The routine prompt acts as the orchestrator. Subagents and skills committed to the repo do the scoped work in their own context.</text>

    <rect x="40" y="250" width="200" height="120" rx="12" fill="#211a1f" stroke="#d97757" stroke-width="2"/>
    <text fill="#f4a582" font-size="17" font-weight="700" x="60" y="284">Trigger fires</text>
    <text fill="#a8a29e" font-size="13" x="60" y="310">weeknights 02:07</text>
    <text fill="#a8a29e" font-size="13" x="60" y="332">“nightly-maintenance”</text>
    <line x1="244" y1="310" x2="306" y2="310" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#ar)"/>

    <rect x="314" y="200" width="250" height="220" rx="14" fill="#1d1a24" stroke="#8b5cf6" stroke-width="2.5"/>
    <text fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="2" x="334" y="232">MAIN ROUTINE SESSION</text>
    <text fill="#ffffff" font-size="18" font-weight="700" x="334" y="264">Orchestrator prompt</text>
    <text fill="#a8a29e" font-size="13" x="334" y="292">1. read new issues</text>
    <text fill="#a8a29e" font-size="13" x="334" y="314">2. delegate each step</text>
    <text fill="#a8a29e" font-size="13" x="334" y="336">3. check each result</text>
    <text fill="#a8a29e" font-size="13" x="334" y="358">4. open one draft PR</text>
    <text fill="#a8a29e" font-size="13" x="334" y="380">5. post summary to Slack</text>

    <line x1="568" y1="240" x2="668" y2="148" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="568" y1="290" x2="668" y2="262" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="568" y1="340" x2="668" y2="376" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="568" y1="390" x2="668" y2="490" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#ar)"/>

    <rect x="676" y="104" width="250" height="88" rx="12" fill="#211a1f" stroke="#8b5cf6" stroke-width="1.5"/>
    <text fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="1" x="694" y="128">SUBAGENT</text>
    <text fill="#ffffff" font-size="16" font-weight="700" x="694" y="152">issue-triager</text>
    <text fill="#a8a29e" font-size="12" x="694" y="174">labels, owners · read-only tools</text>

    <rect x="676" y="218" width="250" height="88" rx="12" fill="#211a1f" stroke="#8b5cf6" stroke-width="1.5"/>
    <text fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="1" x="694" y="242">SUBAGENT</text>
    <text fill="#ffffff" font-size="16" font-weight="700" x="694" y="266">bug-fixer</text>
    <text fill="#a8a29e" font-size="12" x="694" y="288">edits code on a claude/* branch</text>

    <rect x="676" y="332" width="250" height="88" rx="12" fill="#211a1f" stroke="#8b5cf6" stroke-width="1.5"/>
    <text fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="1" x="694" y="356">SUBAGENT</text>
    <text fill="#ffffff" font-size="16" font-weight="700" x="694" y="380">test-runner</text>
    <text fill="#a8a29e" font-size="12" x="694" y="402">runs the suite, reports failures</text>

    <rect x="676" y="446" width="250" height="88" rx="12" fill="#211a1f" stroke="#d97757" stroke-width="1.5"/>
    <text fill="#f4a582" font-size="12" font-weight="700" letter-spacing="1" x="694" y="470">SKILL (.claude/skills)</text>
    <text fill="#ffffff" font-size="16" font-weight="700" x="694" y="494">release-notes</text>
    <text fill="#a8a29e" font-size="12" x="694" y="516">house style for summaries</text>

    <line x1="930" y1="148" x2="1004" y2="290" stroke="#10b981" stroke-width="2" marker-end="url(#ag)"/>
    <line x1="930" y1="262" x2="1004" y2="300" stroke="#10b981" stroke-width="2" marker-end="url(#ag)"/>
    <line x1="930" y1="376" x2="1004" y2="320" stroke="#10b981" stroke-width="2" marker-end="url(#ag)"/>
    <line x1="930" y1="490" x2="1004" y2="330" stroke="#10b981" stroke-width="2" marker-end="url(#ag)"/>

    <rect x="1010" y="250" width="160" height="120" rx="12" fill="#1a211f" stroke="#10b981" stroke-width="2"/>
    <text fill="#6ee7b7" font-size="16" font-weight="700" x="1028" y="284">Results return</text>
    <text fill="#a8a29e" font-size="13" x="1028" y="310">summaries only,</text>
    <text fill="#a8a29e" font-size="13" x="1028" y="330">not full context</text>
    <text fill="#a8a29e" font-size="13" x="1028" y="352">�→ one draft PR</text>

    <rect x="40" y="566" width="1130" height="50" rx="10" fill="#1f1b17" stroke="#3f3a3f" stroke-width="1.5"/>
    <text fill="#d6d3d1" font-size="14" x="60" y="596">Why: each helper gets a clean context window and only the tools it needs, so a long unattended run stays focused and cheaper.</text>
  </g>
</svg>
