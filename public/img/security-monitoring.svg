<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Security monitoring: detect, triage, respond pipeline with SOAR remediation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0a14"/>
      <stop offset="0.55" stop-color="#3d0a14"/>
      <stop offset="1" stop-color="#0a1428"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#f44336" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#f44336" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #ef9a9a; font: 700 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 54px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .tagline { fill: #ff5252; font: 800 26px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub { fill: rgba(255,255,255,0.92); font: 500 17px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.24); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .num { fill: #ff5252; font: 800 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .brand { fill: rgba(255,255,255,0.55); font: 700 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
      .nodeLabel { fill: #ffffff; font: 700 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .nodeText { fill: rgba(255,255,255,0.75); font: 400 9px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .audience { fill: rgba(255,255,255,0.7); font: 600 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .laneLabel { fill: #ef9a9a; font: 700 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ff5252"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text class="kicker" x="60" y="80">SECURITY  /  THREAT DETECTION + RESPONSE</text>
  <text class="title" x="60" y="156">Security ops</text>
  <text class="tagline" x="60" y="200">SIEM + SOAR + real-time analytics</text>
  <text class="sub" x="60" y="240">Logs and traces flow into detection. High-severity alerts trigger guarded SOAR playbooks.</text>

  <g>
    <rect class="chip" x="60" y="282" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="308">01</text>
    <text class="chipText" x="120" y="308">Collect logs + audit</text>

    <rect class="chip" x="60" y="336" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="362">02</text>
    <text class="chipText" x="120" y="362">Detect (rules + ML)</text>

    <rect class="chip" x="60" y="390" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="416">03</text>
    <text class="chipText" x="120" y="416">Triage + RCA</text>

    <rect class="chip" x="60" y="444" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="470">04</text>
    <text class="chipText" x="120" y="470">Respond + report</text>
  </g>

  <g transform="translate(420,90)">
    <rect x="0" y="0" width="720" height="450" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

    <text class="laneLabel" x="20" y="28">SOURCE PLANE  /  TELEMETRY</text>
    <g transform="translate(20,40)">
      <rect width="150" height="56" rx="10" fill="#0c2b18" stroke="#16a34a" stroke-width="1.5"/>
      <text class="nodeLabel" x="75" y="22" text-anchor="middle">App logs</text>
      <text class="nodeText" x="75" y="38" text-anchor="middle">structured JSON</text>
      <text class="nodeText" x="75" y="50" text-anchor="middle">trace IDs</text>

      <rect x="170" y="0" width="150" height="56" rx="10" fill="#0c2b18" stroke="#16a34a" stroke-width="1.5"/>
      <text class="nodeLabel" x="75" y="22" text-anchor="middle">DB audit</text>
      <text class="nodeText" x="75" y="38" text-anchor="middle">PG audit  /  binlog</text>
      <text class="nodeText" x="75" y="50" text-anchor="middle">privileged ops</text>

      <rect x="340" y="0" width="150" height="56" rx="10" fill="#0c2b18" stroke="#16a34a" stroke-width="1.5"/>
      <text class="nodeLabel" x="75" y="22" text-anchor="middle">Network</text>
      <text class="nodeText" x="75" y="38" text-anchor="middle">flow logs  /  IDS</text>
      <text class="nodeText" x="75" y="50" text-anchor="middle">L7 WAF events</text>

      <rect x="510" y="0" width="190" height="56" rx="10" fill="#0c2b18" stroke="#16a34a" stroke-width="1.5"/>
      <text class="nodeLabel" x="95" y="22" text-anchor="middle">Identity</text>
      <text class="nodeText" x="95" y="38" text-anchor="middle">IdP login  /  MFA  /  PAM</text>
      <text class="nodeText" x="95" y="50" text-anchor="middle">privilege escalations</text>
    </g>

    <text class="laneLabel" x="20" y="124">DETECT PLANE  /  RULES + ML</text>
    <g transform="translate(20,136)">
      <rect width="340" height="90" rx="10" fill="#3a1f08" stroke="#ef6c00" stroke-width="1.5"/>
      <text class="nodeLabel" x="170" y="22" text-anchor="middle">SIEM rules</text>
      <text class="nodeText" x="170" y="40" text-anchor="middle">Sigma  /  KQL  /  Suricata</text>
      <text class="nodeText" x="170" y="56" text-anchor="middle">MITRE ATT&amp;CK aligned</text>
      <text class="nodeText" x="170" y="72" text-anchor="middle">deterministic for known TTPs</text>

      <rect x="360" y="0" width="340" height="90" rx="10" fill="#1a1240" stroke="#7c3aed" stroke-width="1.5"/>
      <text class="nodeLabel" x="170" y="22" text-anchor="middle">UEBA / ML</text>
      <text class="nodeText" x="170" y="40" text-anchor="middle">user + entity baselines</text>
      <text class="nodeText" x="170" y="56" text-anchor="middle">anomaly clustering</text>
      <text class="nodeText" x="170" y="72" text-anchor="middle">low-noise risk score</text>
    </g>

    <text class="laneLabel" x="20" y="254">TRIAGE PLANE  /  SOC</text>
    <g transform="translate(20,266)">
      <rect width="340" height="74" rx="10" fill="#1e0a14" stroke="#dc2626" stroke-width="1.5"/>
      <text class="nodeLabel" x="170" y="22" text-anchor="middle">Alert console</text>
      <text class="nodeText" x="170" y="40" text-anchor="middle">severity + asset + identity</text>
      <text class="nodeText" x="170" y="56" text-anchor="middle">links to logs, traces, runbook</text>

      <rect x="360" y="0" width="340" height="74" rx="10" fill="#2a0a1f" stroke="#db2777" stroke-width="1.5"/>
      <text class="nodeLabel" x="170" y="22" text-anchor="middle">RCA / case</text>
      <text class="nodeText" x="170" y="40" text-anchor="middle">timeline reconstruction</text>
      <text class="nodeText" x="170" y="56" text-anchor="middle">LLM-assisted explanation</text>
    </g>

    <text class="laneLabel" x="20" y="358">RESPOND PLANE  /  SOAR (GUARDED)</text>
    <g transform="translate(20,370)">
      <rect width="220" height="60" rx="10" fill="#0c2b18" stroke="#16a34a" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">Auto-isolate</text>
      <text class="nodeText" x="110" y="40" text-anchor="middle">block IP  /  revoke token</text>
      <text class="nodeText" x="110" y="52" text-anchor="middle">disable session</text>

      <rect x="240" y="0" width="220" height="60" rx="10" fill="#3a1f08" stroke="#f59e0b" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">Approved playbook</text>
      <text class="nodeText" x="110" y="40" text-anchor="middle">rotate secret  /  patch</text>
      <text class="nodeText" x="110" y="52" text-anchor="middle">snapshot evidence</text>

      <rect x="480" y="0" width="220" height="60" rx="10" fill="#2a0a1f" stroke="#dc2626" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">Manual only</text>
      <text class="nodeText" x="110" y="40" text-anchor="middle">legal disclosure</text>
      <text class="nodeText" x="110" y="52" text-anchor="middle">customer notification</text>
    </g>

    <line x1="350" y1="96" x2="350" y2="136" stroke="#ff5252" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="350" y1="226" x2="350" y2="266" stroke="#ff5252" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="350" y1="340" x2="350" y2="370" stroke="#ff5252" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <text class="brand" x="60" y="600">TENTHMATRIX.COM</text>
  <text class="audience" x="1140" y="600" text-anchor="end">SECURITY  /  SOC  /  SRE</text>
</svg>
