<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Kubernetes RKE2 cluster: HA control plane and horizontally scaled worker pools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset="0.55" stop-color="#0e2050"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#326CE5" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#326CE5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #90caf9; font: 700 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 60px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .tagline { fill: #64b5f6; font: 800 26px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub { fill: rgba(255,255,255,0.92); font: 500 17px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.24); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .num { fill: #64b5f6; font: 800 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .brand { fill: rgba(255,255,255,0.55); font: 700 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
      .nodeLabel { fill: #ffffff; font: 700 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .nodeText { fill: rgba(255,255,255,0.75); font: 400 9px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .audience { fill: rgba(255,255,255,0.7); font: 600 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .laneLabel { fill: #90caf9; font: 700 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text class="kicker" x="60" y="80">RKE2  /  KUBERNETES  /  INFRASTRUCTURE SCALING</text>
  <text class="title" x="60" y="156">RKE2 cluster</text>
  <text class="tagline" x="60" y="200">HA control plane + horizontal worker pools</text>
  <text class="sub" x="60" y="240">3 server nodes (embedded etcd quorum). Worker pools per tier scale independently via Cluster Autoscaler.</text>

  <g>
    <rect class="chip" x="60" y="282" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="308">01</text>
    <text class="chipText" x="120" y="308">3 servers - etcd quorum</text>

    <rect class="chip" x="60" y="336" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="362">02</text>
    <text class="chipText" x="120" y="362">Pools per tier (app/db/gpu)</text>

    <rect class="chip" x="60" y="390" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="416">03</text>
    <text class="chipText" x="120" y="416">HPA + Cluster Autoscaler</text>

    <rect class="chip" x="60" y="444" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="470">04</text>
    <text class="chipText" x="120" y="470">Observability per pool</text>
  </g>

  <g transform="translate(420,90)">
    <rect x="0" y="0" width="720" height="450" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

    <text class="laneLabel" x="20" y="28">CONTROL PLANE  /  3 SERVERS  /  EMBEDDED ETCD</text>
    <g transform="translate(20,40)">
      <rect width="220" height="56" rx="10" fill="#1a1240" stroke="#6a3eff" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">server-1 (leader)</text>
      <text class="nodeText" x="110" y="38" text-anchor="middle">kube-apiserver  /  scheduler</text>
      <text class="nodeText" x="110" y="50" text-anchor="middle">controller-mgr  /  etcd member</text>

      <rect x="240" y="0" width="220" height="56" rx="10" fill="#1a1240" stroke="#6a3eff" stroke-width="1.5"/>
      <text class="nodeLabel" x="350" y="22" text-anchor="middle">server-2 (peer)</text>
      <text class="nodeText" x="350" y="38" text-anchor="middle">kube-apiserver  /  scheduler</text>
      <text class="nodeText" x="350" y="50" text-anchor="middle">etcd member  /  RAFT</text>

      <rect x="480" y="0" width="220" height="56" rx="10" fill="#1a1240" stroke="#6a3eff" stroke-width="1.5"/>
      <text class="nodeLabel" x="590" y="22" text-anchor="middle">server-3 (peer)</text>
      <text class="nodeText" x="590" y="38" text-anchor="middle">kube-apiserver  /  scheduler</text>
      <text class="nodeText" x="590" y="50" text-anchor="middle">etcd member  /  PDB enforced</text>
    </g>

    <text class="laneLabel" x="20" y="120">DATA PLANE  /  WORKER POOLS  /  INDEPENDENTLY SCALED</text>

    <g transform="translate(20,132)">
      <rect width="220" height="120" rx="12" fill="#0e2540" stroke="#326CE5" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">App pool (stateless)</text>
      <text class="nodeText" x="110" y="40" text-anchor="middle">5 - 50 nodes  /  HPA</text>
      <text class="nodeText" x="110" y="56" text-anchor="middle">node-label: tier=app</text>
      <text class="nodeText" x="110" y="74" text-anchor="middle">taint: none</text>
      <g transform="translate(14,82)">
        <rect width="20" height="28" rx="3" fill="rgba(50,108,229,0.4)"/>
        <rect x="24" width="20" height="28" rx="3" fill="rgba(50,108,229,0.4)"/>
        <rect x="48" width="20" height="28" rx="3" fill="rgba(50,108,229,0.4)"/>
        <rect x="72" width="20" height="28" rx="3" fill="rgba(50,108,229,0.4)"/>
        <rect x="96" width="20" height="28" rx="3" fill="rgba(50,108,229,0.4)"/>
        <rect x="120" width="20" height="28" rx="3" fill="rgba(50,108,229,0.4)"/>
        <rect x="144" width="20" height="28" rx="3" fill="rgba(50,108,229,0.4)"/>
        <rect x="168" width="20" height="28" rx="3" fill="rgba(50,108,229,0.4)"/>
      </g>
    </g>

    <g transform="translate(252,132)">
      <rect width="220" height="120" rx="12" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">DB pool (stateful)</text>
      <text class="nodeText" x="110" y="40" text-anchor="middle">3 - 9 nodes  /  anti-affinity</text>
      <text class="nodeText" x="110" y="56" text-anchor="middle">node-label: tier=db</text>
      <text class="nodeText" x="110" y="74" text-anchor="middle">taint: db=true:NoSchedule</text>
      <g transform="translate(40,82)">
        <rect width="30" height="28" rx="3" fill="rgba(46,125,50,0.5)"/>
        <rect x="40" width="30" height="28" rx="3" fill="rgba(46,125,50,0.5)"/>
        <rect x="80" width="30" height="28" rx="3" fill="rgba(46,125,50,0.5)"/>
        <rect x="120" width="30" height="28" rx="3" fill="rgba(46,125,50,0.5)"/>
      </g>
    </g>

    <g transform="translate(484,132)">
      <rect width="220" height="120" rx="12" fill="#3a1f08" stroke="#ef6c00" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">GPU pool (compute)</text>
      <text class="nodeText" x="110" y="40" text-anchor="middle">0 - 12 nodes  /  spot OK</text>
      <text class="nodeText" x="110" y="56" text-anchor="middle">node-label: tier=gpu</text>
      <text class="nodeText" x="110" y="74" text-anchor="middle">taint: nvidia.com/gpu=true</text>
      <g transform="translate(30,82)">
        <rect width="36" height="28" rx="3" fill="rgba(239,108,0,0.55)"/>
        <rect x="46" width="36" height="28" rx="3" fill="rgba(239,108,0,0.55)"/>
        <rect x="92" width="36" height="28" rx="3" fill="rgba(239,108,0,0.55)"/>
      </g>
    </g>

    <text class="laneLabel" x="20" y="282">SCALING SIGNALS</text>
    <g transform="translate(20,294)">
      <rect width="680" height="46" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text class="nodeText" x="14" y="20">HPA reads container CPU + custom Prometheus metric (queue depth)</text>
      <text class="nodeText" x="14" y="36">VPA tunes resource requests over time  /  Cluster Autoscaler adds nodes when pending pods unschedulable</text>
    </g>

    <text class="laneLabel" x="20" y="358">OBSERVABILITY  /  PER-POOL ROLLUP</text>
    <g transform="translate(20,370)">
      <rect width="680" height="46" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text class="nodeText" x="14" y="20">Prometheus  /  Grafana  /  Loki  /  Tempo  /  OpenTelemetry collector  /  Alertmanager  /  Argo CD</text>
      <text class="nodeText" x="14" y="36">SLO per tier: app p99 latency  /  db replica lag  /  GPU utilization</text>
    </g>
  </g>

  <text class="brand" x="60" y="600">TENTHMATRIX.COM</text>
  <text class="audience" x="1140" y="600" text-anchor="end">SRE  /  PLATFORM TEAMS</text>
</svg>
