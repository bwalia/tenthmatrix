<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="LHS image factory and RHS full deploy workflow for WSLProxy">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .tag { fill: #0f766e; font: 700 11px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .title { fill: #0f172a; font: 700 22px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .cap { fill: #475569; font: 500 13px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .panel-l { fill: #ecfdf5; stroke: #14b8a6; stroke-width: 2; }
      .panel-r { fill: #fff7ed; stroke: #c45c26; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .box-l { fill: #ffffff; stroke: #0d9488; stroke-width: 1.5; }
      .box-r { fill: #ffffff; stroke: #c45c26; stroke-width: 1.5; }
      .h { fill: #0f172a; font: 700 14px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .s { fill: #334155; font: 500 12px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .lbl { fill: #0f766e; font: 700 13px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .lbr { fill: #9a3412; font: 700 13px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .ln { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#m); }
      .foot { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="tag" x="40" y="36">FIGURE — IMAGE CACHE (LEFT) AND FULL DEPLOY (RIGHT)</text>
  <text class="title" x="40" y="68">Compile once ��→ Hub artefact ��→ promote with the right DEPLOY_MODE</text>
  <text class="cap" x="40" y="94">Workstation WSL Proxy pattern: prebuilt OpenResty image on the left; delivery pipeline on the right.</text>

  <!-- LHS panel -->
  <rect class="panel-l" x="40" y="120" width="540" height="520" rx="14"/>
  <text class="lbl" x="60" y="150">LHS — Images and cache</text>

  <rect class="box-l" x="70" y="170" width="480" height="56" rx="8"/>
  <text class="h" x="90" y="194">GitHub push</text>
  <text class="s" x="90" y="214">infra/openresty-prebuilt/**</text>

  <path class="ln" d="M310 226 V250"/>

  <rect class="box-l" x="70" y="250" width="480" height="56" rx="8"/>
  <text class="h" x="90" y="274">build-openresty-prebuilt.yml</text>
  <text class="s" x="90" y="294">Buildx · cache-from/to type=gha,mode=max</text>

  <path class="ln" d="M310 306 V330"/>

  <rect class="box-l" x="70" y="330" width="480" height="56" rx="8"/>
  <text class="h" x="90" y="354">Docker Hub</text>
  <text class="s" x="90" y="374">bwalia/wslproxy-openresty:&lt;ver&gt; + :latest</text>

  <path class="ln" d="M310 386 V410"/>

  <rect class="box-l" x="70" y="410" width="480" height="70" rx="8"/>
  <text class="h" x="90" y="438">Ansible openresty_prebuilt.yml</text>
  <text class="s" x="90" y="458">pull ��→ create ��→ docker cp ��→ rsync</text>
  <text class="s" x="90" y="476">excludes nginx/conf, html, logs</text>

  <rect class="box" x="70" y="500" width="480" height="110" rx="8"/>
  <text class="h" x="90" y="528">When to rebuild the image</text>
  <text class="s" x="90" y="552">· OpenResty / luarocks / opm / mc URL changes</text>
  <text class="s" x="90" y="572">· BASE_IMAGE / glibc target changes (debian:12 vs :13)</text>
  <text class="s" x="90" y="592">· Not for routine Lua/api or rule JSON edits</text>

  <!-- RHS panel -->
  <rect class="panel-r" x="620" y="120" width="540" height="520" rx="14"/>
  <text class="lbr" x="640" y="150">RHS — Full deploy</text>

  <rect class="box-r" x="650" y="170" width="480" height="56" rx="8"/>
  <text class="h" x="670" y="194">deploy-wslproxy-delivery-pipeline.yml</text>
  <text class="s" x="670" y="214">int ��→ smoke ��→ test ��→ prod (lon1 / pop0)</text>

  <path class="ln" d="M890 226 V250"/>

  <rect class="box-r" x="650" y="250" width="480" height="56" rx="8"/>
  <text class="h" x="670" y="274">deploy-environment.yml</text>
  <text class="s" x="670" y="294">secrets · Ansible tags · UI caches</text>

  <path class="ln" d="M890 306 V330"/>

  <rect class="box-r" x="650" y="330" width="480" height="90" rx="8"/>
  <text class="h" x="670" y="354">DEPLOY_MODE ��→ tags</text>
  <text class="s" x="670" y="376">code — Lua/api + data (no OpenResty compile)</text>
  <text class="s" x="670" y="396">build / full — prebuilt pull/extract (or legacy)</text>
  <text class="s" x="670" y="416">dashboard* — npm + .next/cache rebuild</text>

  <rect class="box" x="650" y="440" width="480" height="170" rx="8"/>
  <text class="h" x="670" y="468">Operator rule of thumb</text>
  <text class="s" x="670" y="492">· Day-2 Lua / rules / servers JSON ��→ code</text>
  <text class="s" x="670" y="512">· OpenResty or OS deps changed ��→ build or full</text>
  <text class="s" x="670" y="532">· Admin UI only ��→ dashboard / dashboard-next</text>
  <text class="s" x="670" y="552">· Verify: openresty -V · admin /health</text>
  <text class="s" x="670" y="572">· glibc/arch must match BASE_IMAGE</text>

  <text class="foot" x="40" y="670">wslproxy.org  ·  ringpromoter.com  ·  github.com/bwalia/wslproxy  ·  workstation.co.uk</text>
  <text class="foot" x="40" y="694">linux/amd64 today · provenance/sbom disabled in the prebuilt workflow by choice</text>
</svg>
