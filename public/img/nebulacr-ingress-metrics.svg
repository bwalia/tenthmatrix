<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="NebulaCR ingress path split, ports, Prometheus metrics, and Kubernetes smoke test">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="1" stop-color="#0e1638"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .title { fill: #ffffff; font: 800 18px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .subtitle { fill: #9fb0ff; font: 500 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .ingress { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; }
      .reg { fill: #3a1f08; stroke: #ea580c; stroke-width: 1.5; }
      .auth { fill: #0e1e3d; stroke: #2563eb; stroke-width: 1.5; }
      .metrics { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.15); stroke-width: 1.5; }
      .smoke { fill: #2a1505; stroke: #eab308; stroke-width: 1.5; }
      .boxLabel { fill: #ffffff; font: 700 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .boxText { fill: rgba(255,255,255,0.75); font: 400 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .code { fill: #ffd380; font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .codeMuted { fill: #9fb0ff; font: 400 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tag { fill: #9fb0ff; font: 700 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .pathLink { stroke: rgba(255,255,255,0.45); stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="960" height="500" fill="url(#bg)"/>
  <rect width="960" height="500" fill="url(#grid)"/>

  <text class="title" x="480" y="32" text-anchor="middle">Ingress path split, ports, and Prometheus</text>
  <text class="subtitle" x="480" y="54" text-anchor="middle">/v2 routes to nebula-registry  /  /auth routes to nebula-auth  /  metrics scraped per service</text>

  <rect x="360" y="78" width="240" height="50" rx="10" class="ingress"/>
  <text class="boxLabel" x="480" y="108" text-anchor="middle">Ingress / LoadBalancer  /  TLS</text>

  <line x1="480" y1="128" x2="280" y2="158" class="pathLink"/>
  <line x1="480" y1="128" x2="680" y2="158" class="pathLink"/>
  <text class="codeMuted" x="370" y="146">/v2</text>
  <text class="codeMuted" x="560" y="146">/auth</text>

  <g transform="translate(140,158)">
    <rect width="280" height="110" rx="10" class="reg"/>
    <text class="boxLabel" x="140" y="28" text-anchor="middle">nebula-registry</text>
    <text class="boxText" x="140" y="50" text-anchor="middle">:5000  -  OCI API, blobs, pull-through</text>
    <text class="boxText" x="140" y="68" text-anchor="middle">GET /health  /  /metrics on :9090</text>
    <text class="boxText" x="140" y="86" text-anchor="middle">S3 / GCS / Azure / filesystem</text>
    <text class="boxText" x="140" y="102" text-anchor="middle">readiness gated by blob backend</text>
  </g>

  <g transform="translate(540,158)">
    <rect width="280" height="110" rx="10" class="auth"/>
    <text class="boxLabel" x="140" y="28" text-anchor="middle">nebula-auth</text>
    <text class="boxText" x="140" y="50" text-anchor="middle">:5001  -  OIDC validation, JWT issuance</text>
    <text class="boxText" x="140" y="68" text-anchor="middle">/metrics on :9091</text>
    <text class="boxText" x="140" y="86" text-anchor="middle">Google, GitHub, GitLab, Azure AD, Okta</text>
    <text class="boxText" x="140" y="102" text-anchor="middle">JWKS cache + rotation</text>
  </g>

  <g transform="translate(40,290)">
    <rect width="880" height="90" rx="10" class="metrics"/>
    <text class="tag" x="20" y="22">EXAMPLE PROMETHEUS METRICS (curl /metrics)</text>
    <text class="code" x="20" y="44">nebulacr_http_requests_total</text>
    <text class="boxText" x="20" y="60">request count by method, path, status</text>
    <text class="code" x="20" y="80">nebulacr_http_request_duration_seconds</text>
    <text class="boxText" x="500" y="44">nebulacr_storage_operations_total</text>
    <text class="boxText" x="500" y="60">by backend (S3 / GCS / Azure / fs)</text>
    <text class="boxText" x="500" y="80">nebulacr_auth_tokens_issued_total  /  by tenant + scope</text>
  </g>

  <g transform="translate(40,400)">
    <rect width="880" height="80" rx="10" class="smoke"/>
    <text class="tag" x="20" y="22" fill="#fde68a">KUBERNETES SMOKE TEST</text>
    <text class="code" x="20" y="42">kubectl port-forward -n nebulacr svc/nebulacr-registry 5000:5000</text>
    <text class="code" x="20" y="58">curl http://localhost:5000/health    # {"status":"healthy"}</text>
    <text class="code" x="20" y="74">helm install nebulacr oci://ghcr.io/bwalia/charts/nebulacr</text>
  </g>
</svg>
