<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="AI automation across business functions">
  <title>AI automation across business functions</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="60" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">WHERE AUTOMATION HELPS FIRST</text>
  <text x="56" y="105" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="800" text-anchor="start">Same idea. Different business pains.</text>
  <rect x="56" y="170" width="260" height="200" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="76" y="215" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">Support</text>
  <text x="76" y="255" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Faster answers</text>
  <text x="76" y="285" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Less queue panic</text>
  <rect x="340" y="170" width="260" height="200" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="360" y="215" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">Sales</text>
  <text x="360" y="255" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Quicker follow-up</text>
  <text x="360" y="285" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Fewer cold leads</text>
  <rect x="624" y="170" width="260" height="200" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="644" y="215" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">Finance</text>
  <text x="644" y="255" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Faster collections</text>
  <text x="644" y="285" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Cleaner exceptions</text>
  <rect x="908" y="170" width="236" height="200" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="928" y="215" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">Ops / HR</text>
  <text x="928" y="255" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Smoother handoffs</text>
  <text x="928" y="285" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Fewer dropped tasks</text>
  <rect x="56" y="410" width="1088" height="210" rx="10" fill="#12101F" stroke="rgba(255,255,255,0.12)"/>
  <text x="80" y="460" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Pick the process that currently creates the most delay, overtime, or customer frustration.</text>
  <text x="80" y="505" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">We automate that first - then reuse the pattern across the organisation.</text>
  <text x="80" y="555" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">That is how AI stops being a pilot and starts being an operating advantage.</text>

</svg>
