<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Customer support inbox rescue workflow">
  <title>Customer support inbox rescue workflow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="60" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">CUSTOMER SUPPORT</text>
  <text x="56" y="105" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="800" text-anchor="start">Rescue the inbox without losing the human touch</text>
  <rect x="56" y="150" width="220" height="110" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="76" y="195" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Customer asks</text>
  <text x="76" y="225" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Email / chat / form</text>
  <path d="M276,205 L340,205" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="340" y="150" width="260" height="110" rx="10" fill="#2A1530" stroke="#FF004E"/>
  <text x="360" y="190" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI sorts + drafts</text>
  <text x="360" y="220" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Urgency, topic, tone</text>
  <path d="M600,205 L670,205" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="670" y="120" width="220" height="90" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="690" y="160" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Simple cases</text>
  <text x="690" y="188" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Ready reply path</text>
  <rect x="670" y="230" width="220" height="90" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="690" y="270" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Sensitive cases</text>
  <text x="690" y="298" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Human specialist</text>
  <rect x="940" y="150" width="200" height="110" rx="10" fill="#14282A" stroke="#3DD6C6"/>
  <text x="960" y="195" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Customer gets</text>
  <text x="960" y="225" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">a faster answer</text>
  <path d="M890,205 L940,205" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="56" y="320" width="1088" height="300" rx="10" fill="#12101F" stroke="rgba(255,255,255,0.12)"/>
  <text x="80" y="365" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="start">Prolonged pain this removes</text>
  <text x="80" y="405" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Queues grow faster than headcount - customers wait, staff stay late, quality slips.</text>
  <text x="80" y="445" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="start">What changes</text>
  <text x="80" y="485" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Routine asks move quickly. Angry or complex cases still reach a person - with context already prepared.</text>
  <text x="80" y="540" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Business result: shorter wait times, calmer teams, fewer lost customers.</text>
  <text x="80" y="580" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Human review stays on refunds, complaints, and anything that can damage trust.</text>

</svg>
