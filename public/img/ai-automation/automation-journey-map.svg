<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Automation journey from pain to measured results">
  <title>Automation journey from pain to measured results</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="60" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">HOW WE WORK WITH YOU</text>
  <text x="56" y="105" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="800" text-anchor="start">A clear journey from pain to measured results</text>
  <rect x="56" y="180" width="250" height="200" rx="10" fill="#2A1530" stroke="#FF004E"/>
  <text x="76" y="230" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">1. Map the pain</text>
  <text x="76" y="270" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Where time leaks</text>
  <text x="76" y="300" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Where customers wait</text>
  <text x="76" y="330" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">What is safe to automate</text>
  <rect x="360" y="180" width="250" height="200" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="380" y="230" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">2. Design the flow</text>
  <text x="380" y="270" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">AI role and rules</text>
  <text x="380" y="300" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Human checkpoints</text>
  <text x="380" y="330" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Success metrics</text>
  <rect x="664" y="180" width="250" height="200" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="684" y="230" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">3. Launch carefully</text>
  <text x="684" y="270" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Start with one process</text>
  <text x="684" y="300" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Shadow then enforce</text>
  <text x="684" y="330" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Train the team</text>
  <rect x="968" y="180" width="180" height="200" rx="10" fill="#14282A" stroke="#3DD6C6"/>
  <text x="988" y="250" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">4. Measure</text>
  <text x="988" y="290" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Time saved</text>
  <text x="988" y="320" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Quality lift</text>
  <text x="56" y="460" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">No vague AI roadmap. One painful process, one clearer flow, one set of numbers leadership can trust.</text>
  <text x="56" y="510" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Then we expand to the next bottleneck.</text>

</svg>
