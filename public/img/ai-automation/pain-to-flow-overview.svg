<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="From pain to flow overview">
  <title>From pain to flow overview</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="70" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">FROM PAIN TO FLOW</text>
  <text x="56" y="120" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="34" font-weight="800" text-anchor="start">The Monday morning problem AI automation fixes</text>
  <rect x="56" y="180" width="500" height="360" rx="10" fill="#221A2E" stroke="#FF004E"/>
  <text x="80" y="220" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">BEFORE</text>
  <text x="80" y="260" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">Overflowing inboxes</text>
  <text x="80" y="295" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Late follow-ups and lost deals</text>
  <text x="80" y="330" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Chasing invoices and approvals</text>
  <text x="80" y="365" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Managers stuck in status meetings</text>
  <text x="80" y="400" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Good people burned by busywork</text>
  <text x="80" y="450" fill="#FFB4C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Result: slower customers, higher cost</text>
  <rect x="644" y="180" width="500" height="360" rx="10" fill="#14282A" stroke="#3DD6C6"/>
  <text x="668" y="220" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">AFTER AI AUTOMATION</text>
  <text x="668" y="260" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">Requests sorted in minutes</text>
  <text x="668" y="295" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Follow-ups happen on time</text>
  <text x="668" y="330" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Exceptions rise to humans</text>
  <text x="668" y="365" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Clear status without meetings</text>
  <text x="668" y="400" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Teams focus on judgment work</text>
  <text x="668" y="450" fill="#B8F5EE" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Result: faster service, lighter load</text>
  <text x="56" y="580" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">TenthMatrix designs automation around the business pain - not around a shiny demo.</text>

</svg>
