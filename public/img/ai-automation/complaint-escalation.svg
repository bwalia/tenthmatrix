<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Complaint escalation rescue workflow">
  <title>Complaint escalation rescue workflow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>

  <text x="56" y="60" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">CUSTOMER TRUST</text>
  <text x="56" y="105" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="800">Stop angry tickets becoming brand damage</text>
  <rect x="56" y="170" width="200" height="100" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="76" y="215" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Complaint arrives</text>
  <path d="M256,220 L310,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="310" y="170" width="260" height="100" rx="10" fill="#2A1530" stroke="#FF004E"/>
  <text x="330" y="210" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">AI scores risk</text>
  <text x="330" y="238" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600">Tone, history, value</text>
  <path d="M570,220 L630,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="630" y="130" width="240" height="80" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="650" y="165" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Low risk path</text>
  <text x="650" y="190" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600">Guided reply draft</text>
  <rect x="630" y="230" width="240" height="80" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="650" y="265" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">High risk path</text>
  <text x="650" y="290" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600">Senior owner + brief</text>
  <path d="M870,220 L930,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="930" y="170" width="210" height="100" rx="10" fill="#14282A" stroke="#3DD6C6"/>
  <text x="950" y="215" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Faster recovery</text>
  <rect x="56" y="340" width="1088" height="280" rx="10" fill="#12101F" stroke="rgba(255,255,255,0.12)"/>
  <text x="80" y="385" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">Prolonged pain</text>
  <text x="80" y="425" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600">Serious complaints sit in a shared inbox while context is hunted across tools.</text>
  <text x="80" y="475" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600">AI prepares the brief, flags risk early, and routes the right person - humans still decide goodwill.</text>
  <text x="80" y="525" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Business result: fewer public escalations and calmer recovery conversations.</text>

</svg>
