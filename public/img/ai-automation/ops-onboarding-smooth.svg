<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Operations onboarding smooth workflow">
  <title>Operations onboarding smooth workflow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="60" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">OPERATIONS AND HR</text>
  <text x="56" y="105" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="800" text-anchor="start">Make onboarding feel organised again</text>
  <rect x="56" y="170" width="200" height="100" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="76" y="215" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">New starter</text>
  <path d="M256,220 L310,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="310" y="170" width="260" height="100" rx="10" fill="#2A1530" stroke="#FF004E"/>
  <text x="330" y="210" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI runs checklist</text>
  <text x="330" y="238" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Accounts, kit, training</text>
  <path d="M570,220 L630,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="630" y="140" width="240" height="80" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="650" y="175" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Managers notified</text>
  <rect x="630" y="240" width="240" height="80" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="650" y="275" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Gaps flagged early</text>
  <rect x="920" y="170" width="220" height="100" rx="10" fill="#14282A" stroke="#3DD6C6"/>
  <text x="940" y="215" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Day-one ready</text>
  <rect x="56" y="340" width="1088" height="280" rx="10" fill="#12101F" stroke="rgba(255,255,255,0.12)"/>
  <text x="80" y="385" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="start">Prolonged pain</text>
  <text x="80" y="425" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">New joiners wait on access. Managers chase IT. Productivity starts late and morale dips.</text>
  <text x="80" y="475" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Automation keeps the checklist moving and escalates only the stuck items.</text>
  <text x="80" y="525" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Business result: faster time-to-productivity and fewer chaotic first weeks.</text>

</svg>
