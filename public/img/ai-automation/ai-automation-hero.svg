<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="AI automation hero visual">
  <title>AI automation hero visual</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="720" fill="url(#bg)"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <rect x="0" y="0" width="10" height="720" fill="#FF004E"/>
  <text x="56" y="80" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">AI AUTOMATION</text>
  <text x="56" y="150" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="40" font-weight="800" text-anchor="start">Automate the work that</text>
  <text x="56" y="210" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="40" font-weight="800" text-anchor="start">slows your business down</text>
  <text x="56" y="270" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="600" text-anchor="start">Support. Sales. Finance. Operations.</text>
  <text x="56" y="310" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="600" text-anchor="start">Clear outcomes. Humans in control where it matters.</text>
  <rect x="56" y="360" width="280" height="90" rx="10" fill="#2A1530" stroke="#FF004E"/>
  <text x="76" y="400" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start">Less waiting</text>
  <text x="76" y="430" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">for customers</text>
  <rect x="360" y="360" width="280" height="90" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="380" y="400" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start">Less chasing</text>
  <text x="380" y="430" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">for your teams</text>
  <rect x="664" y="360" width="280" height="90" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="684" y="400" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start">More capacity</text>
  <text x="684" y="430" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">for real judgment</text>
  <text x="56" y="520" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Workstation builds automation around prolonged business problems - not disconnected experiments.</text>
  <text x="56" y="620" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="start">workstation.co.uk/en/ai-automation</text>

</svg>
