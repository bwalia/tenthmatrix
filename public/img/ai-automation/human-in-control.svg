<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Human in control automation model">
  <title>Human in control automation model</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="60" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">TRUST AND CONTROL</text>
  <text x="56" y="105" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="800" text-anchor="start">AI speeds the work. People keep the judgment.</text>
  <rect x="80" y="180" width="280" height="160" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="100" y="240" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">Routine work</text>
  <text x="100" y="275" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">AI can complete</text>
  <rect x="440" y="180" width="320" height="160" rx="10" fill="#2A1530" stroke="#FF004E"/>
  <text x="460" y="230" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">Checkpoint</text>
  <text x="460" y="265" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Rules + confidence</text>
  <text x="460" y="295" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Escalate when unsure</text>
  <rect x="840" y="180" width="280" height="160" rx="10" fill="#14282A" stroke="#3DD6C6"/>
  <text x="860" y="240" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">High-impact work</text>
  <text x="860" y="275" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Humans decide</text>
  <path d="M360,260 L440,260" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <path d="M760,260 L840,260" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="56" y="420" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">This is how automation stays safer than the messy manual scramble it replaces.</text>
  <text x="56" y="460" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Refunds, legal wording, large discounts, and customer complaints stay with people.</text>
  <text x="56" y="520" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">Business result: speed without gambling the brand.</text>

</svg>
