<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Sales follow-up recovery workflow">
  <title>Sales follow-up recovery workflow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="60" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">SALES AND PIPELINE</text>
  <text x="56" y="105" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="800" text-anchor="start">Stop losing deals to slow follow-up</text>
  <rect x="56" y="170" width="200" height="100" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="76" y="215" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Lead arrives</text>
  <path d="M256,220 L320,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="320" y="170" width="240" height="100" rx="10" fill="#2A1530" stroke="#FF004E"/>
  <text x="340" y="210" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI qualifies</text>
  <text x="340" y="238" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Fit, urgency, intent</text>
  <path d="M560,220 L620,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="620" y="140" width="240" height="80" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="640" y="175" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Hot lead</text>
  <text x="640" y="200" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Alert sales now</text>
  <rect x="620" y="240" width="240" height="80" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="640" y="275" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Warm lead</text>
  <text x="640" y="300" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Nurture sequence</text>
  <rect x="900" y="170" width="240" height="100" rx="10" fill="#14282A" stroke="#3DD6C6"/>
  <text x="920" y="215" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Booked conversation</text>
  <text x="920" y="243" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">or clear next step</text>
  <rect x="56" y="340" width="1088" height="280" rx="10" fill="#12101F" stroke="rgba(255,255,255,0.12)"/>
  <text x="80" y="385" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="start">Prolonged pain</text>
  <text x="80" y="425" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Leads go cold overnight. Reps spend mornings digging through CRM notes instead of talking to buyers.</text>
  <text x="80" y="470" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">AI helps by scoring interest, drafting the first reply, and reminding the right person at the right moment.</text>
  <text x="80" y="520" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Business result: more conversations from the same lead budget - without hiring another chasing team.</text>
  <text x="80" y="565" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="start">Sales still owns pricing and relationship. Automation owns the lag.</text>

</svg>
