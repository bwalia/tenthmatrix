<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Content approval fastlane workflow">
  <title>Content approval fastlane workflow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="60" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">CONTENT AND MARKETING</text>
  <text x="56" y="105" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="800" text-anchor="start">Move campaigns out of review limbo</text>
  <rect x="56" y="170" width="200" height="100" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="76" y="215" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Brief arrives</text>
  <path d="M256,220 L310,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="310" y="170" width="250" height="100" rx="10" fill="#2A1530" stroke="#FF004E"/>
  <text x="330" y="210" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI drafts options</text>
  <text x="330" y="238" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Copy, variants, checklist</text>
  <path d="M560,220 L620,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="620" y="170" width="250" height="100" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="640" y="210" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Human approves</text>
  <text x="640" y="238" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Brand and legal check</text>
  <path d="M870,220 L930,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="930" y="170" width="210" height="100" rx="10" fill="#14282A" stroke="#3DD6C6"/>
  <text x="950" y="215" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Publish on time</text>
  <rect x="56" y="340" width="1088" height="280" rx="10" fill="#12101F" stroke="rgba(255,255,255,0.12)"/>
  <text x="80" y="385" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="start">Prolonged pain</text>
  <text x="80" y="425" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Campaigns stall in email threads. Deadlines slip. Creative energy dies in version chaos.</text>
  <text x="80" y="475" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">AI prepares strong first drafts and a clear review pack. People decide what ships.</text>
  <text x="80" y="525" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Business result: more launches per quarter with the same team size.</text>

</svg>
