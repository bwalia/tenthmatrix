<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Knowledge and shift handoff workflow">
  <title>Knowledge and shift handoff workflow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>

  <text x="56" y="60" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">OPERATIONS CONTINUITY</text>
  <text x="56" y="105" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="800">End the tribal-knowledge tax on every handoff</text>
  <rect x="56" y="170" width="220" height="100" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="76" y="215" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Work in progress</text>
  <path d="M276,220 L330,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="330" y="170" width="260" height="100" rx="10" fill="#2A1530" stroke="#FF004E"/>
  <text x="350" y="210" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">AI builds brief</text>
  <text x="350" y="238" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600">Status, risks, next steps</text>
  <path d="M590,220 L650,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="650" y="170" width="240" height="100" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="670" y="215" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Incoming owner</text>
  <text x="670" y="243" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600">Ready in minutes</text>
  <path d="M890,220 L940,220" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="940" y="170" width="200" height="100" rx="10" fill="#14282A" stroke="#3DD6C6"/>
  <text x="960" y="215" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">No dropped balls</text>
  <rect x="56" y="340" width="1088" height="280" rx="10" fill="#12101F" stroke="rgba(255,255,255,0.12)"/>
  <text x="80" y="385" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">Prolonged pain</text>
  <text x="80" y="425" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600">Shift changes and holiday cover restart from scratch because context lives in one person's head.</text>
  <text x="80" y="475" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600">Automation turns tickets, notes, and systems into a short handoff that the next person can trust.</text>
  <text x="80" y="525" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Business result: fewer restarts, fewer surprises, smoother coverage.</text>

</svg>
