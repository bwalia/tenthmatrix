<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Before and after AI automation comparison">
  <title>Before and after AI automation comparison</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>

  <text x="56" y="60" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">WHAT CUSTOMERS NOTICE</text>
  <text x="56" y="105" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="800">The difference is not the model - it is the wait</text>
  <rect x="56" y="160" width="520" height="280" rx="10" fill="#221A2E" stroke="#FF004E"/>
  <text x="80" y="210" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">BEFORE</text>
  <text x="80" y="255" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700">"We will get back to you"</text>
  <text x="80" y="295" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600">Slow replies and silent gaps</text>
  <text x="80" y="335" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600">Chasing updates by email</text>
  <text x="80" y="375" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600">Staff firefighting every Monday</text>
  <rect x="624" y="160" width="520" height="280" rx="10" fill="#14282A" stroke="#3DD6C6"/>
  <text x="648" y="210" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">AFTER</text>
  <text x="648" y="255" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700">Clear next step, quickly</text>
  <text x="648" y="295" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600">Routine work moves overnight</text>
  <text x="648" y="335" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600">Exceptions reach the right person</text>
  <text x="648" y="375" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600">Leaders see progress without meetings</text>
  <text x="56" y="490" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600">Customers feel responsiveness. Teams feel less drained. Leadership sees measurable lift.</text>

</svg>
