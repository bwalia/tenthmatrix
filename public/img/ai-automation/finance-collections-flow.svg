<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Finance collections automation workflow">
  <title>Finance collections automation workflow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0B21"/>
      <stop offset="100%" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF004E"/>
      <stop offset="100%" stop-color="#3DD6C6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DD6C6"/></marker></defs>
  <text x="56" y="60" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="start">FINANCE AND CASHFLOW</text>
  <text x="56" y="105" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="800" text-anchor="start">Get paid faster without awkward chasing</text>
  <rect x="56" y="170" width="200" height="90" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="76" y="210" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Invoice due</text>
  <path d="M256,215 L310,215" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="310" y="170" width="240" height="90" rx="10" fill="#2A1530" stroke="#FF004E"/>
  <text x="330" y="205" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">AI checks status</text>
  <text x="330" y="233" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Paid / overdue / dispute</text>
  <rect x="600" y="120" width="250" height="80" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="620" y="155" fill="#3DD6C6" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Friendly reminder</text>
  <rect x="600" y="220" width="250" height="80" rx="10" fill="#1A1736" stroke="rgba(255,255,255,0.12)"/>
  <text x="620" y="255" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Escalate to finance</text>
  <rect x="900" y="170" width="240" height="90" rx="10" fill="#14282A" stroke="#3DD6C6"/>
  <text x="920" y="210" fill="#E8ECF8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Cash in sooner</text>
  <text x="920" y="238" fill="#A7B0C8" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">Fewer surprises</text>
  <path d="M550,215 L600,160" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <path d="M550,215 L600,260" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <path d="M850,215 L900,215" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#m)"/>
  <rect x="56" y="340" width="1088" height="280" rx="10" fill="#12101F" stroke="rgba(255,255,255,0.12)"/>
  <text x="80" y="385" fill="#FF004E" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="start">Prolonged pain</text>
  <text x="80" y="425" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Late payments become a weekly fire drill. Finance teams chase politely, then urgently, then desperately.</text>
  <text x="80" y="475" fill="#C9D0E8" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">Automation sends timely reminders, spots disputes early, and only involves people when judgment is needed.</text>
  <text x="80" y="525" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">Business result: healthier cashflow and less emotional labour on routine collections.</text>

</svg>
