<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Co-routines: independent routines that cooperate by handing off through GitHub events, labels and API calls">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97757"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="16" fill="#15121a"/>
  <g font-family="system-ui,sans-serif">
    <text fill="#ffffff" font-size="26" font-weight="800" x="40" y="52">Co-routines: routines that hand work to each other</text>
    <text fill="#a8a29e" font-size="15" x="40" y="80">Each routine is independent. The hand-off is a durable artefact (a PR, a label, a release, an API call), never shared memory.</text>

    <rect x="40" y="130" width="240" height="170" rx="14" fill="#211a1f" stroke="#d97757" stroke-width="2.5"/>
    <text fill="#f4a582" font-size="12" font-weight="700" letter-spacing="2" x="60" y="158">ROUTINE A · SCHEDULE</text>
    <text fill="#ffffff" font-size="18" font-weight="700" x="60" y="188">Nightly triage + fix</text>
    <text fill="#a8a29e" font-size="13" x="60" y="216">weeknights 02:07</text>
    <text fill="#a8a29e" font-size="13" x="60" y="238">picks top bug</text>
    <text fill="#a8a29e" font-size="13" x="60" y="260">opens PR from claude/fix-*</text>

    <line x1="284" y1="215" x2="346" y2="215" stroke="#10b981" stroke-width="2.5" marker-end="url(#ar)"/>
    <text fill="#6ee7b7" font-size="12" font-weight="700" x="288" y="204">PR opened</text>

    <rect x="354" y="130" width="240" height="170" rx="14" fill="#1d1a24" stroke="#8b5cf6" stroke-width="2.5"/>
    <text fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="2" x="374" y="158">ROUTINE B · GITHUB</text>
    <text fill="#ffffff" font-size="18" font-weight="700" x="374" y="188">Checklist reviewer</text>
    <text fill="#a8a29e" font-size="13" x="374" y="216">pull_request.opened</text>
    <text fill="#a8a29e" font-size="13" x="374" y="238">filter: head starts with claude/</text>
    <text fill="#a8a29e" font-size="13" x="374" y="260">inline comments + label</text>

    <line x1="598" y1="215" x2="660" y2="215" stroke="#10b981" stroke-width="2.5" marker-end="url(#ar)"/>
    <text fill="#6ee7b7" font-size="12" font-weight="700" x="606" y="204">merged</text>

    <rect x="668" y="130" width="240" height="170" rx="14" fill="#1a211f" stroke="#10b981" stroke-width="2.5"/>
    <text fill="#6ee7b7" font-size="12" font-weight="700" letter-spacing="2" x="688" y="158">ROUTINE C · GITHUB</text>
    <text fill="#ffffff" font-size="18" font-weight="700" x="688" y="188">Docs + SDK port</text>
    <text fill="#a8a29e" font-size="13" x="688" y="216">pull_request.closed</text>
    <text fill="#a8a29e" font-size="13" x="688" y="238">filter: is merged = true</text>
    <text fill="#a8a29e" font-size="13" x="688" y="260">opens docs / port PRs</text>

    <line x1="912" y1="215" x2="974" y2="215" stroke="#10b981" stroke-width="2.5" marker-end="url(#ar)"/>
    <text fill="#6ee7b7" font-size="12" font-weight="700" x="914" y="204">deploy</text>

    <rect x="982" y="130" width="180" height="170" rx="14" fill="#211a1f" stroke="#f59e0b" stroke-width="2.5"/>
    <text fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="2" x="1000" y="158">ROUTINE D · API</text>
    <text fill="#ffffff" font-size="18" font-weight="700" x="1000" y="188">Deploy verify</text>
    <text fill="#a8a29e" font-size="13" x="1000" y="216">CD pipeline POSTs</text>
    <text fill="#a8a29e" font-size="13" x="1000" y="238">/fire after release</text>
    <text fill="#a8a29e" font-size="13" x="1000" y="260">go / no-go to Slack</text>

    <path d="M1072,304 C1072,380 160,380 160,304" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ao)"/>
    <text fill="#f4a582" font-size="13" font-weight="700" x="440" y="372">no-go �→ D files a tracker issue �→ next night, Routine A picks it up</text>

    <text fill="#d97757" font-size="13" font-weight="700" letter-spacing="2" x="40" y="430">HAND-OFF CHANNELS</text>
    <rect x="40" y="446" width="270" height="92" rx="12" fill="#211a1f" stroke="#3f3a3f" stroke-width="1.5"/>
    <text fill="#ffffff" font-size="15" font-weight="700" x="58" y="476">GitHub events</text>
    <text fill="#a8a29e" font-size="13" x="58" y="500">PR opened / merged, release</text>
    <text fill="#a8a29e" font-size="13" x="58" y="520">native, filterable, auditable</text>
    <rect x="326" y="446" width="270" height="92" rx="12" fill="#211a1f" stroke="#3f3a3f" stroke-width="1.5"/>
    <text fill="#ffffff" font-size="15" font-weight="700" x="344" y="476">Labels and branch names</text>
    <text fill="#a8a29e" font-size="13" x="344" y="500">needs-backport, claude/…</text>
    <text fill="#a8a29e" font-size="13" x="344" y="520">route work without new code</text>
    <rect x="612" y="446" width="270" height="92" rx="12" fill="#211a1f" stroke="#3f3a3f" stroke-width="1.5"/>
    <text fill="#ffffff" font-size="15" font-weight="700" x="630" y="476">API /fire</text>
    <text fill="#a8a29e" font-size="13" x="630" y="500">CI, monitoring, internal tools</text>
    <text fill="#a8a29e" font-size="13" x="630" y="520">payload arrives as untrusted text</text>
    <rect x="898" y="446" width="264" height="92" rx="12" fill="#211a1f" stroke="#3f3a3f" stroke-width="1.5"/>
    <text fill="#ffffff" font-size="15" font-weight="700" x="916" y="476">Shared tracker / artifact</text>
    <text fill="#a8a29e" font-size="13" x="916" y="500">Linear issue, status page</text>
    <text fill="#a8a29e" font-size="13" x="916" y="520">read on the next schedule</text>

    <rect x="40" y="562" width="1122" height="52" rx="10" fill="#1f1b17" stroke="#3f3a3f" stroke-width="1.5"/>
    <text fill="#d6d3d1" font-size="14" x="60" y="593">Each routine keeps its own prompt, tools and trigger, so a failure stays contained to one stage. All share your account’s daily run cap.</text>
  </g>
</svg>
