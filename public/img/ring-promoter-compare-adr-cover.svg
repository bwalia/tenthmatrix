<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Ring Promoter vs Argo CD, Kargo and CI: which tool answers which release question, and why the choice belongs in an Architecture Decision Record" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0B21"/>
      <stop offset="0.6" stop-color="#221D4C"/>
      <stop offset="1" stop-color="#2C2559"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FF004E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF004E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text x="64" y="84" fill="#FF7AA2" font-size="20" font-weight="700" letter-spacing="4">RING PROMOTER  &#183;  COMPARISON  &#183;  ADR</text>
  <text x="64" y="168" fill="#FFFFFF" font-size="60" font-weight="800">Which tool answers</text>
  <text x="64" y="240" fill="#FFFFFF" font-size="60" font-weight="800">which release question?</text>
  <rect x="64" y="268" width="260" height="6" rx="3" fill="#FF004E"/>
  <text x="64" y="324" fill="#D6D3F0" font-size="26" font-weight="500">Argo CD and Flux sync. CI builds. Ring Promoter promotes.</text>
  <text x="64" y="362" fill="#D6D3F0" font-size="26" font-weight="500">Write the decision down as an ADR.</text>

  <g font-size="26" font-weight="700">
    <rect x="64" y="424" width="300" height="104" rx="16" fill="#0D0B21" stroke="#8B84D7" stroke-width="2"/>
    <text x="92" y="468" fill="#FFFFFF">Argo CD / Flux</text>
    <text x="92" y="504" fill="#B9B4E8" font-size="21" font-weight="500">Cluster matches Git?</text>

    <rect x="388" y="424" width="300" height="104" rx="16" fill="#0D0B21" stroke="#8B84D7" stroke-width="2"/>
    <text x="416" y="468" fill="#FFFFFF">CI pipeline</text>
    <text x="416" y="504" fill="#B9B4E8" font-size="21" font-weight="500">Job exited 0?</text>

    <rect x="712" y="424" width="424" height="104" rx="16" fill="#2C2559" stroke="#FF004E" stroke-width="3"/>
    <text x="740" y="468" fill="#FFFFFF">Ring Promoter</text>
    <text x="740" y="504" fill="#FFD1DE" font-size="21" font-weight="500">This exact version healthy and allowed?</text>
  </g>

  <text x="64" y="584" fill="#A9A4D8" font-size="18" font-family="ui-monospace, Menlo, Consolas, monospace">ringpromoter.com/compare  &#183;  tenthmatrix.com</text>
</svg>
