<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Claude models comparison: Haiku, Sonnet, Opus, Fable 5, Mythos 5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#0a2740"/>
      <stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #fbbf24; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 56px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: -0.6px; }
      .sub { fill: rgba(255,255,255,0.9); font: 500 16px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .tag { fill: rgba(255,255,255,0.08); stroke: rgba(251,191,36,0.35); stroke-width: 1.5; }
      .tagText { fill: #ffffff; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .chipText { fill: #ffffff; font: 700 12px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 0.3px; }
      .small { fill: rgba(255,255,255,0.75); font: 600 12px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 0.4px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text class="kicker" x="60" y="72">ANTHROPIC  /  CLAUDE  /  MODEL TIER GUIDE</text>
  <text class="title" x="60" y="158">Haiku vs Sonnet vs Opus vs Fable 5</text>
  <text class="sub" x="60" y="212">How to pick the right Claude model for quality, latency, and cost</text>

  <rect class="tag" x="60" y="248" width="170" height="36" rx="10"/>
  <text class="tagText" x="85" y="272">claude-haiku</text>

  <rect class="tag" x="240" y="248" width="180" height="36" rx="10"/>
  <text class="tagText" x="260" y="272">claude-sonnet</text>

  <rect class="tag" x="430" y="248" width="170" height="36" rx="10"/>
  <text class="tagText" x="450" y="272">claude-opus</text>

  <rect class="tag" x="610" y="248" width="160" height="36" rx="10"/>
  <text class="tagText" x="628" y="272">claude-fable-5</text>

  <text class="small" x="60" y="330">Include Mythos 5 where available (Project Glasswing)</text>

  <rect x="60" y="390" width="1080" height="2" fill="rgba(251,191,36,0.25)"/>
  <text class="chipText" x="60" y="445">Rule of thumb: route easy tasks to Haiku/ Sonnet, spend Fable 5 budget on hard, long-horizon runs.</text>

  <text class="small" x="60" y="580">WORKSTATION.CO.UK</text>
</svg>
