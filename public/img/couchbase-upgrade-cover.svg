<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Couchbase Server upgrade runbook cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="0.55" stop-color="#1a237e"/>
      <stop offset="1" stop-color="#4527a0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.65">
      <stop offset="0" stop-color="#ff5252" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5252" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #ffab91; font: 700 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 60px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.2px; }
      .tagline { fill: #ff8a65; font: 800 44px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub { fill: rgba(255,255,255,0.92); font: 500 22px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .code { fill: #ffcc80; font: 600 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .chip { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.24); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 16px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .num { fill: #ff8a65; font: 800 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .brand { fill: rgba(255,255,255,0.55); font: 700 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
      .nodeText { fill: #ffffff; font: 700 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .audience { fill: rgba(255,255,255,0.7); font: 600 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .progress { fill: rgba(255,255,255,0.10); }
      .progressFill { fill: #66bb6a; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text class="kicker" x="80" y="92">COUCHBASE  /  CAO  /  PRODUCTION RUNBOOK</text>
  <text class="title" x="80" y="170">Couchbase Server Upgrade</text>
  <text class="tagline" x="80" y="230">Paced. Paused. Predictable.</text>

  <text class="sub" x="80" y="290">Rolling upgrades on the Couchbase Autonomous Operator using</text>
  <text class="code" x="80" y="322">spec.paused</text>
  <text class="sub" x="232" y="322">as a per-node safety gate.</text>

  <g>
    <rect class="chip" x="80" y="360" rx="22" ry="22" width="300" height="48"/>
    <text class="num" x="100" y="389">01</text>
    <text class="chipText" x="140" y="389">Patch spec.image</text>

    <rect class="chip" x="400" y="360" rx="22" ry="22" width="320" height="48"/>
    <text class="num" x="420" y="389">02</text>
    <text class="chipText" x="460" y="389">Pause + stabilize</text>

    <rect class="chip" x="80" y="425" rx="22" ry="22" width="300" height="48"/>
    <text class="num" x="100" y="454">03</text>
    <text class="chipText" x="140" y="454">Health check (REST)</text>

    <rect class="chip" x="400" y="425" rx="22" ry="22" width="320" height="48"/>
    <text class="num" x="420" y="454">04</text>
    <text class="chipText" x="460" y="454">Resume + swap next</text>
  </g>

  <g transform="translate(780,140)">
    <text class="brand" x="0" y="0">CLUSTER  /  5 NODES UNDER CAO</text>

    <rect x="0" y="20" width="340" height="46" rx="12" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.24)" stroke-width="1.5"/>
    <text class="chipText" x="20" y="50">CAO operator</text>
    <text class="num" x="290" y="50">v2.9</text>

    <rect x="0" y="80" width="340" height="46" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <text class="chipText" x="20" y="110">CouchbaseCluster CR</text>
    <text class="code" x="180" y="110" font-size="14">spec.image / spec.paused</text>

    <g transform="translate(0,148)">
      <rect width="60" height="60" rx="10" fill="#1b5e20" stroke="#66bb6a" stroke-width="2"/>
      <text class="nodeText" x="30" y="29" text-anchor="middle">v2</text>
      <text class="nodeText" x="30" y="44" text-anchor="middle">OK</text>

      <rect x="70" width="60" height="60" rx="10" fill="#1b5e20" stroke="#66bb6a" stroke-width="2"/>
      <text class="nodeText" x="100" y="29" text-anchor="middle">v2</text>
      <text class="nodeText" x="100" y="44" text-anchor="middle">OK</text>

      <rect x="140" width="60" height="60" rx="10" fill="#bf360c" stroke="#ffab40" stroke-width="2"/>
      <text class="nodeText" x="170" y="29" text-anchor="middle">swap</text>
      <text class="nodeText" x="170" y="44" text-anchor="middle">v1-v2</text>

      <rect x="210" width="60" height="60" rx="10" fill="#37474f" stroke="#90a4ae" stroke-width="2" stroke-dasharray="4 4"/>
      <text class="nodeText" x="240" y="29" text-anchor="middle">paused</text>
      <text class="nodeText" x="240" y="44" text-anchor="middle">v1</text>

      <rect x="280" width="60" height="60" rx="10" fill="#1f2a55" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <text class="nodeText" x="310" y="29" text-anchor="middle">v1</text>
      <text class="nodeText" x="310" y="44" text-anchor="middle">queued</text>
    </g>

    <g transform="translate(0,232)">
      <rect class="progress" width="340" height="10" rx="5"/>
      <rect class="progressFill" width="136" height="10" rx="5"/>
      <text class="audience" x="0" y="34">40 percent complete  /  2 of 5 nodes on target image</text>
    </g>
  </g>

  <text class="brand" x="80" y="600">WORKSTATION.CO.UK</text>
  <text class="audience" x="1120" y="600" text-anchor="end">SRE  /  DBA  /  TECH SUPPORT  /  DEVELOPERS</text>
</svg>
