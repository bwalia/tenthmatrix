<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MongoDB High Availability: replica set, election, and sharding">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001E2B"/>
      <stop offset="0.55" stop-color="#022e3d"/>
      <stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#00ED64" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00ED64" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #69f0ae; font: 700 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 70px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .tagline { fill: #00ED64; font: 800 30px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub { fill: rgba(255,255,255,0.92); font: 500 18px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.24); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .num { fill: #00ED64; font: 800 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .brand { fill: rgba(255,255,255,0.55); font: 700 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
      .nodeLabel { fill: #ffffff; font: 700 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .nodeText { fill: rgba(255,255,255,0.75); font: 400 9px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .audience { fill: rgba(255,255,255,0.7); font: 600 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .laneLabel { fill: #69f0ae; font: 700 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="rgba(255,255,255,0.55)"/>
    </marker>
    <marker id="arRepl" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#42a5f5"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text class="kicker" x="60" y="80">MONGODB  /  HIGH AVAILABILITY</text>
  <text class="title" x="60" y="160">MongoDB HA</text>
  <text class="tagline" x="60" y="208">Replica set election + sharded clusters</text>
  <text class="sub" x="60" y="248">Raft-like protocol promotes a new primary in seconds. mongos hides topology from clients.</text>

  <g>
    <rect class="chip" x="60" y="290" rx="20" ry="20" width="290" height="44"/>
    <text class="num" x="80" y="317">01</text>
    <text class="chipText" x="120" y="317">Driver - mongos router</text>

    <rect class="chip" x="60" y="346" rx="20" ry="20" width="290" height="44"/>
    <text class="num" x="80" y="373">02</text>
    <text class="chipText" x="120" y="373">Shard key routing</text>

    <rect class="chip" x="60" y="402" rx="20" ry="20" width="290" height="44"/>
    <text class="num" x="80" y="429">03</text>
    <text class="chipText" x="120" y="429">Heartbeat election (2 s)</text>

    <rect class="chip" x="60" y="458" rx="20" ry="20" width="290" height="44"/>
    <text class="num" x="80" y="485">04</text>
    <text class="chipText" x="120" y="485">New primary in less than 10 s</text>
  </g>

  <g transform="translate(420,90)">
    <rect x="0" y="0" width="720" height="440" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

    <text class="laneLabel" x="20" y="28">CLIENT PLANE</text>
    <rect x="20" y="40" width="160" height="60" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <text class="nodeLabel" x="100" y="64" text-anchor="middle">Application</text>
    <text class="nodeText" x="100" y="80" text-anchor="middle">official MongoDB driver</text>
    <text class="nodeText" x="100" y="92" text-anchor="middle">retryWrites enabled</text>

    <text class="laneLabel" x="220" y="28">ROUTING + CONFIG  /  CONTROL PLANE</text>
    <g transform="translate(220,40)">
      <rect x="0" y="0" width="220" height="60" rx="10" fill="#1a1240" stroke="#6a3eff" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">mongos routers (2+)</text>
      <text class="nodeText" x="110" y="38" text-anchor="middle">stateless query router</text>
      <text class="nodeText" x="110" y="50" text-anchor="middle">caches chunk map</text>

      <rect x="240" y="0" width="240" height="60" rx="10" fill="#1a1240" stroke="#6a3eff" stroke-width="1.5"/>
      <text class="nodeLabel" x="360" y="22" text-anchor="middle">Config server replica set (3)</text>
      <text class="nodeText" x="360" y="38" text-anchor="middle">shard map + chunk metadata</text>
      <text class="nodeText" x="360" y="50" text-anchor="middle">authoritative for routing</text>
    </g>

    <text class="laneLabel" x="20" y="148">DATA PLANE  /  REPLICA SET PER SHARD</text>

    <g transform="translate(20,160)">
      <text class="nodeText" x="0" y="-2" fill="#69f0ae">SHARD A</text>
      <rect x="0" y="6" width="200" height="50" rx="10" fill="#0f3a1c" stroke="#00ED64" stroke-width="1.5"/>
      <text class="nodeLabel" x="100" y="24" text-anchor="middle">Primary</text>
      <text class="nodeText" x="100" y="40" text-anchor="middle">writes  /  oplog tail</text>

      <rect x="0" y="64" width="95" height="40" rx="10" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="47" y="80" text-anchor="middle">Secondary</text>
      <text class="nodeText" x="47" y="94" text-anchor="middle">read pref</text>

      <rect x="105" y="64" width="95" height="40" rx="10" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="152" y="80" text-anchor="middle">Secondary</text>
      <text class="nodeText" x="152" y="94" text-anchor="middle">candidate</text>

      <line x1="60" y1="56" x2="40" y2="64" stroke="#42a5f5" stroke-width="2" marker-end="url(#arRepl)"/>
      <line x1="140" y1="56" x2="155" y2="64" stroke="#42a5f5" stroke-width="2" marker-end="url(#arRepl)"/>
    </g>

    <g transform="translate(250,160)">
      <text class="nodeText" x="0" y="-2" fill="#69f0ae">SHARD B</text>
      <rect x="0" y="6" width="200" height="50" rx="10" fill="#0f3a1c" stroke="#00ED64" stroke-width="1.5"/>
      <text class="nodeLabel" x="100" y="24" text-anchor="middle">Primary</text>
      <text class="nodeText" x="100" y="40" text-anchor="middle">writes  /  oplog tail</text>

      <rect x="0" y="64" width="95" height="40" rx="10" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="47" y="80" text-anchor="middle">Secondary</text>
      <text class="nodeText" x="47" y="94" text-anchor="middle">read pref</text>

      <rect x="105" y="64" width="95" height="40" rx="10" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="152" y="80" text-anchor="middle">Secondary</text>
      <text class="nodeText" x="152" y="94" text-anchor="middle">candidate</text>

      <line x1="60" y1="56" x2="40" y2="64" stroke="#42a5f5" stroke-width="2" marker-end="url(#arRepl)"/>
      <line x1="140" y1="56" x2="155" y2="64" stroke="#42a5f5" stroke-width="2" marker-end="url(#arRepl)"/>
    </g>

    <g transform="translate(480,160)">
      <text class="nodeText" x="0" y="-2" fill="#69f0ae">SHARD C</text>
      <rect x="0" y="6" width="200" height="50" rx="10" fill="#0f3a1c" stroke="#00ED64" stroke-width="1.5"/>
      <text class="nodeLabel" x="100" y="24" text-anchor="middle">Primary</text>
      <text class="nodeText" x="100" y="40" text-anchor="middle">writes  /  oplog tail</text>

      <rect x="0" y="64" width="95" height="40" rx="10" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="47" y="80" text-anchor="middle">Secondary</text>
      <text class="nodeText" x="47" y="94" text-anchor="middle">read pref</text>

      <rect x="105" y="64" width="95" height="40" rx="10" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="152" y="80" text-anchor="middle">Arbiter</text>
      <text class="nodeText" x="152" y="94" text-anchor="middle">vote only</text>

      <line x1="60" y1="56" x2="40" y2="64" stroke="#42a5f5" stroke-width="2" marker-end="url(#arRepl)"/>
    </g>

    <line x1="220" y1="70" x2="180" y2="70" stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <line x1="330" y1="100" x2="120" y2="160" stroke="#ff9560" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
    <line x1="330" y1="100" x2="350" y2="160" stroke="#ff9560" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
    <line x1="330" y1="100" x2="580" y2="160" stroke="#ff9560" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>

    <text class="laneLabel" x="20" y="290">ELECTION (priority + optime + lastWrite)</text>
    <g transform="translate(20,300)">
      <rect x="0" y="0" width="680" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text class="nodeText" x="14" y="24">heartbeat fails (10 s)  -  call election  -  candidates compare optime  -  majority votes  -  apply pending oplog  -  step up - replica becomes PRIMARY</text>
    </g>

    <g transform="translate(20,360)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#00ED64"/>
      <text class="nodeText" x="22" y="11">Primary (writes)</text>
      <rect x="140" y="0" width="14" height="14" rx="3" fill="#2e7d32"/>
      <text class="nodeText" x="162" y="11">Secondary (reads)</text>
      <rect x="280" y="0" width="14" height="14" rx="3" fill="#6a3eff"/>
      <text class="nodeText" x="302" y="11">mongos + config control plane</text>
      <line x1="500" y1="7" x2="530" y2="7" stroke="#42a5f5" stroke-width="2"/>
      <text class="nodeText" x="536" y="11">Oplog replication</text>
    </g>
  </g>

  <text class="brand" x="60" y="600">TENTHMATRIX.COM</text>
  <text class="audience" x="1140" y="600" text-anchor="end">SRE  /  DBA  /  PLATFORM TEAMS</text>
</svg>
