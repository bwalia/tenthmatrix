<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Longhorn on k3s: distributed block storage with PVC expansion and replicated replicas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a14"/>
      <stop offset="0.55" stop-color="#0a4a30"/>
      <stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #a5d6a7; font: 700 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 60px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .tagline { fill: #66bb6a; font: 800 26px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub { fill: rgba(255,255,255,0.92); font: 500 17px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.24); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .num { fill: #66bb6a; font: 800 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .brand { fill: rgba(255,255,255,0.55); font: 700 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
      .nodeLabel { fill: #ffffff; font: 700 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .nodeText { fill: rgba(255,255,255,0.75); font: 400 9px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .audience { fill: rgba(255,255,255,0.7); font: 600 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .laneLabel { fill: #a5d6a7; font: 700 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
    <marker id="arRepl" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#42a5f5"/>
    </marker>
    <marker id="arCtrl" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ff9560"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text class="kicker" x="60" y="80">LONGHORN  /  K3S  /  DISTRIBUTED BLOCK STORAGE</text>
  <text class="title" x="60" y="156">Longhorn HA</text>
  <text class="tagline" x="60" y="200">3-way replicas + online PVC expansion</text>
  <text class="sub" x="60" y="240">Volume = engine + replica replicas spread across nodes. Manager reconciles VolumeReplica CRs.</text>

  <g>
    <rect class="chip" x="60" y="282" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="308">01</text>
    <text class="chipText" x="120" y="308">Pod  -  PVC  -  Longhorn volume</text>

    <rect class="chip" x="60" y="336" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="362">02</text>
    <text class="chipText" x="120" y="362">Engine fans to N replicas</text>

    <rect class="chip" x="60" y="390" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="416">03</text>
    <text class="chipText" x="120" y="416">Replicas on distinct nodes</text>

    <rect class="chip" x="60" y="444" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="470">04</text>
    <text class="chipText" x="120" y="470">Online expand + S3 backup</text>
  </g>

  <g transform="translate(420,90)">
    <rect x="0" y="0" width="720" height="450" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

    <text class="laneLabel" x="20" y="28">CONTROL PLANE  /  LONGHORN MANAGER + UI</text>
    <rect x="20" y="40" width="680" height="50" rx="10" fill="#1a1240" stroke="#6a3eff" stroke-width="1.5"/>
    <text class="nodeLabel" x="40" y="64">Longhorn manager (DaemonSet)</text>
    <text class="nodeText" x="280" y="64">reconciles Volume / Engine / Replica CRs</text>
    <text class="nodeText" x="540" y="64">snapshot + recurring backup jobs</text>

    <text class="laneLabel" x="20" y="116">DATA PLANE  /  3 K3S NODES  /  3-WAY REPLICAS</text>

    <g transform="translate(20,128)">
      <rect width="220" height="160" rx="12" fill="#0c2b18" stroke="#22c55e" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">Node 1  /  k3s</text>
      <rect x="14" y="34" width="60" height="50" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)"/>
      <text class="nodeText" x="44" y="56" text-anchor="middle">disk-1</text>
      <text class="nodeText" x="44" y="70" text-anchor="middle">NVMe</text>
      <rect x="80" y="34" width="60" height="50" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)"/>
      <text class="nodeText" x="110" y="56" text-anchor="middle">disk-2</text>
      <text class="nodeText" x="110" y="70" text-anchor="middle">SSD</text>
      <rect x="146" y="34" width="60" height="50" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)"/>
      <text class="nodeText" x="176" y="56" text-anchor="middle">disk-3</text>
      <text class="nodeText" x="176" y="70" text-anchor="middle">HDD</text>
      <rect x="14" y="94" width="192" height="22" rx="6" fill="#0f3a1c" stroke="#22c55e"/>
      <text class="nodeText" x="110" y="108" text-anchor="middle">engine: vol-app-db-0</text>
      <rect x="14" y="122" width="192" height="22" rx="6" fill="rgba(34,197,94,0.15)" stroke="#22c55e"/>
      <text class="nodeText" x="110" y="136" text-anchor="middle">replica-A (primary)</text>
    </g>

    <g transform="translate(252,128)">
      <rect width="220" height="160" rx="12" fill="#0c2b18" stroke="#22c55e" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">Node 2  /  k3s</text>
      <rect x="14" y="34" width="60" height="50" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)"/>
      <text class="nodeText" x="44" y="56" text-anchor="middle">disk-1</text>
      <text class="nodeText" x="44" y="70" text-anchor="middle">NVMe</text>
      <rect x="80" y="34" width="60" height="50" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)"/>
      <text class="nodeText" x="110" y="56" text-anchor="middle">disk-2</text>
      <text class="nodeText" x="110" y="70" text-anchor="middle">SSD</text>
      <rect x="146" y="34" width="60" height="50" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)"/>
      <text class="nodeText" x="176" y="56" text-anchor="middle">disk-3</text>
      <text class="nodeText" x="176" y="70" text-anchor="middle">HDD</text>
      <rect x="14" y="94" width="192" height="22" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
      <text class="nodeText" x="110" y="108" text-anchor="middle">(no engine here)</text>
      <rect x="14" y="122" width="192" height="22" rx="6" fill="rgba(34,197,94,0.15)" stroke="#22c55e"/>
      <text class="nodeText" x="110" y="136" text-anchor="middle">replica-B</text>
    </g>

    <g transform="translate(484,128)">
      <rect width="220" height="160" rx="12" fill="#0c2b18" stroke="#22c55e" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">Node 3  /  k3s</text>
      <rect x="14" y="34" width="60" height="50" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)"/>
      <text class="nodeText" x="44" y="56" text-anchor="middle">disk-1</text>
      <text class="nodeText" x="44" y="70" text-anchor="middle">NVMe</text>
      <rect x="80" y="34" width="60" height="50" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)"/>
      <text class="nodeText" x="110" y="56" text-anchor="middle">disk-2</text>
      <text class="nodeText" x="110" y="70" text-anchor="middle">SSD</text>
      <rect x="146" y="34" width="60" height="50" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)"/>
      <text class="nodeText" x="176" y="56" text-anchor="middle">disk-3</text>
      <text class="nodeText" x="176" y="70" text-anchor="middle">HDD</text>
      <rect x="14" y="94" width="192" height="22" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
      <text class="nodeText" x="110" y="108" text-anchor="middle">(no engine here)</text>
      <rect x="14" y="122" width="192" height="22" rx="6" fill="rgba(34,197,94,0.15)" stroke="#22c55e"/>
      <text class="nodeText" x="110" y="136" text-anchor="middle">replica-C</text>
    </g>

    <line x1="206" y1="254" x2="252" y2="254" stroke="#42a5f5" stroke-width="2" marker-end="url(#arRepl)"/>
    <line x1="206" y1="266" x2="484" y2="266" stroke="#42a5f5" stroke-width="2" marker-end="url(#arRepl)"/>
    <line x1="350" y1="90" x2="350" y2="128" stroke="#ff9560" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arCtrl)"/>

    <text class="laneLabel" x="20" y="316">OPS  /  ONLINE EXPAND + BACKUP</text>
    <g transform="translate(20,328)">
      <rect width="680" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text class="nodeText" x="14" y="24">kubectl patch pvc - storage  -  manager grows replicas online  -  filesystem resize2fs / xfs_growfs in pod  -  recurring snapshots + S3 backup</text>
    </g>

    <g transform="translate(20,384)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#22c55e"/>
      <text class="nodeText" x="22" y="11">Replica (data)</text>
      <rect x="130" y="0" width="14" height="14" rx="3" fill="#6a3eff"/>
      <text class="nodeText" x="152" y="11">Manager (control)</text>
      <line x1="290" y1="7" x2="320" y2="7" stroke="#42a5f5" stroke-width="2"/>
      <text class="nodeText" x="326" y="11">Sync write (engine)</text>
      <line x1="460" y1="7" x2="490" y2="7" stroke="#ff9560" stroke-width="2" stroke-dasharray="6 4"/>
      <text class="nodeText" x="496" y="11">Reconcile / CR</text>
    </g>
  </g>

  <text class="brand" x="60" y="600">TENTHMATRIX.COM</text>
  <text class="audience" x="1140" y="600" text-anchor="end">SRE  /  PLATFORM TEAMS</text>
</svg>
