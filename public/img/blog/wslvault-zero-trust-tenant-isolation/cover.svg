<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="WSL Vault zero-trust tenant isolation for compliance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1c1410"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <style>
      .eyebrow { fill: #f59e0b; font: 700 18px ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; letter-spacing: 0.08em; }
      .title { fill: #f8fafc; font: 800 42px ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; }
      .sub { fill: #cbd5e1; font: 500 20px ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; }
      .chip { fill: #111827; stroke: #f59e0b; stroke-width: 2; }
      .chip-t { fill: #fde68a; font: 700 14px ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; }
      .foot { fill: #94a3b8; font: 500 14px ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="180" fill="#f59e0b" fill-opacity="0.08"/>
  <circle cx="1040" cy="480" r="220" fill="#0ea5e9" fill-opacity="0.10"/>
  <text class="eyebrow" x="64" y="110">WSL VAULT  ·  COMPLIANCE</text>
  <text class="title" x="64" y="190">One team. One tenant.</text>
  <text class="title" x="64" y="250">Never another&#x2019;s secrets.</text>
  <text class="sub" x="64" y="310">Zero-trust custody for regulators, auditors, and boards</text>
  <rect class="chip" x="64" y="360" width="210" height="44" rx="8"/>
  <text class="chip-t" x="84" y="388">No shared root token</text>
  <rect class="chip" x="290" y="360" width="200" height="44" rx="8"/>
  <text class="chip-t" x="310" y="388">Dual-tenant control</text>
  <rect class="chip" x="510" y="360" width="180" height="44" rx="8"/>
  <text class="chip-t" x="530" y="388">Stops sprawl</text>
  <text class="foot" x="64" y="560">wslvault.org  ·  tenthmatrix.com</text>
