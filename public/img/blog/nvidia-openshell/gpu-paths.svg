<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="When to use host Apple GPU inference versus NVIDIA GPU passthrough in OpenShell sandboxes">
  <defs>
    <style>
      .t { fill: #0d0b21; font: 800 22px system-ui, sans-serif; }
      .th { fill: #475569; font: 700 13px system-ui, sans-serif; }
      .td { fill: #1e293b; font: 500 14px system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc" rx="16"/>
  <text class="t" x="48" y="48">Pick the right GPU path</text>
  <rect x="48" y="80" width="1104" height="520" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="48" y="80" width="1104" height="44" fill="#15132b" rx="12"/>
  <rect x="48" y="108" width="1104" height="16" fill="#15132b"/>
  <text fill="#fff" font="700 14px system-ui" x="72" y="108">Scenario</text>
  <text fill="#fff" font="700 14px system-ui" x="420" y="108">Hardware</text>
  <text fill="#fff" font="700 14px system-ui" x="720" y="108">OpenShell setup</text>
  <text fill="#fff" font="700 14px system-ui" x="980" y="108">Notes</text>
  <!-- Row 1 Mac -->
  <line x1="72" y1="160" x2="1128" y2="160" stroke="#e2e8f0"/>
  <text class="td" x="72" y="195">Private agents on desk / studio</text>
  <text class="td" x="420" y="195">Mac Studio M-series</text>
  <text class="td" x="720" y="185">Gateway on macOS +</text>
  <text class="td" x="720" y="205">host Ollama/MLX</text>
  <text class="td" x="980" y="195">Apple GPU on host</text>
  <!-- Row 2 DGX -->
  <line x1="72" y1="240" x2="1128" y2="240" stroke="#e2e8f0"/>
  <text class="td" x="72" y="275">Production agent pods</text>
  <text class="td" x="420" y="275">DGX / Linux + NVIDIA</text>
  <text class="td" x="720" y="265">sandbox create --gpu</text>
  <text class="td" x="720" y="285">+ Container Toolkit</text>
  <text class="td" x="980" y="275">CDI device pick</text>
  <!-- Row 3 K8s -->
  <line x1="72" y1="320" x2="1128" y2="320" stroke="#e2e8f0"/>
  <text class="td" x="72" y="355">Shared cluster</text>
  <text class="td" x="420" y="355">Kubernetes</text>
  <text class="td" x="720" y="345">compute_drivers = kubernetes</text>
  <text class="td" x="720" y="365">nvidia.com/gpu limits</text>
  <text class="td" x="980" y="355">Team workspaces</text>
  <!-- Row 4 hybrid -->
  <line x1="72" y1="400" x2="1128" y2="400" stroke="#e2e8f0"/>
  <text class="td" x="72" y="435">Hybrid router</text>
  <text class="td" x="420" y="435">Mac + cloud overflow</text>
  <text class="td" x="720" y="425">Local gateway +</text>
  <text class="td" x="720" y="445">cloud API fallback</text>
  <text class="td" x="980" y="435">Policy on both lanes</text>
  <rect x="72" y="480" width="1056" height="96" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text fill="#047857" font="700 14px system-ui" x="92" y="512">TenthMatrix takeaway</text>
  <text class="td" x="92" y="540">OpenShell is not NVIDIA-only hardware. On a Mac Studio GPU machine you run the gateway locally and let the Apple GPU power inference on the host while sandboxes stay isolated.</text>
  <text class="td" x="92" y="562">On NVIDIA Linux workstations you can additionally pass GPUs into sandboxes with --gpu for in-sandbox CUDA workloads.</text>
</svg>
