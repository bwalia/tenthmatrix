<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="OpenShell architecture: gateway, supervisor, sandboxes, and policy enforcement">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f7fc"/>
      <stop offset="1" stop-color="#eceaf5"/>
    </linearGradient>
    <style>
      .label { fill: #1e1b4b; font: 700 15px system-ui, sans-serif; }
      .small { fill: #475569; font: 500 13px system-ui, sans-serif; }
      .title { fill: #0d0b21; font: 800 22px system-ui, sans-serif; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .gw { fill: #15132b; stroke: #76b900; stroke-width: 2.5; }
      .gwText { fill: #ffffff; font: 700 16px system-ui, sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)" rx="16"/>
  <text class="title" x="48" y="48">How OpenShell governs agents (Workstation view)</text>
  <text class="small" x="48" y="76">Agent logic stays in the sandbox; credentials, network, and inference routes stay outside.</text>
  <!-- Gateway -->
  <rect class="gw" x="420" y="110" width="360" height="88" rx="14"/>
  <text class="gwText" x="460" y="150">OpenShell Gateway</text>
  <text fill="rgba(255,255,255,0.75)" font="500 13px system-ui" x="460" y="175">lifecycle · workspaces · policy · inference routes</text>
  <!-- Sandboxes -->
  <rect class="box" x="80" y="280" width="300" height="200" rx="14"/>
  <text class="label" x="110" y="318">Sandbox A</text>
  <text class="small" x="110" y="345">Supervisor + agent (Claude, OpenClaw, &amp;)</text>
  <rect x="110" y="365" width="240" height="36" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text fill="#047857" font="600 12px system-ui" x="125" y="388">Egress via policy proxy</text>
  <rect class="box" x="450" y="280" width="300" height="200" rx="14"/>
  <text class="label" x="480" y="318">Sandbox B</text>
  <text class="small" x="480" y="345">Isolated filesystem + child processes</text>
  <rect x="480" y="365" width="240" height="36" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text fill="#1d4ed8" font="600 12px system-ui" x="495" y="388">MCP / HTTP read vs write rules</text>
  <rect class="box" x="820" y="280" width="300" height="200" rx="14"/>
  <text class="label" x="850" y="318">Sandbox C</text>
  <text class="small" x="850" y="345">Optional --gpu (NVIDIA hosts)</text>
  <rect x="850" y="365" width="240" height="36" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text fill="#b45309" font="600 12px system-ui" x="865" y="388">Local inference endpoint</text>
  <!-- Arrows -->
  <path class="arrow" d="M600 198 L200 280"/>
  <path class="arrow" d="M600 198 L600 280"/>
  <path class="arrow" d="M600 198 L970 280"/>
  <!-- External -->
  <rect x="80" y="540" width="1040" height="100" rx="14" fill="#fff" stroke="#ff004e" stroke-width="2"/>
  <text class="label" x="110" y="578">Outside the agent workload</text>
  <text class="small" x="110" y="605">Real API keys, formal policy verification, audit logs, openshell term dashboard</text>
  <text class="small" x="110" y="628">Reference: NVIDIA Open Agent Safety Platform (OpenShell + Sentry + BlueField)</text>
</svg>
