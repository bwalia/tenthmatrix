<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Workstation AI Shop promoted through Ring Promoter int test acc prod">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07060f"/>
      <stop offset="0.55" stop-color="#12102a"/>
      <stop offset="1" stop-color="#0a1a12"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.72" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.2" cy="0.25" r="0.4">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .k { fill: #86efac; font: 700 12px system-ui, sans-serif; letter-spacing: 2.5px; }
      .t { fill: #fff; font: 800 40px system-ui, sans-serif; letter-spacing: -0.5px; }
      .s { fill: rgba(255,255,255,0.86); font: 500 17px system-ui, sans-serif; }
      .chip { fill: rgba(255,255,255,0.06); stroke: rgba(34,197,94,0.5); stroke-width: 1.5; }
      .ct { fill: #fff; font: 700 13px system-ui, sans-serif; }
      .b { fill: rgba(255,255,255,0.45); font: 700 11px system-ui, sans-serif; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <text class="k" x="56" y="72">WORKSTATION AI SHOP  /  RING PROMOTER</text>
  <text class="t" x="56" y="145">GPU shop releases</text>
  <text class="t" x="56" y="200">that earn every ring</text>
  <text class="s" x="56" y="255">int -&gt; test -&gt; acc -&gt; prod — AI sales agent, same promotion protocol.</text>
  <rect class="chip" x="56" y="300" width="70" height="34" rx="8"/>
  <text class="ct" x="74" y="322">INT</text>
  <rect class="chip" x="140" y="300" width="78" height="34" rx="8"/>
  <text class="ct" x="156" y="322">TEST</text>
  <rect class="chip" x="232" y="300" width="70" height="34" rx="8"/>
  <text class="ct" x="250" y="322">ACC</text>
  <rect class="chip" x="316" y="300" width="82" height="34" rx="8"/>
  <text class="ct" x="334" y="322">PROD</text>
  <text class="b" x="56" y="580">FOR RELEASE ENGINEERS AND STAKEHOLDERS</text>
  <!-- orbit hint -->
  <circle cx="920" cy="320" r="180" fill="none" stroke="rgba(34,197,94,0.25)" stroke-width="2"/>
  <circle cx="920" cy="320" r="130" fill="none" stroke="rgba(34,197,94,0.35)" stroke-width="2"/>
  <circle cx="920" cy="320" r="80" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="2"/>
  <circle cx="920" cy="320" r="28" fill="#1d4ed8"/>
  <circle cx="920" cy="140" r="10" fill="#38bdf8"/>
  <text fill="#7dd3fc" font="700 12px system-ui" x="880" y="120">AI Shop</text>
</svg>
