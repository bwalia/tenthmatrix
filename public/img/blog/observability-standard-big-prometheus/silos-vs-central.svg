<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Siloed monitoring versus centralised observability">
  <defs>
    <style>
      .title { fill: #0f172a; font: 800 26px ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; }
      .sub { fill: #475569; font: 500 14px ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; }
      .h { fill: #0f172a; font: 700 15px ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; }
      .p { fill: #334155; font: 500 13px ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; }
      .bad { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
      .ok { fill: #ecfdf5; stroke: #0d9488; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text class="title" x="48" y="48">From monitoring silos to one observability standard</text>
  <text class="sub" x="48" y="78">Managers own the standard; engineers choose implementations inside the fence</text>

  <rect class="bad" x="48" y="120" width="520" height="540" rx="14"/>
  <text class="h" x="76" y="160">Optional / fragmented (common failure)</text>
  <rect class="box" x="80" y="200" width="200" height="70" rx="8"/>
  <text class="p" x="100" y="240">Team A Grafana</text>
  <rect class="box" x="320" y="200" width="200" height="70" rx="8"/>
  <text class="p" x="340" y="240">Team B Datadog</text>
  <rect class="box" x="80" y="300" width="200" height="70" rx="8"/>
  <text class="p" x="100" y="340">Logs in Slack</text>
  <rect class="box" x="320" y="300" width="200" height="70" rx="8"/>
  <text class="p" x="340" y="340">Traces nowhere</text>
  <rect class="box" x="80" y="400" width="440" height="70" rx="8"/>
  <text class="p" x="100" y="440">N Prometheus servers, no global query</text>
  <text class="p" x="80" y="520">Incident cost: slow MTTR, duplicate spend,</text>
  <text class="p" x="80" y="545">no single board view, audit gaps.</text>
  <text class="p" x="80" y="590">Observability treated as a team hobby.</text>

  <rect class="ok" x="620" y="120" width="532" height="540" rx="14"/>
  <text class="h" x="648" y="160">Standard / centralised (Workstation model)</text>
  <rect class="box" x="660" y="200" width="450" height="70" rx="8"/>
  <text class="p" x="680" y="240">One telemetry contract (OpenTelemetry)</text>
  <rect class="box" x="660" y="290" width="450" height="70" rx="8"/>
  <text class="p" x="680" y="330">Prometheus-compatible metrics fabric</text>
  <rect class="box" x="660" y="380" width="450" height="70" rx="8"/>
  <text class="p" x="680" y="420">Global query + long-term store</text>
  <rect class="box" x="660" y="470" width="450" height="70" rx="8"/>
  <text class="p" x="680" y="510">Shared dashboards, alerts, on-call</text>
  <text class="p" x="660" y="580">Board question answered: is the estate healthy?</text>
  <text class="p" x="660" y="610">Yes / no  with evidence, not folklore.</text>
</svg>
