<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Jobshout SEO Analyst AI Agent — analyse any website, get the SEO report, fix the issues">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="0.5" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#0a2a26"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="0.22" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.88" cy="0.72" r="0.45">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#tealGlow)"/>
  <rect width="1280" height="720" fill="url(#amberGlow)"/>

  <g opacity="0.08" stroke="#5eead4" stroke-width="1">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280"/>
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720"/>
  </g>

  <!-- Left copy -->
  <text fill="#5eead4" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" x="64" y="86">JOBSHOUT  /  AI AGENT</text>
  <text filter="url(#softGlow)" fill="#ffffff" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" x="64" y="180">SEO Analyst</text>
  <text fill="#ffffff" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" x="64" y="268">AI Agent</text>
  <rect x="64" y="298" width="420" height="4" fill="#14b8a6" opacity="0.9"/>
  <text fill="#e2e8f0" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" x="64" y="360">Analyse any website.</text>
  <text fill="#e2e8f0" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" x="64" y="402">Get the report. Fix the issues.</text>
  <text fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="500" x="64" y="468">Crawl  ·  Score  ·  Prioritise  ·  Remediate</text>
  <text fill="#64748b" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" x="64" y="660">jobshout.co.uk</text>

  <!-- Right: SEO report panel -->
  <g transform="translate(660,90)">
    <rect x="0" y="0" width="540" height="520" rx="18" fill="#07141f" stroke="#14b8a6" stroke-width="2"/>
    <text fill="#5eead4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" x="28" y="42">seo-analyst · live run</text>
    <text fill="#64748b" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" x="28" y="68">target: https://example.com</text>

    <!-- Score ring -->
    <circle cx="110" cy="170" r="58" fill="none" stroke="#1e293b" stroke-width="12"/>
    <circle cx="110" cy="170" r="58" fill="none" stroke="#14b8a6" stroke-width="12" stroke-dasharray="280 365" stroke-linecap="round" transform="rotate(-90 110 170)"/>
    <text fill="#ffffff" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" x="82" y="180">72</text>
    <text fill="#94a3b8" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" x="78" y="202">/ 100</text>

    <text fill="#f8fafc" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" x="200" y="148">SEO health</text>
    <text fill="#94a3b8" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" x="200" y="178">18 findings · 6 critical</text>
    <text fill="#fbbf24" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" x="200" y="208">Priority: fix titles + Core Web Vitals</text>

    <!-- Finding rows -->
    <rect x="28" y="260" width="484" height="52" rx="10" fill="#0f1c2a" stroke="#334155"/>
    <circle cx="54" cy="286" r="8" fill="#ef4444"/>
    <text fill="#f8fafc" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" x="78" y="282">Missing meta descriptions</text>
    <text fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" x="78" y="302">12 pages · high impact</text>

    <rect x="28" y="326" width="484" height="52" rx="10" fill="#0f1c2a" stroke="#334155"/>
    <circle cx="54" cy="352" r="8" fill="#f59e0b"/>
    <text fill="#f8fafc" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" x="78" y="348">Thin content / weak H1 structure</text>
    <text fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" x="78" y="368">8 pages · medium</text>

    <rect x="28" y="392" width="484" height="52" rx="10" fill="#0f1c2a" stroke="#334155"/>
    <circle cx="54" cy="418" r="8" fill="#14b8a6"/>
    <text fill="#f8fafc" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" x="78" y="414">Sitemap + robots.txt OK</text>
    <text fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" x="78" y="434">passed · keep</text>

    <text fill="#5eead4" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" x="28" y="490">Report ready · fixes queued for approval</text>
  </g>
</svg>
