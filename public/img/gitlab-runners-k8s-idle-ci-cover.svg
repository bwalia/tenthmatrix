  <text x="72" y="280" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="48">on Kubernetes</text>
  <text x="72" y="360" fill="#a7b0c8" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="28">Scale up by day · down at night</text>
  <text x="72" y="520" fill="#FF004E" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.12em">WORKSTATION</text>
