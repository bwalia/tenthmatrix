<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Claude Opus 5 on AWS Bedrock - Workstation guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#132033"/>
      <stop offset="1" stop-color="#1a1528"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.2" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#ff9900" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #fbbf24; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 44px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: -0.5px; }
      .sub { fill: rgba(255,255,255,0.86); font: 500 17px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.08); stroke: rgba(251,191,36,0.4); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .brand { fill: rgba(255,255,255,0.5); font: 700 12px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <text class="kicker" x="60" y="78">CLAUDE OPUS 5  /  AMAZON BEDROCK  /  AWS</text>
  <text class="title" x="60" y="150">Claude Opus 5 on AWS</text>
  <text class="title" x="60" y="208">for builders and business</text>
  <text class="sub" x="60" y="265">Agentic coding, long-running agents, ZDR on Bedrock - TenthMatrix field guide.</text>
  <rect class="chip" x="60" y="320" width="120" height="36" rx="8"/>
  <text class="chipText" x="82" y="343">Opus 5</text>
  <rect class="chip" x="195" y="320" width="120" height="36" rx="8"/>
  <text class="chipText" x="215" y="343">Bedrock</text>
  <rect class="chip" x="330" y="320" width="90" height="36" rx="8"/>
  <text class="chipText" x="352" y="343">ZDR</text>
  <rect class="chip" x="435" y="320" width="140" height="36" rx="8"/>
  <text class="chipText" x="455" y="343">1M context</text>
  <text class="brand" x="60" y="580">TENTHMATRIX.COM</text>
