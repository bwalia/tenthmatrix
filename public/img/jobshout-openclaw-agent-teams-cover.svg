<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Jobshout and OpenClaw auto-build AI agent teams for business">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#0c1f33"/>
      <stop offset="1" stop-color="#0a2a28"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.2" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.9" cy="0.8" r="0.45">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #5eead4; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 44px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: -0.5px; }
      .sub { fill: rgba(255,255,255,0.86); font: 500 17px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.07); stroke: rgba(94,234,212,0.4); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .brand { fill: rgba(255,255,255,0.5); font: 700 12px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <text class="kicker" x="60" y="78">JOBSHOUT  x  OPENCLAW  /  AGENT TEAMS</text>
  <text class="title" x="60" y="150">Auto-build AI teams</text>
  <text class="title" x="60" y="208">that ship for business</text>
  <text class="sub" x="60" y="265">Jobshout composes the crew. OpenClaw runs the agents. GitOps delivers.</text>
  <rect class="chip" x="60" y="320" width="130" height="36" rx="8"/>
  <text class="chipText" x="82" y="343">Jobshout</text>
  <rect class="chip" x="205" y="320" width="130" height="36" rx="8"/>
  <text class="chipText" x="225" y="343">OpenClaw</text>
  <rect class="chip" x="350" y="320" width="150" height="36" rx="8"/>
  <text class="chipText" x="372" y="343">Agent crews</text>
  <rect class="chip" x="515" y="320" width="110" height="36" rx="8"/>
  <text class="chipText" x="540" y="343">GitOps</text>
  <text class="brand" x="60" y="580">FAST  /  EFFICIENT  /  BUSINESS OUTCOMES</text>
</svg>
