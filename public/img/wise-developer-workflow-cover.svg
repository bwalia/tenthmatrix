<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Wise developer workflow: ADR, PR, GitOps, Review Bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/>
      <stop offset="0.5" stop-color="#12253a"/>
      <stop offset="1" stop-color="#0a1f1a"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.2" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.75" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #86efac; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 42px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: -0.4px; }
      .sub { fill: rgba(255,255,255,0.88); font: 500 17px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.08); stroke: rgba(134,239,172,0.4); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .brand { fill: rgba(255,255,255,0.5); font: 700 12px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <text class="kicker" x="60" y="72">BRAINSTORM  /  ADR  /  PR  /  GITOPS  /  REVIEW BOT</text>
  <text class="title" x="60" y="145">How a wise developer</text>
  <text class="title" x="60" y="200">ships production code</text>
  <text class="sub" x="60" y="255">From whiteboard to GitOps — with Review Bots that write the PR comments for you.</text>
  <rect class="chip" x="60" y="310" width="110" height="34" rx="8"/>
  <text class="chipText" x="80" y="332">ADR</text>
  <rect class="chip" x="185" y="310" width="90" height="34" rx="8"/>
  <text class="chipText" x="205" y="332">PR</text>
  <rect class="chip" x="290" y="310" width="120" height="34" rx="8"/>
  <text class="chipText" x="310" y="332">GitOps</text>
  <rect class="chip" x="425" y="310" width="150" height="34" rx="8"/>
  <text class="chipText" x="445" y="332">Review Bot</text>
  <rect class="chip" x="590" y="310" width="90" height="34" rx="8"/>
  <text class="chipText" x="610" y="332">FDE</text>
  <text class="brand" x="60" y="580">WORKSTATION.CO.UK</text>
</svg>
