<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Serving stack combining vLLM, PowerInfer, Self-Debugging and EG-MLA">
  <rect width="1200" height="520" fill="#0b1220"/>
  <text fill="#67e8f9" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" x="40" y="40">TURBO STACK</text>
  <text fill="#f8fafc" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" x="40" y="74">Combine techniques; measure latency, memory, accuracy</text>
  <rect x="40" y="110" width="260" height="320" rx="14" fill="#111827" stroke="#22d3ee"/>
  <text fill="#22d3ee" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" x="60" y="150">vLLM</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="60" y="184">Continuous batching</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="60" y="208">PagedAttention KV</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="60" y="232">OpenAI-compatible API</text>
  <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" x="60" y="280">Watch: GPU util vs TTFT</text>
  <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" x="60" y="304">and p95 decode latency.</text>
  <rect x="326" y="110" width="260" height="320" rx="14" fill="#111827" stroke="#34d399"/>
  <text fill="#34d399" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" x="346" y="150">PowerInfer</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="346" y="184">Hot/cold neuron split</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="346" y="208">CPU+GPU locality</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="346" y="232">13.20 tok/s avg 4090</text>
  <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" x="346" y="280">Peak 29.08 tok/s reported</text>
  <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" x="346" y="304">vs llama.cpp up to 11.69x</text>
  <rect x="612" y="110" width="260" height="320" rx="14" fill="#111827" stroke="#fbbf24"/>
  <text fill="#fbbf24" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" x="632" y="150">Self-Debugging</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="632" y="184">Few-shot debug loops</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="632" y="208">Fewer candidate programs</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="632" y="232">Accuracy vs extra latency</text>
  <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" x="632" y="280">Cap feedback rounds in prod</text>
  <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" x="632" y="304">so agents do not stall.</text>
  <rect x="898" y="110" width="260" height="320" rx="14" fill="#111827" stroke="#f472b6"/>
  <text fill="#f472b6" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" x="918" y="150">EG-MLA</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="918" y="184">Embedding-gated MLA</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="918" y="208">~91.6% KV size cut vs MHA</text>
  <text fill="#cbd5e1" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" x="918" y="232">+ up to 59.9% vs MLA</text>
  <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" x="918" y="280">Validate reasoning benches</text>
  <text fill="#94a3b8" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="12" x="918" y="304">before swapping attention.</text>
</svg>
