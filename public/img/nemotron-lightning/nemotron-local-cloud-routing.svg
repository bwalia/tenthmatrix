<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"><title>Local-first routing: the agent harness sends each step to Nemotron 3.5 Lightning on the local Ollama server; steps that fail validation, need deep planning or exceed a budget escalate to a larger cloud model through the same Ollama API</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44565b"/></marker></defs><rect width="1200" height="560" fill="#ffffff"/><text x="40" y="46" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600">A local tier alongside the cloud</text><text x="40" y="74" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400">One harness, one API. The router decides per step, not per project.</text><rect x="40" y="110" width="240" height="120" rx="8" fill="#eef2f1" stroke="#8a9a9e" stroke-width="1.3"/><text x="160" y="148" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600">Agent harness</text><text x="160" y="174" text-anchor="middle" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Claude Code · OpenCode</text><text x="160" y="194" text-anchor="middle" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Hermes · OpenClaw</text><text x="160" y="214" text-anchor="middle" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">or your own loop</text><line x1="280" y1="170" x2="360" y2="170" stroke="#44565b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="362" y="110" width="250" height="120" rx="8" fill="#ece9fb" stroke="#5847c2" stroke-width="1.3"/><text x="487" y="148" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600">Step router</text><text x="487" y="174" text-anchor="middle" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">default: local</text><text x="487" y="194" text-anchor="middle" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">escalate on: bad JSON, retries,</text><text x="487" y="214" text-anchor="middle" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">planning, policy</text><line x1="612" y1="150" x2="720" y2="120" stroke="#44565b" stroke-width="1.6" marker-end="url(#ah)"/><line x1="612" y1="200" x2="720" y2="300" stroke="#44565b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="722" y="70" width="440" height="130" rx="8" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="742" y="104" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Local Ollama  ·  localhost:11434</text><text x="742" y="130" text-anchor="start" fill="#00806b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400">nemotron-3.5-lightning</text><text x="742" y="156" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Most steps: tool calls, extraction, triage,</text><text x="742" y="176" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">tests, log queries. Data never leaves the device.</text><rect x="722" y="240" width="440" height="130" rx="8" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="742" y="274" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Cloud model (same API, :cloud tag or hosted API)</text><text x="742" y="300" text-anchor="start" fill="#a85f00" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">the few steps that need a larger model</text><text x="742" y="326" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Send only what the step needs: redact or</text><text x="742" y="346" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">summarise first, log what was sent and why.</text><rect x="40" y="410" width="1122" height="128" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="60" y="442" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Rules of thumb</text><text x="60" y="470" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">1. Validate every local answer (schema, tests, exit codes) before trusting it; escalate on failure, not on a hunch.</text><text x="60" y="494" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">2. Keep sensitive inputs on the local tier by policy, not by habit.</text><text x="60" y="518" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">3. Measure the escalation rate. If it climbs for one kind of task, post-train a specialist for that task.</text></svg>
