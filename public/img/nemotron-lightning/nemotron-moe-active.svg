<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img"><title>Mixture of experts: the model stores 30 billion parameters, but a router picks a few experts for each token, so only about 3 billion parameters are computed per token. Memory is sized by the 30B; speed is closer to a 3B model</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44565b"/></marker></defs><rect width="1200" height="520" fill="#ffffff"/><text x="40" y="46" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Why 30B parameters run like a small model</text><text x="40" y="74" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400">Memory holds every expert. Each token only wakes a few of them.</text><rect x="40" y="110" width="150" height="70" rx="8" fill="#eef2f1" stroke="#8a9a9e" stroke-width="1.3"/><text x="115" y="141" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">token</text><text x="115" y="162" text-anchor="middle" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">“retry the test”</text><line x1="190" y1="145" x2="250" y2="145" stroke="#44565b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="252" y="110" width="150" height="70" rx="8" fill="#ece9fb" stroke="#5847c2" stroke-width="1.3"/><text x="327" y="141" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">router</text><text x="327" y="162" text-anchor="middle" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">picks experts</text><path d="M402,145 C430,145 430,250 450,250 L1109,250" fill="none" stroke="#00806b" stroke-width="1.3" opacity="0.6"/><line x1="679" y1="250" x2="679" y2="148" stroke="#00806b" stroke-width="1.3" opacity="0.6"/><line x1="765" y1="250" x2="765" y2="218" stroke="#00806b" stroke-width="1.3" opacity="0.6"/><line x1="1109" y1="250" x2="1109" y2="148" stroke="#00806b" stroke-width="1.3" opacity="0.6"/><rect x="470" y="96" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="507" y="127" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E1</text><rect x="556" y="96" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="593" y="127" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E2</text><rect x="642" y="96" width="74" height="52" rx="8" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="679" y="127" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">E3</text><rect x="728" y="96" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="765" y="127" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E4</text><rect x="814" y="96" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="851" y="127" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E5</text><rect x="900" y="96" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="937" y="127" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E6</text><rect x="986" y="96" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="1023" y="127" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E7</text><rect x="1072" y="96" width="74" height="52" rx="8" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="1109" y="127" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">E8</text><rect x="470" y="166" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="507" y="197" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E9</text><rect x="556" y="166" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="593" y="197" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E10</text><rect x="642" y="166" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="679" y="197" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E11</text><rect x="728" y="166" width="74" height="52" rx="8" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="765" y="197" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">E12</text><rect x="814" y="166" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="851" y="197" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E13</text><rect x="900" y="166" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="937" y="197" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E14</text><rect x="986" y="166" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="1023" y="197" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E15</text><rect x="1072" y="166" width="74" height="52" rx="8" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="1109" y="197" text-anchor="middle" fill="#9aaaae" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">E16</text><text x="470" y="284" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">Hybrid layers: Mamba-2 (long context, small state) + MoE + a few attention layers</text><text x="40" y="330" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">What you size the hardware for</text><rect x="40" y="346" width="1000" height="34" rx="6" fill="#eef2f1" stroke="#8a9a9e" stroke-width="1.3"/><text x="52" y="369" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">Weights in memory: all 30B parameters (19 GB to 66 GB on disk, depending on quantisation)</text><text x="40" y="420" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">What each token costs to compute</text><rect x="40" y="436" width="100" height="34" rx="6" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="152" y="459" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400">about 3B active parameters, plus multi-token prediction for speculative decoding</text><text x="40" y="500" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Experts and routing shown schematically; the real model has many more experts per layer.</text></svg>
