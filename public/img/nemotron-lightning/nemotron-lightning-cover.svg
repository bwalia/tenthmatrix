<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"><title>Nemotron 3.5 Lightning on Ollama: an always-on agent runs most steps on a local 30B model with 3B active parameters, and sends the few hard steps to a larger cloud model through the same API</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44565b"/></marker></defs><rect width="1200" height="630" fill="#0d1d21"/><text x="60" y="92" text-anchor="start" fill="#ffffff" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="700">NVIDIA Nemotron 3.5 Lightning on Ollama</text><text x="60" y="132" text-anchor="start" fill="#9fc9bf" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400">Local AI agents that keep running, with your data on your own machine</text><rect x="60" y="190" width="640" height="370" rx="16" fill="#12292e" stroke="#00a88c" stroke-width="2"/><text x="88" y="228" text-anchor="start" fill="#5fd3bd" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">YOUR DEVICE</text><text x="88" y="256" text-anchor="start" fill="#b8cfca" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400">RTX PC · RTX PRO workstation · DGX Spark · Mac (MLX)</text><rect x="88" y="290" width="180" height="52" rx="10" fill="#1b3a40" stroke="#2f6a70" stroke-width="1.2"/><text x="178" y="322" text-anchor="middle" fill="#e6f2ef" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400">read a file</text><rect x="288" y="290" width="180" height="52" rx="10" fill="#1b3a40" stroke="#2f6a70" stroke-width="1.2"/><text x="378" y="322" text-anchor="middle" fill="#e6f2ef" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400">call a tool</text><rect x="488" y="290" width="180" height="52" rx="10" fill="#1b3a40" stroke="#2f6a70" stroke-width="1.2"/><text x="578" y="322" text-anchor="middle" fill="#e6f2ef" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400">sort the result</text><rect x="88" y="364" width="180" height="52" rx="10" fill="#1b3a40" stroke="#2f6a70" stroke-width="1.2"/><text x="178" y="396" text-anchor="middle" fill="#e6f2ef" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400">retry what failed</text><rect x="288" y="364" width="180" height="52" rx="10" fill="#1b3a40" stroke="#2f6a70" stroke-width="1.2"/><text x="378" y="396" text-anchor="middle" fill="#e6f2ef" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400">query the logs</text><rect x="488" y="364" width="180" height="52" rx="10" fill="#1b3a40" stroke="#2f6a70" stroke-width="1.2"/><text x="578" y="396" text-anchor="middle" fill="#e6f2ef" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400">summarise</text><rect x="88" y="452" width="580" height="80" rx="12" fill="#00806b"/><text x="378" y="484" text-anchor="middle" fill="#ffffff" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Nemotron 3.5 Lightning</text><text x="378" y="512" text-anchor="middle" fill="#dff5ef" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400">30B parameters · 3B active per token · 1M-token context</text><rect x="820" y="250" width="320" height="200" rx="16" fill="#1d1a3a" stroke="#8b7cf0" stroke-width="2" stroke-dasharray="7 6"/><text x="980" y="290" text-anchor="middle" fill="#b6acf7" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">CLOUD (OPTIONAL)</text><text x="980" y="340" text-anchor="middle" fill="#ffffff" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600">A larger model</text><text x="980" y="370" text-anchor="middle" fill="#d4cff8" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400">for the few steps</text><text x="980" y="392" text-anchor="middle" fill="#d4cff8" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400">that need one</text><text x="980" y="426" text-anchor="middle" fill="#b6acf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400">same CLI · same API</text><line x1="704" y1="350" x2="812" y2="350" stroke="#8b7cf0" stroke-width="2" stroke-dasharray="6 5"/><path d="M812,343 L824,350 L812,357 z" fill="#8b7cf0"/><text x="758" y="338" text-anchor="middle" fill="#b6acf7" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">hard step</text><text x="60" y="602" text-anchor="start" fill="#7fa59d" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400">tenthmatrix.com</text><text x="1140" y="602" text-anchor="end" fill="#7fa59d" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400">Most steps stay local. Data stays local.</text></svg>
