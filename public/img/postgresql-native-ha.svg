<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="PostgreSQL Native High Availability: Patroni, etcd, streaming replication, HAProxy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1828"/>
      <stop offset="0.55" stop-color="#0e2540"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#336791" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#336791" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #81d4fa; font: 700 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 60px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .tagline { fill: #4fc3f7; font: 800 26px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub { fill: rgba(255,255,255,0.92); font: 500 17px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.24); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .num { fill: #4fc3f7; font: 800 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .brand { fill: rgba(255,255,255,0.55); font: 700 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
      .nodeLabel { fill: #ffffff; font: 700 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .nodeText { fill: rgba(255,255,255,0.75); font: 400 9px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .audience { fill: rgba(255,255,255,0.7); font: 600 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .laneLabel { fill: #81d4fa; font: 700 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="rgba(255,255,255,0.55)"/>
    </marker>
    <marker id="arRepl" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#42a5f5"/>
    </marker>
    <marker id="arCtrl" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ff9560"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text class="kicker" x="60" y="80">POSTGRESQL  /  NATIVE HIGH AVAILABILITY</text>
  <text class="title" x="60" y="156">PostgreSQL HA</text>
  <text class="tagline" x="60" y="200">Patroni + etcd + streaming WAL + HAProxy</text>
  <text class="sub" x="60" y="240">Patroni elects leader via the DCS. HAProxy is reconfigured live. Sync replica protects RPO.</text>

  <g>
    <rect class="chip" x="60" y="282" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="308">01</text>
    <text class="chipText" x="120" y="308">App - HAProxy</text>

    <rect class="chip" x="60" y="336" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="362">02</text>
    <text class="chipText" x="120" y="362">Patroni elects via etcd</text>

    <rect class="chip" x="60" y="390" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="416">03</text>
    <text class="chipText" x="120" y="416">Streaming WAL replication</text>

    <rect class="chip" x="60" y="444" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="470">04</text>
    <text class="chipText" x="120" y="470">Failover under 30 s</text>
  </g>

  <g transform="translate(420,90)">
    <rect x="0" y="0" width="720" height="450" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

    <text class="laneLabel" x="20" y="28">CONTROL PLANE  /  DCS QUORUM</text>
    <g transform="translate(20,40)">
      <rect x="0" y="0" width="220" height="60" rx="10" fill="#1a1240" stroke="#6a3eff" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">etcd (or Consul) - 3 nodes</text>
      <text class="nodeText" x="110" y="38" text-anchor="middle">leader key + TTL</text>
      <text class="nodeText" x="110" y="50" text-anchor="middle">quorum write for leadership</text>

      <rect x="240" y="0" width="220" height="60" rx="10" fill="#1a1240" stroke="#6a3eff" stroke-width="1.5"/>
      <text class="nodeLabel" x="350" y="22" text-anchor="middle">Patroni agents (1 per PG)</text>
      <text class="nodeText" x="350" y="38" text-anchor="middle">heartbeat + race for leader key</text>
      <text class="nodeText" x="350" y="50" text-anchor="middle">configures PG roles</text>

      <rect x="480" y="0" width="220" height="60" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <text class="nodeLabel" x="590" y="22" text-anchor="middle">HAProxy frontends</text>
      <text class="nodeText" x="590" y="38" text-anchor="middle">port 5000 writer  /  5001 reader</text>
      <text class="nodeText" x="590" y="50" text-anchor="middle">reconfigured by Patroni hook</text>
    </g>

    <text class="laneLabel" x="20" y="128">CLIENT PLANE</text>
    <rect x="20" y="140" width="200" height="44" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <text class="nodeLabel" x="120" y="162" text-anchor="middle">Application</text>
    <text class="nodeText" x="120" y="176" text-anchor="middle">libpq  /  PgBouncer optional</text>

    <text class="laneLabel" x="20" y="210">DATA PLANE  /  STREAMING REPLICATION</text>
    <g transform="translate(20,222)">
      <rect x="0" y="0" width="220" height="110" rx="10" fill="#0e2540" stroke="#336791" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="24" text-anchor="middle">Primary</text>
      <text class="nodeText" x="110" y="42" text-anchor="middle">accepts writes</text>
      <text class="nodeText" x="110" y="56" text-anchor="middle">WAL writer</text>
      <text class="nodeText" x="110" y="70" text-anchor="middle">synchronous_commit=on</text>
      <text class="nodeText" x="110" y="84" text-anchor="middle">archive_command - WAL archive</text>
      <text class="nodeText" x="110" y="98" text-anchor="middle">recovery.signal absent</text>

      <rect x="240" y="0" width="220" height="110" rx="10" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="350" y="24" text-anchor="middle">Sync replica</text>
      <text class="nodeText" x="350" y="42" text-anchor="middle">read-only  /  hot standby</text>
      <text class="nodeText" x="350" y="56" text-anchor="middle">synchronous_standby_names</text>
      <text class="nodeText" x="350" y="70" text-anchor="middle">RPO target: 0</text>
      <text class="nodeText" x="350" y="84" text-anchor="middle">primary waits for ack</text>
      <text class="nodeText" x="350" y="98" text-anchor="middle">promotion candidate</text>

      <rect x="480" y="0" width="220" height="110" rx="10" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="590" y="24" text-anchor="middle">Async replica</text>
      <text class="nodeText" x="590" y="42" text-anchor="middle">read-only  /  hot standby</text>
      <text class="nodeText" x="590" y="56" text-anchor="middle">replication slot</text>
      <text class="nodeText" x="590" y="70" text-anchor="middle">analytics  /  reports</text>
      <text class="nodeText" x="590" y="84" text-anchor="middle">cascading allowed</text>
      <text class="nodeText" x="590" y="98" text-anchor="middle">backup source</text>

      <line x1="220" y1="55" x2="240" y2="55" stroke="#42a5f5" stroke-width="2" marker-end="url(#arRepl)"/>
      <line x1="460" y1="55" x2="480" y2="55" stroke="#42a5f5" stroke-width="2" marker-end="url(#arRepl)"/>
    </g>

    <line x1="350" y1="100" x2="350" y2="140" stroke="#ff9560" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arCtrl)"/>
    <line x1="120" y1="184" x2="120" y2="222" stroke="rgba(255,255,255,0.55)" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="590" y1="60" x2="590" y2="222" stroke="#ff9560" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arCtrl)"/>

    <text class="laneLabel" x="20" y="358">FAILOVER WORKFLOW</text>
    <g transform="translate(20,370)">
      <rect x="0" y="0" width="700" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text class="nodeText" x="14" y="24">primary down  -  Patroni leader key TTL expires  -  candidates race for key  -  winner pg_promote  -  HAProxy hook reroutes writer  -  replicas re-follow</text>
    </g>

    <g transform="translate(20,420)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#336791"/>
      <text class="nodeText" x="22" y="11">Primary (writes)</text>
      <rect x="140" y="0" width="14" height="14" rx="3" fill="#2e7d32"/>
      <text class="nodeText" x="162" y="11">Standby (reads)</text>
      <rect x="280" y="0" width="14" height="14" rx="3" fill="#6a3eff"/>
      <text class="nodeText" x="302" y="11">Patroni + etcd + HAProxy</text>
      <line x1="470" y1="7" x2="500" y2="7" stroke="#42a5f5" stroke-width="2"/>
      <text class="nodeText" x="506" y="11">WAL stream</text>
      <line x1="580" y1="7" x2="610" y2="7" stroke="#ff9560" stroke-width="2" stroke-dasharray="6 4"/>
      <text class="nodeText" x="616" y="11">Reconfigure hook</text>
    </g>
  </g>

  <text class="brand" x="60" y="600">TENTHMATRIX.COM</text>
  <text class="audience" x="1140" y="600" text-anchor="end">SRE  /  DBA  /  PLATFORM TEAMS</text>
</svg>
