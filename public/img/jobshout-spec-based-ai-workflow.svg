<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-label="Spec-based AI Workflow for Jobshout with GitOps">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cbd5e1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { fill: #0f172a; font: 700 28px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .subtitle { fill: #475569; font: 500 14px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .label { fill: #0f172a; font: 700 12px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .note { fill: #db2777; font: 600 11px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .noteMuted { fill: #64748b; font: 500 11px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .chipText { fill: #0f172a; font: 600 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .final { fill: #0f172a; font: 800 14px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .agent { fill: #f97316; }
      .agentStroke { stroke: #ea580c; stroke-width: 1.5; fill: #fb923c; }
    </style>
  </defs>

  <rect width="1600" height="720" fill="#f1f5f9"/>
  <rect width="1600" height="720" fill="url(#dots)"/>

  <text class="title" x="40" y="48">Spec-based AI Workflow</text>
  <text class="subtitle" x="40" y="74">Team of Agents, design Spec up front thoroughly, subagent work reviewed by Team, continue till goal met.</text>

  <!-- arrows helper line -->
  <path d="M90 250 H1480" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="4 6" opacity="0.35"/>

  <!-- 1 Human + orchestrator -->
  <g transform="translate(50,160)">
    <circle cx="28" cy="28" r="26" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="28" cy="18" r="8" fill="#64748b"/>
    <path d="M12 42c4-10 28-10 32 0" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M54 10 a18 18 0 1 1 -10 30" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="44,40 52,36 50,44" fill="#64748b"/>
    <g transform="translate(70,55)">
      <polygon class="agentStroke" points="22,0 27,14 42,14 30,24 35,38 22,29 9,38 14,24 2,14 17,14"/>
      <text class="label" x="0" y="54">orchestrator</text>
    </g>
    <text class="note" x="0" y="-40">Refine concept/goal. Claude asks</text>
    <text class="note" x="0" y="-24">clarifying questions, fill in gaps.</text>
  </g>

  <!-- Design cloud -->
  <g transform="translate(200,195)">
    <ellipse cx="50" cy="30" rx="48" ry="28" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <ellipse cx="28" cy="28" rx="22" ry="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="70" cy="26" rx="20" ry="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="28" y="36">Design</text>
  </g>

  <!-- chip brainstorming -->
  <g transform="translate(40,360)">
    <rect width="210" height="28" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
    <text class="chipText" x="10" y="18">jobshout-workflow: brainstorming</text>
  </g>

  <!-- Draft Spec -->
  <g transform="translate(330,190)">
    <rect x="0" y="0" width="54" height="70" rx="4" fill="#fff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <path d="M34 0 v16 h16" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="10" y1="28" x2="42" y2="28" stroke="#94a3b8"/>
    <line x1="10" y1="38" x2="42" y2="38" stroke="#94a3b8"/>
    <line x1="10" y1="48" x2="34" y2="48" stroke="#94a3b8"/>
    <text class="label" x="-4" y="90">Draft Spec</text>
  </g>

  <text class="note" x="280" y="140">Multi-agent Review including Coder</text>
  <text class="note" x="280" y="156">for consistency different roles.</text>

  <!-- arrow -->
  <path d="M300 230 H325" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M390 230 H430" stroke="#64748b" stroke-width="2"/>

  <!-- review agents -->
  <g transform="translate(440,145)">
    <g transform="translate(0,0)">
      <polygon class="agentStroke" points="18,0 22,11 34,11 24,19 28,30 18,23 8,30 12,19 2,11 14,11"/>
      <text class="label" x="40" y="18">feasibility</text>
    </g>
    <g transform="translate(0,40)">
      <polygon class="agentStroke" points="18,0 22,11 34,11 24,19 28,30 18,23 8,30 12,19 2,11 14,11"/>
      <text class="label" x="40" y="18">operations</text>
    </g>
    <g transform="translate(0,80)">
      <polygon class="agentStroke" points="18,0 22,11 34,11 24,19 28,30 18,23 8,30 12,19 2,11 14,11"/>
      <text class="label" x="40" y="18">experimental</text>
    </g>
    <!-- simple AI mark -->
    <circle cx="18" cy="140" r="14" fill="#10a37f"/>
    <text x="11" y="145" fill="#fff" font-size="12" font-weight="700" font-family="system-ui">AI</text>
  </g>

  <g transform="translate(400,360)">
    <rect width="210" height="28" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
    <text class="chipText" x="10" y="18">jobshout-workflow: AI-reviewers</text>
  </g>

  <!-- iterate icon -->
  <g transform="translate(600,210)">
    <circle cx="16" cy="16" r="14" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M16 6 a10 10 0 1 1 -8 4" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="6,8 14,6 10,14" fill="#64748b"/>
  </g>

  <text class="note" x="560" y="140">Combines findings from all Agents.</text>
  <text class="note" x="560" y="156">Update spec with finds/solutions.</text>
  <text class="note" x="560" y="172">Can iterate, but eventually Spec is valid.</text>

  <!-- Spec doc -->
  <g transform="translate(680,190)">
    <rect x="0" y="0" width="54" height="70" rx="4" fill="#fff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <path d="M34 0 v16 h16" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="10" y1="28" x2="42" y2="28" stroke="#94a3b8"/>
    <line x1="10" y1="38" x2="42" y2="38" stroke="#94a3b8"/>
    <line x1="10" y1="48" x2="34" y2="48" stroke="#94a3b8"/>
    <text class="label" x="10" y="90">Spec</text>
  </g>

  <!-- orchestrator -> Plan -->
  <g transform="translate(770,200)">
    <polygon class="agentStroke" points="18,0 22,11 34,11 24,19 28,30 18,23 8,30 12,19 2,11 14,11"/>
    <text class="label" x="-10" y="48">orchestrator</text>
  </g>

  <text class="note" x="760" y="140">Writes implementation Plan</text>
  <text class="note" x="760" y="156">based on the Spec and context.</text>

  <g transform="translate(860,190)">
    <rect x="0" y="0" width="54" height="70" rx="4" fill="#fff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <path d="M34 0 v16 h16" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="10" y1="28" x2="42" y2="28" stroke="#94a3b8"/>
    <line x1="10" y1="38" x2="42" y2="38" stroke="#94a3b8"/>
    <line x1="10" y1="48" x2="34" y2="48" stroke="#94a3b8"/>
    <text class="label" x="8" y="90">Plan</text>
  </g>

  <g transform="translate(720,360)">
    <rect width="220" height="28" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
    <text class="chipText" x="10" y="18">jobshout-workflow: drafting-plans</text>
  </g>

  <!-- Jira block -->
  <g transform="translate(960,150)">
    <polygon class="agentStroke" points="18,0 22,11 34,11 24,19 28,30 18,23 8,30 12,19 2,11 14,11"/>
    <text class="label" x="-10" y="48">orchestrator</text>
    <rect x="50" y="-30" width="54" height="54" rx="10" fill="#2684FF"/>
    <text x="60" y="4" fill="#fff" font-size="12" font-weight="800" font-family="system-ui">Jira</text>
    <text class="note" x="-20" y="-50">Create Epic with Spec as description.</text>
    <text class="note" x="-20" y="-34">Create Stories in Epic based on tasks.</text>
  </g>

  <g transform="translate(930,360)">
    <rect width="190" height="24" rx="6" fill="#bbf7d0" stroke="#4ade80"/>
    <text class="chipText" x="8" y="16">mcp-specs: creating-epics</text>
  </g>
  <g transform="translate(930,392)">
    <rect width="200" height="24" rx="6" fill="#bbf7d0" stroke="#4ade80"/>
    <text class="chipText" x="8" y="16">mcp-specs: submitting-tasks</text>
  </g>

  <!-- subagents -->
  <g transform="translate(1120,170)">
    <polygon class="agentStroke" points="18,0 22,11 34,11 24,19 28,30 18,23 8,30 12,19 2,11 14,11"/>
    <text class="label" x="-10" y="48">orchestrator</text>
    <g transform="translate(60,-10)">
      <polygon class="agentStroke" points="12,0 15,7 23,7 16,12 19,20 12,15 5,20 8,12 1,7 9,7"/>
      <polygon class="agentStroke" transform="translate(22,8)" points="12,0 15,7 23,7 16,12 19,20 12,15 5,20 8,12 1,7 9,7"/>
      <polygon class="agentStroke" transform="translate(8,22)" points="12,0 15,7 23,7 16,12 19,20 12,15 5,20 8,12 1,7 9,7"/>
      <polygon class="agentStroke" transform="translate(28,26)" points="12,0 15,7 23,7 16,12 19,20 12,15 5,20 8,12 1,7 9,7"/>
      <text class="label" x="0" y="60">subagents</text>
    </g>
    <text class="note" x="-40" y="-40">Agents pull down stories and work on them,</text>
    <text class="note" x="-40" y="-24">referring to original Spec and AC for accuracy</text>
    <text class="note" x="-40" y="-8">in mini-reviews, then close stories.</text>
  </g>

  <g transform="translate(1120,360)">
    <rect width="220" height="24" rx="6" fill="#bbf7d0" stroke="#4ade80"/>
    <text class="chipText" x="8" y="16">mcp-specs: executing with tasks</text>
  </g>
  <text class="noteMuted" x="1120" y="410">auto mode is a MUST</text>

  <!-- reviews until clean -->
  <g transform="translate(1360,180)">
    <g>
      <polygon class="agentStroke" points="12,0 15,7 23,7 16,12 19,20 12,15 5,20 8,12 1,7 9,7"/>
      <polygon class="agentStroke" transform="translate(20,6)" points="12,0 15,7 23,7 16,12 19,20 12,15 5,20 8,12 1,7 9,7"/>
      <polygon class="agentStroke" transform="translate(6,20)" points="12,0 15,7 23,7 16,12 19,20 12,15 5,20 8,12 1,7 9,7"/>
    </g>
    <g transform="translate(40,-20)">
      <circle cx="14" cy="14" r="12" fill="none" stroke="#64748b" stroke-width="2"/>
      <path d="M14 5 a9 9 0 1 1 -7 3" fill="none" stroke="#64748b" stroke-width="2"/>
      <polygon points="5,6 12,4 9,11" fill="#64748b"/>
    </g>
  </g>

  <g transform="translate(1320,360)">
    <rect width="240" height="28" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
    <text class="chipText" x="8" y="18">jobshout-workflow: reviews-until-clean</text>
  </g>

  <text class="noteMuted" x="1320" y="420">RUC is sized to your actual changes,</text>
  <text class="noteMuted" x="1320" y="436">ignores comments/etc, only functional changes</text>
  <text class="noteMuted" x="1320" y="456">Small / Medium / Large</text>

  <!-- final -->
  <text class="final" x="1320" y="520">FINALLY CLEAN -&gt; GITOPS</text>

  <!-- footnote -->
  <text class="noteMuted" x="40" y="680">Plugin skills are called behind the scenes. You do not need to actually type these.</text>
</svg>

