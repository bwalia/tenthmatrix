<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Claude Code Cowork and ChatGPT for business teams">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D0B21"/>
      <stop offset="1" stop-color="#1a1535"/>
    </linearGradient>
    <style>
      .title { fill: #ffffff; font: 800 38px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .sub { fill: #cbd5e1; font: 500 17px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .kicker { fill: #FF004E; font: 700 12px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 2.5px; }
      .box { fill: #1e1b36; stroke: #475569; stroke-width: 1.5; }
      .a { fill: rgba(255,0,78,0.12); stroke: #FF004E; stroke-width: 2; }
      .lbl { fill: #f8fafc; font: 700 15px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .sm { fill: #94a3b8; font: 500 12px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .brand { fill: #64748b; font: 700 11px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="630" fill="#FF004E"/>
  <text class="kicker" x="48" y="52">CODING &amp; BUSINESS AGENTS  |  WORKSTATION.CO.UK</text>
  <text class="title" x="48" y="108">Claude Code | Cowork | ChatGPT</text>
  <text class="sub" x="48" y="145">Agents for engineering, ops, GTM, and finance teams - with governance</text>

  <rect class="a" x="48" y="200" width="350" height="160" rx="8"/>
  <text class="lbl" x="72" y="250">Claude Code</text>
  <text class="sm" x="72" y="280">Repo-scale coding agents</text>
  <text class="sm" x="72" y="308">Engineering &amp; platform</text>

  <rect class="box" x="425" y="200" width="350" height="160" rx="8"/>
  <text class="lbl" x="449" y="250">Claude Cowork</text>
  <text class="sm" x="449" y="280">Decks | docs | spreadsheets</text>
  <text class="sm" x="449" y="308">Scheduled business tasks</text>

  <rect class="box" x="802" y="200" width="350" height="160" rx="8"/>
  <text class="lbl" x="826" y="250">ChatGPT / Agents</text>
  <text class="sm" x="826" y="280">Team | Enterprise | SDK</text>
  <text class="sm" x="826" y="308">GPT-5.6 / GPT-6 class</text>

  <rect class="box" x="48" y="400" width="1104" height="120" rx="8"/>
  <text class="lbl" x="72" y="450">Workstation mapping</text>
