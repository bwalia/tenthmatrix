<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="FileMyTax cover: AI bank PDF to HMRC Self Assessment MTD filing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121f"/>
      <stop offset="0.55" stop-color="#0a2740"/>
      <stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="chipFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#0e1226"/>
    </linearGradient>
    <style>
      .kicker { fill: #fcd34d; font: 700 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 56px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.2px; }
      .tagline { fill: #fbbf24; font: 800 24px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub { fill: rgba(255,255,255,0.92); font: 500 16px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.24); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .num { fill: #fbbf24; font: 800 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .brand { fill: rgba(255,255,255,0.55); font: 700 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
      .nodeLabel { fill: #ffffff; font: 700 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .nodeText { fill: rgba(255,255,255,0.78); font: 400 9.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .audience { fill: rgba(255,255,255,0.7); font: 600 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .laneLabel { fill: #fcd34d; font: 700 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <text class="kicker" x="60" y="80">FILEMYTAX  /  HMRC MTD  /  SELF ASSESSMENT</text>
  <text class="title" x="60" y="156">AI to HMRC</text>
  <text class="tagline" x="60" y="200">Bank PDF  -&gt;  classify  -&gt;  calculate  -&gt;  file</text>
  <text class="sub" x="60" y="240">FileMyTax demo pipeline: pdfplumber + LLM extraction, SA categories, deterministic tax calc, MTD submit with human gate.</text>

  <g>
    <rect class="chip" x="60" y="282" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="308">01</text>
    <text class="chipText" x="120" y="308">Upload</text>

    <rect class="chip" x="60" y="336" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="362">02</text>
    <text class="chipText" x="120" y="362">Extract</text>

    <rect class="chip" x="60" y="390" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="416">03</text>
    <text class="chipText" x="120" y="416">Classify</text>

    <rect class="chip" x="60" y="444" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="470">04</text>
    <text class="chipText" x="120" y="470">File MTD</text>
  </g>

  <g transform="translate(420,90)">
    <rect x="0" y="0" width="720" height="450" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
    <text class="laneLabel" x="20" y="28">TOPOLOGY  /  FILEMYTAX PIPELINE</text>

    <g transform="translate(20,80)">
      <rect width="200" height="56" rx="10" fill="#0e2540" stroke="#42a5f5" stroke-width="1.5"/>
      <text class="nodeLabel" x="100" y="22" text-anchor="middle">Bank PDF</text>
      <text class="nodeText" x="100" y="36" text-anchor="middle">HSBC / Barclays / Lloyds</text>
      <text class="nodeText" x="100" y="48" text-anchor="middle">POST /api/upload</text>
    </g>

    <g transform="translate(260,52)">
      <rect width="200" height="200" rx="18" fill="url(#chipFace)" stroke="#22c55e" stroke-width="2"/>
      <rect x="20" y="20" width="160" height="120" rx="14" fill="#0c2b18" stroke="#22c55e" stroke-width="1.5"/>
      <text class="nodeLabel" x="100" y="58" text-anchor="middle">FastAPI AI</text>
      <text class="nodeText" x="100" y="80" text-anchor="middle">extract + classify</text>
      <text class="nodeText" x="100" y="96" text-anchor="middle">reconcile + calculate</text>
      <text class="nodeText" x="100" y="112" text-anchor="middle">pdfplumber + LLM</text>
      <text class="nodeLabel" x="100" y="166" text-anchor="middle">Deterministic tax</text>
      <text class="nodeText" x="100" y="182" text-anchor="middle">no LLM in maths</text>
    </g>

    <g transform="translate(500,80)">
      <rect width="200" height="56" rx="10" fill="#1a1240" stroke="#7c3aed" stroke-width="1.5"/>
      <text class="nodeLabel" x="100" y="22" text-anchor="middle">opsapi</text>
      <text class="nodeText" x="100" y="36" text-anchor="middle">JWT auth + tax CRUD</text>
      <text class="nodeText" x="100" y="48" text-anchor="middle">encrypted NINO</text>
    </g>

    <g transform="translate(500,156)">
      <rect width="200" height="56" rx="10" fill="#3a1f08" stroke="#ef6c00" stroke-width="1.5"/>
      <text class="nodeLabel" x="100" y="22" text-anchor="middle">HMRC MTD</text>
      <text class="nodeText" x="100" y="36" text-anchor="middle">OAuth2 + obligations</text>
      <text class="nodeText" x="100" y="48" text-anchor="middle">POST /api/file</text>
    </g>

    <g transform="translate(20,232)">
      <rect width="200" height="56" rx="10" fill="#0e2540" stroke="#26c6da" stroke-width="1.5"/>
      <text class="nodeLabel" x="100" y="22" text-anchor="middle">Next.js UI</text>
      <text class="nodeText" x="100" y="36" text-anchor="middle">review + approve</text>
      <text class="nodeText" x="100" y="48" text-anchor="middle">human gate before file</text>
    </g>

    <g transform="translate(260,280)">
      <rect width="440" height="56" rx="10" fill="#1a0f00" stroke="#f59e0b" stroke-width="1.5"/>
      <text class="nodeLabel" x="220" y="22" text-anchor="middle">Developed by Workstation for CognoAI</text>
      <text class="nodeText" x="220" y="36" text-anchor="middle">sandbox first  |  accountant sign-off  |  not tax advice</text>
      <text class="nodeText" x="220" y="48" text-anchor="middle">Gatus health dashboard on :8085</text>
    </g>

    <line x1="220" y1="108" x2="260" y2="120" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="460" y1="120" x2="500" y2="108" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="600" y1="136" x2="600" y2="156" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="120" y1="136" x2="280" y2="200" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <text class="brand" x="60" y="600">WORKSTATION.CO.UK</text>
  <text class="audience" x="1140" y="600" text-anchor="end">LANDLORDS  /  SOLE TRADERS  /  FINANCE OPS</text>
</svg>
