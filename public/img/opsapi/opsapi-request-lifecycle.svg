<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 760" role="img" aria-labelledby="rl-pipe-t" xmlns="http://www.w3.org/2000/svg" width="920" height="760"><rect x="0" y="0" width="920" height="760" fill="#ffffff"></rect><title id="rl-pipe-t" fill="rgb(0, 0, 0)" stroke-width="1px">The stages a request passes through inside an OpsAPI nginx worker</title><defs fill="rgb(0, 0, 0)" stroke-width="1px"><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(68, 86, 91)" stroke-width="1px"></path></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(0, 128, 107)" stroke-width="1px"></path></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(180, 40, 46)" stroke-width="1px"></path></marker></defs><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="40" y="16" width="380" height="56" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="230" y="40.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Client</text><text x="230" y="57.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">Authorization: Bearer &lt;JWT or opsk_ key&gt;</text></g><line x1="230" y1="72" x2="230" y2="96" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><rect x="20" y="100" width="880" height="636" rx="10" fill="none" stroke="rgb(0, 128, 107)" stroke-width="1.3px" stroke-dasharray="6px, 5px"></rect><text x="36" y="122" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">ONE NGINX WORKER (OPENRESTY + LUAJIT + LAPIS)</text><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="40" y="136" width="380" height="56" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="230" y="160.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">CORS + global rate limit</text><text x="230" y="177.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">CorsMiddleware.enable, GlobalRateLimit</text></g><line x1="230" y1="192" x2="230" y2="214" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="40" y="216" width="380" height="56" rx="6" fill="rgb(221, 241, 236)" stroke="rgb(0, 128, 107)" stroke-width="1.3px"></rect><text x="230" y="240.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">before_filter (app.lua)</text><text x="230" y="257.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">public allow-list or authenticate</text></g><line x1="230" y1="272" x2="230" y2="294" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="40" y="296" width="380" height="56" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="230" y="320.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Router</text><text x="230" y="337.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">only routes whose feature is on</text></g><line x1="230" y1="352" x2="230" y2="374" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="40" y="376" width="380" height="56" rx="6" fill="rgb(236, 233, 251)" stroke="rgb(88, 71, 194)" stroke-width="1.3px"></rect><text x="230" y="400.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">requireAuth</text><text x="230" y="417.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">sets self.current_user</text></g><line x1="230" y1="432" x2="230" y2="454" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="40" y="456" width="380" height="56" rx="6" fill="rgb(236, 233, 251)" stroke="rgb(88, 71, 194)" stroke-width="1.3px"></rect><text x="230" y="480.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">requireNamespace</text><text x="230" y="497.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">self.namespace + permissions</text></g><line x1="230" y1="512" x2="230" y2="534" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="40" y="536" width="380" height="56" rx="6" fill="rgb(236, 233, 251)" stroke="rgb(88, 71, 194)" stroke-width="1.3px"></rect><text x="230" y="560.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">requirePermission(module, action)</text><text x="230" y="577.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">optional; 403 if missing</text></g><line x1="230" y1="592" x2="230" y2="614" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="40" y="616" width="380" height="100" rx="6" fill="rgb(252, 239, 217)" stroke="rgb(168, 95, 0)" stroke-width="1.3px"></rect><text x="230" y="654" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Handler → Queries → Models</text><text x="230" y="671" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">scoped by namespace_id</text><text x="230" y="688" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">returns { status, json }</text></g><line x1="420" y1="666" x2="598" y2="666" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="600" y="636" width="280" height="60" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="740" y="662.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">PostgreSQL</text><text x="740" y="679.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">pgmoon over cosocket</text></g><text x="470" y="236" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13px" font-weight="600">Public paths skip auth</text><text x="470" y="256" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">/, /health, /ready, /live, /swagger, /openapi.json,</text><text x="470" y="274" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">/metrics, /auth/login, /auth/signin, …, /api/v2/public/*</text><line x1="420" y1="244" x2="462" y2="244" fill="none" stroke="rgb(107, 125, 130)" stroke-width="1.3px" stroke-dasharray="6px, 4px"></line><text x="470" y="316" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13px" font-weight="600">Feature off: no route registered</text><text x="470" y="336" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">load_if(feature, "routes.x") skipped the require,</text><text x="470" y="354" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">so the router answers 404 for everyone</text><line x1="420" y1="324" x2="462" y2="324" fill="none" stroke="rgb(107, 125, 130)" stroke-width="1.3px" stroke-dasharray="6px, 4px"></line><text x="470" y="396" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13px" font-weight="600">Early exits</text><text x="470" y="416" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">401 no or bad token · 400 no workspace header</text><text x="470" y="434" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">404 workspace not found · 403 not a member,</text><text x="470" y="452" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">inactive member or suspended workspace</text><line x1="420" y1="404" x2="462" y2="404" fill="none" stroke="rgb(180, 40, 46)" stroke-width="1.4px" stroke-dasharray="5px, 4px"></line></svg>