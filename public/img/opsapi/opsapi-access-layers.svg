<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 330" role="img" aria-labelledby="mt-layers-t" xmlns="http://www.w3.org/2000/svg" width="920" height="330"><rect x="0" y="0" width="920" height="330" fill="#ffffff"></rect><title id="mt-layers-t" fill="rgb(0, 0, 0)" stroke-width="1px">The three access layers and who each one stops</title><rect x="20" y="20" width="880" height="86" rx="8" fill="rgb(221, 241, 236)" stroke="rgb(0, 128, 107)" stroke-width="1.3px"></rect><text x="40" y="50" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">1. PROJECT_CODE: per deployment, hard</text><text x="40" y="74" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">A disabled module's routes are never loaded and its tables don't exist.</text><text x="40" y="94" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">404 for everyone, owners and platform admins included.</text><text x="760" y="64" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">stops: everyone</text><rect x="20" y="122" width="880" height="86" rx="8" fill="rgb(236, 233, 251)" stroke="rgb(88, 71, 194)" stroke-width="1.3px"></rect><text x="40" y="152" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">2. Workspace RBAC: per workspace, per role</text><text x="40" y="176" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">requirePermission(module, action) checks the member's role permissions.</text><text x="40" y="196" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">403 "Permission denied". Platform admins pass every check.</text><text x="760" y="166" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">stops: members</text><rect x="20" y="224" width="880" height="86" rx="8" fill="rgb(234, 240, 238)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="40" y="254" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">3. Menu configuration: cosmetic</text><text x="40" y="278" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">namespace_menu_config hides a sidebar page for a workspace.</text><text x="40" y="298" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">The API route still answers; hiding a page is not access control.</text><text x="760" y="268" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">stops: nobody</text></svg>