<svg viewBox="0 0 940 400" role="img" aria-labelledby="pc-flow-t" xmlns="http://www.w3.org/2000/svg" width="940" height="400"><rect x="0" y="0" width="940" height="400" fill="#ffffff"></rect><title id="pc-flow-t" fill="rgb(0, 0, 0)" stroke-width="1px">From the PROJECT_CODE variable to loaded routes and created tables</title><defs fill="rgb(0, 0, 0)" stroke-width="1px"><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(68, 86, 91)" stroke-width="1px"></path></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(0, 128, 107)" stroke-width="1px"></path></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(180, 40, 46)" stroke-width="1px"></path></marker></defs><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="20" y="150" width="190" height="70" rx="6" fill="rgb(252, 239, 217)" stroke="rgb(168, 95, 0)" stroke-width="1.3px"></rect><text x="115" y="173" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">PROJECT_CODE</text><text x="115" y="190" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">e.g. tax_copilot,services</text><text x="115" y="207" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monos