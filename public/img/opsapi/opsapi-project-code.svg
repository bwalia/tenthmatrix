ke-width="1.3px"></rect><text x="750" y="60" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">app.lua: load_if(feature, route)</text><text x="750" y="77" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">require the route file only when on</text><text x="750" y="94" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">off: no route, router answers 404</text></g><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="580" y="150" width="340" height="70" rx="6" fill="rgb(236, 233, 251)" stroke="rgb(88, 71, 194)" stroke-width="1.3px"></rect><text x="750" y="181.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">migrations.lua: load_if_enabled</text><text x="750" y="198.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">+ conditional / conditional_array</text></g><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="580" y="258" width="340" height="84" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="750" y="288" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Menu + default roles</text><text x="750" y="305" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">sidebar items and RBAC modules</text><text x="750" y="322" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">filtered to the enabled set</text></g><text x="20" y="372" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">Plugins add their own feature at boot with ProjectConfig.registerFeature(code, features, modules).</text></svg>