<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 240" role="img" aria-labelledby="wh-cms-t" xmlns="http://www.w3.org/2000/svg" width="940" height="240"><rect x="0" y="0" width="940" height="240" fill="#ffffff"></rect><title id="wh-cms-t" fill="rgb(0, 0, 0)" stroke-width="1px">An editor triggers the CMS webhook; the website verifies it and refetches published posts</title><defs fill="rgb(0, 0, 0)" stroke-width="1px"><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(68, 86, 91)" stroke-width="1px"></path></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(0, 128, 107)" stroke-width="1px"></path></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(180, 40, 46)" stroke-width="1px"></path></marker></defs><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="10" y="40" width="180" height="70" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="100" y="71.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Editor</text><text x="100" y="88.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">publishes, then notifies</text></g><line x1="190" y1="75" x2="248" y2="75" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="250" y="40" width="190" height="70" rx="6" fill="rgb(221, 241, 236)" stroke="rgb(0, 128, 107)" stroke-width="1.3px"></rect><text x="345" y="71.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">OpsAPI CMS</text><text x="345" y="88.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">POST …/trigger</text></g><line x1="440" y1="75" x2="498" y2="75" marker-end="url(#ah-acc)" fill="none" stroke="rgb(0, 128, 107)" stroke-width="1.6px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="500" y="40" width="190" height="70" rx="6" fill="rgb(236, 233, 251)" stroke="rgb(88, 71, 194)" stroke-width="1.3px"></rect><text x="595" y="71.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Your website</text><text x="595" y="88.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">checks the signature</text></g><line x1="690" y1="75" x2="748" y2="75" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="750" y="40" width="180" height="70" rx="6" fill="rgb(236, 233, 251)" stroke="rgb(88, 71, 194)" stroke-width="1.3px"></rect><text x="840" y="71.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Refresh content</text><text x="840" y="88.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">revalidate or rebuild</text></g><path d="M840 110 V180 H345 V112" marker-end="url(#ah)" fill="none" stroke="rgb(107, 125, 130)" stroke-width="1.3px" stroke-dasharray="6px, 4px"></path><text x="592" y="200" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">GET /api/v2/public/cms/:namespace/posts</text></svg>