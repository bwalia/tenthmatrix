<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 260" role="img" aria-labelledby="wh-delivery-t" xmlns="http://www.w3.org/2000/svg" width="940" height="260"><rect x="0" y="0" width="940" height="260" fill="#ffffff"></rect><title id="wh-delivery-t" fill="rgb(0, 0, 0)" stroke-width="1px">A business change becomes an event, then a signed delivery to your endpoint, retried until it succeeds</title><defs fill="rgb(0, 0, 0)" stroke-width="1px"><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(68, 86, 91)" stroke-width="1px"></path></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(0, 128, 107)" stroke-width="1px"></path></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(180, 40, 46)" stroke-width="1px"></path></marker></defs><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="10" y="90" width="170" height="70" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="95" y="121.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Business change</text><text x="95" y="138.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">e.g. invoice paid</text></g><line x1="180" y1="125" x2="228" y2="125" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="230" y="90" width="170" height="70" rx="6" fill="rgb(221, 241, 236)" stroke="rgb(0, 128, 107)" stroke-width="1.3px"></rect><text x="315" y="121.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Event outbox</text><text x="315" y="138.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">inside every worker</text></g><line x1="400" y1="125" x2="448" y2="125" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="450" y="90" width="200" height="70" rx="6" fill="rgb(221, 241, 236)" stroke="rgb(0, 128, 107)" stroke-width="1.3px"></rect><text x="550" y="121.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Signed delivery</text><text x="550" y="138.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">HMAC-SHA256 + timestamp</text></g><line x1="650" y1="125" x2="708" y2="125" marker-end="url(#ah-acc)" fill="none" stroke="rgb(0, 128, 107)" stroke-width="1.6px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="710" y="90" width="220" height="70" rx="6" fill="rgb(236, 233, 251)" stroke="rgb(88, 71, 194)" stroke-width="1.3px"></rect><text x="820" y="121.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Your endpoint</text><text x="820" y="138.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">answer 2xx within 10 s</text></g><path d="M820 160 V215 H550 V162" marker-end="url(#ah)" fill="none" stroke="rgb(107, 125, 130)" stroke-width="1.3px" stroke-dasharray="6px, 4px"></path><text x="685" y="236" text-anchor="middle" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">non-2xx or timeout: retry from 15 s, up to 1 h apart, 8 attempts</text><text x="315" y="60" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">one workspace's events only</text></svg>