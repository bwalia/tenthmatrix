-v*</text><text x="127.5" y="379.0" text-anchor="middle" fill="#6b7d82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">publish @opsapi/client</text><rect x="255" y="322" width="215" height="70" rx="6" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="362.5" y="345.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Website</text><text x="362.5" y="362.0" text-anchor="middle" fill="#6b7d82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">website/** only</text><text x="362.5" y="379.0" text-anchor="middle" fill="#6b7d82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">opsapi.org pages</text><rect x="490" y="322" width="215" height="70" rx="6" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="597.5" y="345.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Nightly backup</text><text x="597.5" y="362.0" text-anchor="middle" fill="#6b7d82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">00:00 UTC</text><text x="597.5" y="379.0" text-anchor="middle" fill="#6b7d82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">pg_dump per env</text><rect x="725" y="322" width="215" height="70" rx="6" fill="#ffffff" stroke="#d3dedb" stroke-width="1.3"/><text x="832.5" y="345.0" text-anchor="middle" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Helm backups</text><text x="832.5" y="362.0" text-anchor="middle" fill="#6b7d82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">hourly + daily</text><text x="832.5" y="379.0" text-anchor="middle" fill="#6b7d82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">CronJob