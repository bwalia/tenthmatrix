m-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="756" y="40" width="160" height="70" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="836" y="71.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Old pod drains</text><text x="836" y="88.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">preStop, then quit</text></g><text x="836" y="28" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">step 5</text></g></svg>