ck to the app</text><text x="480" y="494" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">/auth/callback?token=JWT&amp;redirect=nonce</text><rect x="182" y="504" width="160" height="32" rx="4" fill="rgb(236, 233, 251)" stroke="rgb(88, 71, 194)" stroke-width="1.3px"></rect><text x="262" y="524" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">nonce must match session</text><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><circle cx="22" cy="568" r="10" fill="rgb(0, 128, 107)" stroke-width="1px"></circle><text x="22" y="572" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11px" font-weight="500">9</text></g><line x1="350" y1="568" x2="608" y2="568" marker-end="url(#ah-acc)" fill="none" stroke="rgb(0, 128, 107)" stroke-width="1.6px"></line><text x="480" y="560" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13px">GET /auth/me</text><text x="480" y="586" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">Authorization: Bearer JWT</text><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><circle cx="22" cy="620" r="10" fill="rgb(0, 128, 107)" stroke-width="1px"></circle><text x="22" y="624" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-mono