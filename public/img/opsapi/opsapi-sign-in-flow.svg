o Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11px" font-weight="500">2</text></g><line x1="350" y1="164" x2="112" y2="164" marker-end="url(#ah)" fill="none" stroke="rgb(107, 125, 130)" stroke-width="1.3px" stroke-dasharray="6px, 4px"></line><text x="230" y="156" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13px">Redirect to OpsAPI</text><text x="230" y="182" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">/auth/signin?frontend_url=app&amp;from=nonce</text><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><circle cx="22" cy="222" r="10" fill="rgb(0, 128, 107)" stroke-width="1px"></circle><text x="22" y="226" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11px" font-weight="500">3</text></g><line x1="110" y1="222" x2="608" y2="222" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><text x="360" y="214" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13px">Hosted sign-in page: email + password (+ emailed code) or Google</text><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><circle cx="22" cy="270" r="10" fill="rgb(0, 128, 107)" stroke-width="1px"></circle><text x="22" y="274" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11px" font-weight="500">4</text></g><line x1="610" y1="270" x2="848" y2="270" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><text x="730" y="262" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13px">With Google: consent</text><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><circle cx="22" cy="318" r="10" fill="rgb(0, 128, 107)" stroke-width="1px"></circle><text x="22" y="322" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11px" font-weight="500">5</text></g><line x1="850" y1="318" x2="612" y2="318" marker-end="url(#ah)" fill="none" stroke="rgb(107, 125, 130)" stroke-width="1.3px" stroke-dasharray="6px, 4px"></line><text x="730" y="310" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13px">Back with ?code</text><text x="730" y="336" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">/auth/google/callback</text><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><circle cx="22" cy="366" r="10" fill="rgb(0, 128, 107)" stroke-width="1px"></circle><text x="22" y="370" text-anchor="middle" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11px" font-weight="500">6</text></g><line x1="610" y1="366" x2="848" y2="366" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><text x="730" y="358" text-anchor="middle" fill="