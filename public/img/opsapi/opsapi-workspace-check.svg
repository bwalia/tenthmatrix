<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 560" role="img" aria-labelledby="mt-res-t" xmlns="http://www.w3.org/2000/svg" width="940" height="560"><rect x="0" y="0" width="940" height="560" fill="#ffffff"></rect><title id="mt-res-t" fill="rgb(0, 0, 0)" stroke-width="1px">How requireNamespace picks the workspace and checks access</title><defs fill="rgb(0, 0, 0)" stroke-width="1px"><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(68, 86, 91)" stroke-width="1px"></path></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(0, 128, 107)" stroke-width="1px"></path></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" fill="rgb(0, 0, 0)" stroke-width="1px"><path d="M0,0 L10,5 L0,10 z" fill="rgb(180, 40, 46)" stroke-width="1px"></path></marker></defs><text x="20" y="28" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">WHICH WORKSPACE? (first match wins)</text><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="20" y="42" width="200" height="52" rx="6" fill="rgb(221, 241, 236)" stroke="rgb(0, 128, 107)" stroke-width="1.3px"></rect><text x="120" y="64.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">X-Namespace-Id</text><text x="120" y="81.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">header</text></g><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="240" y="42" width="200" height="52" rx="6" fill="rgb(221, 241, 236)" stroke="rgb(0, 128, 107)" stroke-width="1.3px"></rect><text x="340" y="64.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">X-Namespace-Slug</text><text x="340" y="81.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">header</text></g><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="460" y="42" width="200" height="52" rx="6" fill="rgb(221, 241, 236)" stroke="rgb(0, 128, 107)" stroke-width="1.3px"></rect><text x="560" y="64.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">JWT namespace</text><text x="560" y="81.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">uuid, else slug</text></g><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="680" y="42" width="240" height="52" rx="6" fill="rgb(221, 241, 236)" stroke="rgb(0, 128, 107)" stroke-width="1.3px"></rect><text x="800" y="64.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Subdomain</text><text x="800" y="81.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">not www, api, dashboard</text></g><line x1="220" y1="68" x2="238" y2="68" marker-end="url(#ah)" fill="none" stroke="rgb(107, 125, 130)" stroke-width="1.3px" stroke-dasharray="6px, 4px"></line><line x1="440" y1="68" x2="458" y2="68" marker-end="url(#ah)" fill="none" stroke="rgb(107, 125, 130)" stroke-width="1.3px" stroke-dasharray="6px, 4px"></line><line x1="660" y1="68" x2="678" y2="68" marker-end="url(#ah)" fill="none" stroke="rgb(107, 125, 130)" stroke-width="1.3px" stroke-dasharray="6px, 4px"></line><text x="470" y="116" text-anchor="middle" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">each one only if the previous is absent</text><line x1="470" y1="124" x2="470" y2="150" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="330" y="152" width="280" height="50" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="470" y="182" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Identifier found?</text></g><line x1="610" y1="177" x2="728" y2="177" marker-end="url(#ah-red)" fill="none" stroke="rgb(180, 40, 46)" stroke-width="1.4px" stroke-dasharray="5px, 4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="730" y="154" width="190" height="46" rx="6" fill="rgb(251, 230, 230)" stroke="rgb(180, 40, 46)" stroke-width="1.3px"></rect><text x="825" y="173.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">400</text><text x="825" y="190.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">provide a header</text></g><line x1="470" y1="202" x2="470" y2="228" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="330" y="230" width="280" height="50" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="470" y="260" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Workspace exists?</text></g><line x1="610" y1="255" x2="728" y2="255" marker-end="url(#ah-red)" fill="none" stroke="rgb(180, 40, 46)" stroke-width="1.4px" stroke-dasharray="5px, 4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="730" y="232" width="190" height="46" rx="6" fill="rgb(251, 230, 230)" stroke="rgb(180, 40, 46)" stroke-width="1.3px"></rect><text x="825" y="251.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">404</text><text x="825" y="268.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">Namespace not found</text></g><line x1="470" y1="280" x2="470" y2="306" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="330" y="308" width="280" height="50" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="470" y="338" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Status active?</text></g><line x1="610" y1="333" x2="728" y2="333" marker-end="url(#ah-red)" fill="none" stroke="rgb(180, 40, 46)" stroke-width="1.4px" stroke-dasharray="5px, 4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="730" y="310" width="190" height="46" rx="6" fill="rgb(251, 230, 230)" stroke="rgb(180, 40, 46)" stroke-width="1.3px"></rect><text x="825" y="329.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">403</text><text x="825" y="346.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">not accessible</text></g><line x1="470" y1="358" x2="470" y2="384" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="330" y="386" width="280" height="50" rx="6" fill="rgb(255, 255, 255)" stroke="rgb(211, 222, 219)" stroke-width="1.3px"></rect><text x="470" y="416" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Member, or platform admin?</text></g><line x1="610" y1="411" x2="728" y2="411" marker-end="url(#ah-red)" fill="none" stroke="rgb(180, 40, 46)" stroke-width="1.4px" stroke-dasharray="5px, 4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="730" y="388" width="190" height="46" rx="6" fill="rgb(251, 230, 230)" stroke="rgb(180, 40, 46)" stroke-width="1.3px"></rect><text x="825" y="407.5" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">403</text><text x="825" y="424.5" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">Access denied</text></g><line x1="470" y1="436" x2="470" y2="462" marker-end="url(#ah)" fill="none" stroke="rgb(68, 86, 91)" stroke-width="1.4px"></line><g fill="rgb(0, 0, 0)" stroke-width="1px" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16px"><rect x="290" y="464" width="360" height="70" rx="6" fill="rgb(236, 233, 251)" stroke="rgb(88, 71, 194)" stroke-width="1.3px"></rect><text x="470" y="487" text-anchor="middle" fill="rgb(13, 29, 33)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14px" font-weight="600">Context set on self</text><text x="470" y="504" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">namespace, namespace_permissions,</text><text x="470" y="521" text-anchor="middle" fill="rgb(107, 125, 130)" font-family="'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5px">is_namespace_owner, is_platform_admin</text></g><text x="40" y="420" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">A member whose status</text><text x="40" y="438" fill="rgb(68, 86, 91)" font-family="Poppins, 'Poppins Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5px">isn't active also gets 403</text></svg>