<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img"><title>Cost of ten requests that share a 50,000-token prefix on Claude Opus 5.5: $2.00 without caching, $0.34 with the 5-minute cache and $0.49 with the 1-hour cache; choose the 5-minute TTL when requests are under 5 minutes apart and the 1-hour TTL for gaps of 5 to 60 minutes</title><rect width="1200" height="480" fill="#ffffff"/><text x="30" y="38" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Ten requests, one 50,000-token shared prefix, Claude Opus 5.5</text><text x="30" y="60" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400">Input price $4 / MTok · 5-minute write $5 · 1-hour write $8 · cache read $0.20</text><text x="30" y="120" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">No caching</text><rect x="200" y="96" width="600.0" height="40" rx="5" fill="#eef2f1" stroke="#8a9a9e" stroke-width="1.3"/><text x="814.0" y="116" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">$2.00</text><text x="814.0" y="132" text-anchor="start" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">10 × 50k × $4/M</text><text x="30" y="186" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">5-minute cache</text><rect x="200" y="162" width="102.00000000000001" height="40" rx="5" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="316.0" y="182" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">$0.34</text><text x="316.0" y="198" text-anchor="start" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">1 write $0.25 + 9 reads $0.09</text><text x="30" y="252" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">1-hour cache</text><rect x="200" y="228" width="147.0" height="40" rx="5" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="361.0" y="248" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">$0.49</text><text x="361.0" y="264" text-anchor="start" fill="#5b6d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400">1 write $0.40 + 9 reads $0.09</text><text x="200" y="316" text-anchor="start" fill="#00806b" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">83% less with the 5-minute cache. Output tokens are billed the same either way.</text><text x="30" y="360" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600">Which TTL? Measure the gap between the starts of requests that share the prefix</text><rect x="30" y="376" width="370" height="72" rx="7" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="46" y="402" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">under 5 minutes</text><text x="46" y="426" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">5-minute TTL · every request refreshes it for free</text><rect x="415" y="376" width="370" height="72" rx="7" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="431" y="402" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">5 to 60 minutes</text><text x="431" y="426" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">1-hour TTL · the only case where the 2× write pays off</text><rect x="800" y="376" width="370" height="72" rx="7" fill="#eef2f1" stroke="#8a9a9e" stroke-width="1.3"/><text x="816" y="402" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">over an hour</text><text x="816" y="426" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">neither: pre-warm with max_tokens: 0, or accept one miss</text></svg>
