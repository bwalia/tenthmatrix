<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img"><title>Claude Code prompt layers and the cache: system prompt and tool definitions first, then project context such as CLAUDE.md and memory, then the conversation. Model switches, effort changes on older models, fast mode toggles, MCP server or plugin changes, denying a whole tool, compaction, many images and upgrades break the cache; editing files or CLAUDE.md, permission mode, output style, skills, /recap, /rewind and subagents keep it</title><rect width="1200" height="640" fill="#ffffff"/><text x="30" y="38" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Claude Code: what each request contains, and what breaks the cache</text><rect x="30" y="64" width="520" height="56" rx="7" fill="#ece9fb" stroke="#5847c2" stroke-width="1.3"/><text x="48" y="88" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">1  System prompt + tool definitions</text><text x="48" y="107" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">changes when the set of loaded tools changes</text><rect x="30" y="130" width="520" height="56" rx="7" fill="#eef2f1" stroke="#8a9a9e" stroke-width="1.3"/><text x="48" y="154" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">2  Project context</text><text x="48" y="173" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">CLAUDE.md · auto memory · rules · reloaded after /clear or /compact</text><rect x="30" y="196" width="520" height="56" rx="7" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="48" y="220" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">3  Conversation</text><text x="48" y="239" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">your messages · Claude's replies · tool results · grows every turn</text><path d="M570,64 L590,64 L590,244 L570,244" fill="none" stroke="#44565b" stroke-width="1.4"/><text x="604" y="150" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400">a change in a layer re-processes</text><text x="604" y="168" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400">that layer and everything after it</text><text x="30" y="290" text-anchor="start" fill="#c2373a" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">BREAKS THE CACHE (one slower, dearer turn)</text><text x="620" y="290" text-anchor="start" fill="#00806b" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">KEEPS THE CACHE</text><rect x="30" y="302" width="560" height="40" rx="6" fill="#fde7e7" stroke="#c2373a" stroke-width="1.1"/><text x="46" y="319" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Switching model (/model, opusplan, skill model:)</text><text x="46" y="335" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">each model has its own cache</text><rect x="30" y="348" width="560" height="40" rx="6" fill="#fde7e7" stroke="#c2373a" stroke-width="1.1"/><text x="46" y="365" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Changing effort (older models)</text><text x="46" y="381" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">kept on Fable 5.1+, Opus 5.5, Sonnet 5.5, Haiku 5.5</text><rect x="30" y="394" width="560" height="40" rx="6" fill="#fde7e7" stroke="#c2373a" stroke-width="1.1"/><text x="46" y="411" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Turning fast mode on or off</text><text x="46" y="427" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">fast and standard keep separate caches</text><rect x="30" y="440" width="560" height="40" rx="6" fill="#fde7e7" stroke="#c2373a" stroke-width="1.1"/><text x="46" y="457" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">MCP server or plugin change</text><text x="46" y="473" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">only when tools load upfront (no tool search)</text><rect x="30" y="486" width="560" height="40" rx="6" fill="#fde7e7" stroke="#c2373a" stroke-width="1.1"/><text x="46" y="503" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Denying a whole tool (e.g. Bash)</text><text x="46" y="519" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">only when tool search is off</text><rect x="30" y="532" width="560" height="40" rx="6" fill="#fde7e7" stroke="#c2373a" stroke-width="1.1"/><text x="46" y="549" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">/compact or auto-compaction</text><text x="46" y="565" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">new, shorter history: rebuilt once</text><rect x="30" y="578" width="560" height="40" rx="6" fill="#fde7e7" stroke="#c2373a" stroke-width="1.1"/><text x="46" y="595" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Many images, upgrading Claude Code</text><text x="46" y="611" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">old images dropped · new system prompt</text><rect x="620" y="302" width="550" height="40" rx="6" fill="#ddf1ec" stroke="#00806b" stroke-width="1.1"/><text x="636" y="319" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Editing files in the repository</text><text x="636" y="335" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">the copy already read stays as it was</text><rect x="620" y="348" width="550" height="40" rx="6" fill="#ddf1ec" stroke="#00806b" stroke-width="1.1"/><text x="636" y="365" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Editing CLAUDE.md mid-session</text><text x="636" y="381" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">loaded at start; reload with /clear</text><rect x="620" y="394" width="550" height="40" rx="6" fill="#ddf1ec" stroke="#00806b" stroke-width="1.1"/><text x="636" y="411" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Permission mode, output style</text><text x="636" y="427" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">system prompt and tools stay the same</text><rect x="620" y="440" width="550" height="40" rx="6" fill="#ddf1ec" stroke="#00806b" stroke-width="1.1"/><text x="636" y="457" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Skills and slash commands</text><text x="636" y="473" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">appended as user messages</text><rect x="620" y="486" width="550" height="40" rx="6" fill="#ddf1ec" stroke="#00806b" stroke-width="1.1"/><text x="636" y="503" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">/recap and /rewind</text><text x="636" y="519" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">append, or go back to a cached prefix</text><rect x="620" y="532" width="550" height="40" rx="6" fill="#ddf1ec" stroke="#00806b" stroke-width="1.1"/><text x="636" y="549" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Spawning a subagent</text><text x="636" y="565" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400">own cache; the parent's is untouched</text><text x="620" y="600" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">Pick model and effort at the start · /compact at natural breaks · /clear between tasks</text></svg>
