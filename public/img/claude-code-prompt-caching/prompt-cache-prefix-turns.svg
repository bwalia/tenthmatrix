<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img"><title>How prompt caching works turn by turn: each request renders tools, then system, then messages. The unchanged prefix is read from cache at a tenth of the input price or less, only the new turn is written, and a change near the start (a model switch or a new tool) rewrites everything after it</title><rect width="1200" height="600" fill="#ffffff"/><text x="30" y="38" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600">One conversation, four requests</text><text x="30" y="60" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400">Every request re-sends the whole prompt. The API matches its start (the prefix) against what it processed recently.</text><text x="30" y="122" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Request 1</text><rect x="190" y="100" width="78" height="38" rx="5" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="229.0" y="124" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">tools</text><rect x="271" y="100" width="105" height="38" rx="5" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="323.5" y="124" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">system</text><rect x="379" y="100" width="105" height="38" rx="5" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="431.5" y="124" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">turn 1</text><line x1="484" y1="88" x2="484" y2="134" stroke="#5847c2" stroke-width="1.6"/><path d="M484,88 L497,93 L484,98 z" fill="#5847c2"/><text x="505" y="124" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">first time: everything is written</text><text x="30" y="214" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Request 2</text><rect x="190" y="192" width="78" height="38" rx="5" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="229.0" y="216" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">tools</text><rect x="271" y="192" width="105" height="38" rx="5" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="323.5" y="216" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">system</text><rect x="379" y="192" width="105" height="38" rx="5" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="431.5" y="216" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">turn 1</text><rect x="487" y="192" width="105" height="38" rx="5" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="539.5" y="216" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">turn 2</text><line x1="592" y1="180" x2="592" y2="226" stroke="#5847c2" stroke-width="1.6"/><path d="M592,180 L605,185 L592,190 z" fill="#5847c2"/><text x="613" y="216" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">only turn 2 is new</text><text x="30" y="306" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Request 3</text><rect x="190" y="284" width="78" height="38" rx="5" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="229.0" y="308" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">tools</text><rect x="271" y="284" width="105" height="38" rx="5" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="323.5" y="308" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">system</text><rect x="379" y="284" width="105" height="38" rx="5" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="431.5" y="308" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">turn 1</text><rect x="487" y="284" width="105" height="38" rx="5" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="539.5" y="308" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">turn 2</text><rect x="595" y="284" width="105" height="38" rx="5" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="647.5" y="308" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">turn 3</text><line x1="700" y1="272" x2="700" y2="318" stroke="#5847c2" stroke-width="1.6"/><path d="M700,272 L713,277 L700,282 z" fill="#5847c2"/><text x="721" y="308" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">the cached part keeps growing</text><text x="30" y="398" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Request 4</text><rect x="190" y="376" width="78" height="38" rx="5" fill="#fde7e7" stroke="#c2373a" stroke-width="1.3"/><text x="229.0" y="400" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">tools*</text><rect x="271" y="376" width="105" height="38" rx="5" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="323.5" y="400" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">system</text><rect x="379" y="376" width="105" height="38" rx="5" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="431.5" y="400" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">turn 1</text><rect x="487" y="376" width="105" height="38" rx="5" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="539.5" y="400" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">turn 2</text><rect x="595" y="376" width="105" height="38" rx="5" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="647.5" y="400" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">turn 3</text><rect x="703" y="376" width="78" height="38" rx="5" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="742.0" y="400" text-anchor="middle" fill="#0d1d21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">turn 4</text><line x1="781" y1="364" x2="781" y2="410" stroke="#5847c2" stroke-width="1.6"/><path d="M781,364 L794,369 L781,374 z" fill="#5847c2"/><text x="802" y="400" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400">a tool was added: the whole prefix is rewritten</text><rect x="30" y="470" width="30" height="20" rx="4" fill="#ddf1ec" stroke="#00806b" stroke-width="1.3"/><text x="72" y="485" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400">read from cache · 0.1× input price (0.05× on Opus 5.5 and Sonnet 5.5)</text><rect x="30" y="500" width="30" height="20" rx="4" fill="#fcefd9" stroke="#a85f00" stroke-width="1.3"/><text x="72" y="515" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400">written to cache · 1.25× (5-minute) or 2× (1-hour)</text><rect x="30" y="530" width="30" height="20" rx="4" fill="#fde7e7" stroke="#c2373a" stroke-width="1.3"/><text x="72" y="545" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400">changed near the start · everything after it misses</text><line x1="760" y1="466" x2="760" y2="512" stroke="#5847c2" stroke-width="1.6"/><path d="M760,466 L773,471 L760,476 z" fill="#5847c2"/><text x="784" y="485" text-anchor="start" fill="#0d1d21" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400">cache breakpoint (cache_control)</text><text x="784" y="515" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400">order is always tools → system → messages</text><text x="784" y="545" text-anchor="start" fill="#5b6d72" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400">up to 4 breakpoints · 20-position lookback</text></svg>
