<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Jobshout SEO Analyst flow: analyse, report, improve, publish">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#0a2a26"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text fill="#5eead4" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3" x="48" y="56">JOBSHOUT SEO ANALYST - OPERATING MODES</text>
  <text fill="#fff" font-family="system-ui, sans-serif" font-size="36" font-weight="800" x="48" y="110">From crawl to approved fix</text>

  <!-- Step boxes -->
  <g font-family="system-ui, sans-serif">
    <rect x="48" y="160" width="250" height="200" rx="14" fill="#0c1a24" stroke="#14b8a6" stroke-width="2"/>
    <text fill="#5eead4" font-size="13" font-weight="700" x="68" y="198">1. ANALYSE</text>
    <text fill="#fff" font-size="20" font-weight="700" x="68" y="236">Crawl the URL</text>
    <text fill="#94a3b8" font-size="14" x="68" y="270">Title · meta · H1</text>
    <text fill="#94a3b8" font-size="14" x="68" y="294">robots · sitemap</text>
    <text fill="#94a3b8" font-size="14" x="68" y="318">canonical · keywords</text>

    <rect x="330" y="160" width="250" height="200" rx="14" fill="#0c1a24" stroke="#f59e0b" stroke-width="2"/>
    <text fill="#fbbf24" font-size="13" font-weight="700" x="350" y="198">2. REPORT</text>
    <text fill="#fff" font-size="20" font-weight="700" x="350" y="236">Score + findings</text>
    <text fill="#94a3b8" font-size="14" x="350" y="270">Priority: high / medium</text>
    <text fill="#94a3b8" font-size="14" x="350" y="294">Exact fix prompts</text>
    <text fill="#94a3b8" font-size="14" x="350" y="318">Proposed slug / meta</text>

    <rect x="612" y="160" width="250" height="200" rx="14" fill="#0c1a24" stroke="#f43f5e" stroke-width="2"/>
    <text fill="#fb7185" font-size="13" font-weight="700" x="632" y="198">3. IMPROVE</text>
    <text fill="#fff" font-size="20" font-weight="700" x="632" y="236">Propose remediations</text>
    <text fill="#94a3b8" font-size="14" x="632" y="270">Shorten title d60</text>
    <text fill="#94a3b8" font-size="14" x="632" y="294">Meta 120155 chars</text>
    <text fill="#94a3b8" font-size="14" x="632" y="318">Add missing H1</text>

    <rect x="894" y="160" width="250" height="200" rx="14" fill="#0c1a24" stroke="#a78bfa" stroke-width="2"/>
    <text fill="#c4b5fd" font-size="13" font-weight="700" x="914" y="198">4. PUBLISH</text>
    <text fill="#fff" font-size="20" font-weight="700" x="914" y="236">Apply with approval</text>
    <text fill="#94a3b8" font-size="14" x="914" y="270">WordPress · OpsAPI</text>
    <text fill="#94a3b8" font-size="14" x="914" y="294">or git PR to repo</text>
    <text fill="#94a3b8" font-size="14" x="914" y="318">Human gate first</text>
  </g>

  <!-- Example callout -->
  <rect x="48" y="400" width="1104" height="260" rx="14" fill="#0c1a24" stroke="#334155"/>
  <text fill="#5eead4" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" x="72" y="444">REAL RUN - https://www.workstation.co.uk/</text>
  <text fill="#f43f5e" font-family="system-ui, sans-serif" font-size="48" font-weight="800" x="72" y="520">44</text>
  <text fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" x="72" y="552">/ 100 SEO score</text>
  <text fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600" x="220" y="480">High: Missing H1 - pages should have exactly one H1</text>
  <text fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600" x="220" y="520">Medium: Title 94 chars - may truncate in SERPs (aim d60)</text>
  <text fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600" x="220" y="560">Medium: Meta 215 chars - aim for 120155 characters</text>
  <text fill="#94a3b8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" x="220" y="610">Focus keywords used: devops, kubernetes, hiring · Mode: Analyse only</text>
</svg>
