<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Building a VAT Return System with Claude Code from invoices and expenses cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121f"/>
      <stop offset="0.55" stop-color="#0a2740"/>
      <stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="chipFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#0e1226"/>
    </linearGradient>
    <style>
      .kicker { fill: #fcd34d; font: 700 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 56px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.2px; }
      .tagline { fill: #fbbf24; font: 800 24px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub { fill: rgba(255,255,255,0.92); font: 500 16px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.24); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .num { fill: #fbbf24; font: 800 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .brand { fill: rgba(255,255,255,0.55); font: 700 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
      .nodeLabel { fill: #ffffff; font: 700 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .nodeText { fill: rgba(255,255,255,0.78); font: 400 9.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .audience { fill: rgba(255,255,255,0.7); font: 600 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .laneLabel { fill: #fcd34d; font: 700 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <text class="kicker" x="60" y="80">CLAUDE CODE  /  HMRC MTD  /  VAT RETURNS</text>
  <text class="title" x="60" y="156">VAT returns from your DB</text>
  <text class="tagline" x="60" y="200">Claude Code  +  invoices + expenses  -&gt;  Box-1-to-9 in minutes</text>
  <text class="sub" x="60" y="240">Read your own invoices and expenses, classify, compute, audit, submit. No spreadsheets.</text>

  <g>
    <rect class="chip" x="60" y="282" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="308">01</text>
    <text class="chipText" x="120" y="308">Connect DB (read-only)</text>

    <rect class="chip" x="60" y="336" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="362">02</text>
    <text class="chipText" x="120" y="362">Categorise + reconcile</text>

    <rect class="chip" x="60" y="390" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="416">03</text>
    <text class="chipText" x="120" y="416">Compute Box 1 to 9</text>

    <rect class="chip" x="60" y="444" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="470">04</text>
    <text class="chipText" x="120" y="470">Submit to HMRC MTD</text>
  </g>

  <g transform="translate(420,90)">
    <rect x="0" y="0" width="720" height="450" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

    <text class="laneLabel" x="20" y="28">TOPOLOGY  /  CLAUDE CODE AGENT AT THE CENTRE</text>

    <g transform="translate(280,52)">
      <rect width="160" height="200" rx="18" fill="url(#chipFace)" stroke="#fbbf24" stroke-width="2"/>
      <rect x="20" y="20" width="120" height="120" rx="14" fill="#1a1f3a" stroke="#fcd34d" stroke-width="1.5"/>
      <text class="nodeLabel" x="80" y="58" text-anchor="middle">CLAUDE CODE</text>
      <text class="nodeText" x="80" y="80" text-anchor="middle">repo-aware agent</text>
      <text class="nodeText" x="80" y="96" text-anchor="middle">plan / execute / verify</text>
      <text class="nodeText" x="80" y="112" text-anchor="middle">SQL + Python + bash</text>
      <text class="nodeText" x="80" y="128" text-anchor="middle">human approval gates</text>
      <text class="nodeLabel" x="80" y="166" text-anchor="middle">Local terminal</text>
      <text class="nodeText" x="80" y="182" text-anchor="middle">your data never leaves</text>
    </g>

    <g transform="translate(20,80)">
      <rect width="220" height="56" rx="10" fill="#0e2540" stroke="#42a5f5" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">Invoices + expenses DB</text>
      <text class="nodeText" x="110" y="36" text-anchor="middle">Postgres / MySQL / SQLite</text>
      <text class="nodeText" x="110" y="48" text-anchor="middle">read-only role / VAT period</text>
    </g>

    <g transform="translate(20,156)">
      <rect width="220" height="56" rx="10" fill="#1a1240" stroke="#7c3aed" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">Classifier prompt</text>
      <text class="nodeText" x="110" y="36" text-anchor="middle">VAT treatment per row</text>
      <text class="nodeText" x="110" y="48" text-anchor="middle">flag uncertain / anomalies</text>
    </g>

    <g transform="translate(20,232)">
      <rect width="220" height="56" rx="10" fill="#0c2b18" stroke="#22c55e" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">VAT engine (deterministic)</text>
      <text class="nodeText" x="110" y="36" text-anchor="middle">pure Python, no LLM in maths</text>
      <text class="nodeText" x="110" y="48" text-anchor="middle">Box 1 to 9 + scheme branching</text>
    </g>

    <g transform="translate(480,80)">
      <rect width="220" height="56" rx="10" fill="#3a1f08" stroke="#ef6c00" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">HMRC MTD API</text>
      <text class="nodeText" x="110" y="36" text-anchor="middle">OAuth2 + fraud headers</text>
      <text class="nodeText" x="110" y="48" text-anchor="middle">sandbox first, then prod</text>
    </g>

    <g transform="translate(480,156)">
      <rect width="220" height="56" rx="10" fill="#0e2540" stroke="#26c6da" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">Audit log + snapshots</text>
      <text class="nodeText" x="110" y="36" text-anchor="middle">append-only, signed</text>
      <text class="nodeText" x="110" y="48" text-anchor="middle">6-year HMRC retention</text>
    </g>

    <g transform="translate(480,232)">
      <rect width="220" height="56" rx="10" fill="#0c2b18" stroke="#16a34a" stroke-width="1.5"/>
      <text class="nodeLabel" x="110" y="22" text-anchor="middle">Approver UI / PDF + CSV</text>
      <text class="nodeText" x="110" y="36" text-anchor="middle">human signs off pre-submit</text>
      <text class="nodeText" x="110" y="48" text-anchor="middle">accountant review path</text>
    </g>

    <line x1="240" y1="108" x2="278" y2="138" stroke="#fbbf24" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="240" y1="184" x2="278" y2="160" stroke="#fbbf24" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="240" y1="260" x2="278" y2="206" stroke="#fbbf24" stroke-width="2" marker-end="url(#ar)"/>

    <line x1="442" y1="138" x2="478" y2="108" stroke="#fbbf24" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="442" y1="160" x2="478" y2="184" stroke="#fbbf24" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="442" y1="206" x2="478" y2="260" stroke="#fbbf24" stroke-width="2" marker-end="url(#ar)"/>

    <text class="laneLabel" x="20" y="316">SAFETY  /  WHERE THE LLM IS AND ISN'T</text>
    <g transform="translate(20,328)">
      <rect width="680" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text class="nodeText" x="14" y="24">LLM only for: classification + script generation + reconciliation hints  -  never inside the VAT arithmetic  -  human approval before any MTD submission</text>
    </g>

    <g transform="translate(20,384)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#42a5f5"/>
      <text class="nodeText" x="22" y="11">Source DB</text>
      <rect x="120" y="0" width="14" height="14" rx="3" fill="#7c3aed"/>
      <text class="nodeText" x="142" y="11">Claude Code</text>
      <rect x="240" y="0" width="14" height="14" rx="3" fill="#22c55e"/>
      <text class="nodeText" x="262" y="11">Engine</text>
      <rect x="340" y="0" width="14" height="14" rx="3" fill="#ef6c00"/>
      <text class="nodeText" x="362" y="11">HMRC MTD</text>
      <line x1="460" y1="7" x2="500" y2="7" stroke="#fbbf24" stroke-width="2"/>
      <text class="nodeText" x="506" y="11">Local data flow</text>
    </g>
  </g>

  <text class="brand" x="60" y="600">TENTHMATRIX.COM</text>
  <text class="audience" x="1140" y="600" text-anchor="end">FOUNDERS  /  FINANCE OPS  /  DEVELOPERS</text>
</svg>
