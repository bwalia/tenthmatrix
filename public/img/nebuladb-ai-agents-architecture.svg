<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">Visa AI Agent request flow on NebulaDB</title>
  <desc id="d">A question passes safety rules and profile extraction; a code planner calls three NebulaDB tools (Visa Finder SQL, public rule search SQL, and case status SQL scoped to the signed-in client); the evidence goes to the LLM gateway, and a numbers check verifies the reply.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#0b1020"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="26" font-weight="700" fill="#ffffff">Code owns the control flow, the model owns the prose</text>
    <text x="40" y="84" font-size="17" fill="#94a3b8">Everything in the blue band is deterministic and unit-tested. The model only writes from numbered evidence.</text>

    <rect x="24" y="110" width="1152" height="300" rx="16" fill="#0f1a33" stroke="#1e3a8a"/>
    <text x="44" y="138" font-size="15" font-weight="700" fill="#93c5fd" letter-spacing="1.5">DETERMINISTIC (agent.ts)</text>

    <rect x="44" y="160" width="170" height="90" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="129" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Question</text>
    <text x="129" y="222" text-anchor="middle" font-size="14" fill="#cbd5e1">"I'm 55, 900k THB,</text>
    <text x="129" y="240" text-anchor="middle" font-size="14" fill="#cbd5e1">want to retire"</text>

    <rect x="250" y="160" width="190" height="90" rx="12" fill="#3f1d1d" stroke="#f87171"/>
    <text x="345" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#fecaca">Safety rules</text>
    <text x="345" y="222" text-anchor="middle" font-size="14" fill="#fecaca">fraud, detention</text>
    <text x="345" y="240" text-anchor="middle" font-size="14" fill="#fecaca">→ fixed card, stop</text>

    <rect x="476" y="160" width="190" height="90" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="571" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Profile</text>
    <text x="571" y="222" text-anchor="middle" font-size="14" fill="#cbd5e1">age 55 · funds 900,000</text>
    <text x="571" y="240" text-anchor="middle" font-size="14" fill="#cbd5e1">purpose: retire</text>

    <rect x="702" y="160" width="170" height="90" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="787" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Planner</text>
    <text x="787" y="222" text-anchor="middle" font-size="14" fill="#cbd5e1">picks tools,</text>
    <text x="787" y="240" text-anchor="middle" font-size="14" fill="#cbd5e1">writes the SQL</text>

    <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M214 205 H246"/><path d="M440 205 H472"/><path d="M666 205 H698"/>
      <path d="M872 190 C 900 190, 900 184, 926 184"/>
      <path d="M872 205 C 900 205, 900 262, 926 262"/>
    </g>

    <rect x="930" y="150" width="226" height="68" rx="10" fill="#172554" stroke="#3b82f6"/>
    <text x="1043" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#dbeafe">visa_finder (SQL)</text>
    <text x="1043" y="200" text-anchor="middle" font-size="13" fill="#bfdbfe">min_age, min_funds_thb, purpose</text>

    <rect x="930" y="228" width="226" height="68" rx="10" fill="#172554" stroke="#3b82f6"/>
    <text x="1043" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#dbeafe">search_rules (SQL)</text>
    <text x="1043" y="278" text-anchor="middle" font-size="13" fill="#bfdbfe">client_id = 'public'</text>

    <rect x="930" y="306" width="226" height="68" rx="10" fill="#14532d" stroke="#22c55e"/>
    <text x="1043" y="334" text-anchor="middle" font-size="16" font-weight="700" fill="#dcfce7">case_status (SQL)</text>
    <text x="1043" y="356" text-anchor="middle" font-size="13" fill="#bbf7d0">signed-in client only</text>
    <path d="M872 235 C 905 235, 905 340, 926 340" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>

    <text x="44" y="300" font-size="15" font-weight="700" fill="#93c5fd">NebulaDB</text>
    <text x="44" y="324" font-size="14" fill="#cbd5e1">one bucket per business · embedded on write (nomic-embed-text, 768-d)</text>
    <text x="44" y="346" font-size="14" fill="#cbd5e1">semantic_match() + metadata filters · exact scan for small buckets</text>
    <text x="44" y="368" font-size="14" fill="#cbd5e1">permissions are predicates: private rows never leave the database</text>

    <rect x="24" y="436" width="1152" height="236" rx="16" fill="#1a1530" stroke="#5b21b6"/>
    <text x="44" y="464" font-size="15" font-weight="700" fill="#c4b5fd" letter-spacing="1.5">MODEL + GUARDS</text>

    <rect x="44" y="486" width="300" height="160" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="194" y="520" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Numbered evidence</text>
    <text x="194" y="548" text-anchor="middle" font-size="14" fill="#cbd5e1">[1] vt-oa  [2] vt-reti</text>
    <text x="194" y="570" text-anchor="middle" font-size="14" fill="#cbd5e1">[3] vt-privilege  [4] faq-…</text>
    <text x="194" y="604" text-anchor="middle" font-size="14" fill="#94a3b8">deduplicated, capped at 10</text>

    <rect x="400" y="486" width="340" height="160" rx="12" fill="#2e1065" stroke="#8b5cf6"/>
    <text x="570" y="520" text-anchor="middle" font-size="18" font-weight="700" fill="#ede9fe">LLM gateway</text>
    <text x="570" y="548" text-anchor="middle" font-size="14" fill="#ddd6fe">POST /api/v1/ai/chat</text>
    <text x="570" y="570" text-anchor="middle" font-size="14" fill="#ddd6fe">llama3.2:3b in prod · any model</text>
    <text x="570" y="604" text-anchor="middle" font-size="14" fill="#c4b5fd">"answer only from the sources,</text>
    <text x="570" y="624" text-anchor="middle" font-size="14" fill="#c4b5fd">cite every sentence"</text>

    <rect x="796" y="486" width="360" height="160" rx="12" fill="#1e293b" stroke="#f59e0b"/>
    <text x="976" y="520" text-anchor="middle" font-size="18" font-weight="700" fill="#fef3c7">Reply checks</text>
    <text x="976" y="548" text-anchor="middle" font-size="14" fill="#fde68a">every number must appear in a source</text>
    <text x="976" y="570" text-anchor="middle" font-size="14" fill="#fde68a">citations per sentence</text>
    <text x="976" y="604" text-anchor="middle" font-size="14" fill="#fcd34d">visa cards come from SQL rows,</text>
    <text x="976" y="624" text-anchor="middle" font-size="14" fill="#fcd34d">never from the model</text>

    <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M1043 374 V 420 H 300 V 482"/>
      <path d="M344 566 H396"/><path d="M740 566 H792"/>
    </g>
  </g>
</svg>
