<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Meta Muse Glimmer on Ollama for local agentic AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="0.55" stop-color="#0c1a2e"/>
      <stop offset="1" stop-color="#10241c"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.18" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.88" cy="0.72" r="0.48">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #67e8f9; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 42px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: -0.5px; }
      .sub { fill: rgba(255,255,255,0.86); font: 500 17px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.08); stroke: rgba(103,232,249,0.4); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .brand { fill: rgba(255,255,255,0.5); font: 700 12px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <text class="kicker" x="60" y="78">MUSE GLIMMER  /  OLLAMA  /  LOCAL AGENTS  /  APACHE 2.0</text>
  <text class="title" x="60" y="150">Always-on agents</text>
  <text class="title" x="60" y="208">on a single GPU</text>
  <text class="sub" x="60" y="265">Meta 30B Muse Glimmer - tool use, long tasks, failure recovery, offline.</text>
  <rect class="chip" x="60" y="320" width="90" height="36" rx="8"/>
  <text class="chipText" x="82" y="343">30B</text>
  <rect class="chip" x="165" y="320" width="100" height="36" rx="8"/>
  <text class="chipText" x="188" y="343">18GB</text>
  <rect class="chip" x="280" y="320" width="110" height="36" rx="8"/>
  <text class="chipText" x="298" y="343">128K ctx</text>
  <rect class="chip" x="405" y="320" width="90" height="36" rx="8"/>
  <text class="chipText" x="425" y="343">MLX</text>
  <rect class="chip" x="510" y="320" width="100" height="36" rx="8"/>
  <text class="chipText" x="530" y="343">Vision</text>
  <text class="brand" x="60" y="580">TENTHMATRIX.COM</text>
</svg>
