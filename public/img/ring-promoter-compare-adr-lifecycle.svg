<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Architecture Decision Record lifecycle and template: an ADR moves from Proposed to Accepted, and later to Superseded or Deprecated, or is Rejected. The Nygard template has five sections: Title, Status, Context, Decision and Consequences." font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D6D3F0"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#0D0B21"/>
  <text x="60" y="66" fill="#FF7AA2" font-size="20" font-weight="700" letter-spacing="4">ARCHITECTURE DECISION RECORDS</text>
  <text x="60" y="114" fill="#FFFFFF" font-size="36" font-weight="800">Lifecycle and the five-part template</text>

  <!-- Lifecycle -->
  <g font-size="26" font-weight="800">
    <rect x="60" y="160" width="250" height="84" rx="42" fill="#221D4C" stroke="#8B84D7" stroke-width="2"/>
    <text x="104" y="212" fill="#FFFFFF">Proposed</text>
    <path d="M185,246 L185,300" stroke="#D6D3F0" stroke-width="3" marker-end="url(#a)"/>
    <text x="200" y="282" fill="#B9B4E8" font-size="19" font-weight="600">reviewed in a PR</text>

    <rect x="60" y="306" width="250" height="84" rx="42" fill="#2C2559" stroke="#FF004E" stroke-width="3"/>
    <text x="104" y="358" fill="#FFFFFF">Accepted</text>
    <path d="M185,392 L185,446" stroke="#D6D3F0" stroke-width="3" marker-end="url(#a)"/>
    <text x="200" y="428" fill="#B9B4E8" font-size="19" font-weight="600">constraints change</text>

    <rect x="60" y="452" width="250" height="84" rx="42" fill="#221D4C" stroke="#8B84D7" stroke-width="2"/>
    <text x="90" y="504" fill="#FFFFFF">Superseded</text>
    <text x="60" y="584" fill="#D6D3F0" font-size="20" font-weight="600">by ADR-00N, which links back</text>
    <text x="60" y="630" fill="#B9B4E8" font-size="20" font-weight="500">Also: Rejected, Deprecated</text>
    <text x="60" y="662" fill="#B9B4E8" font-size="20" font-weight="500">Never edit an accepted ADR&#8217;s decision</text>
  </g>

  <!-- Template card -->
  <rect x="420" y="160" width="720" height="510" rx="20" fill="#221D4C" stroke="#5B53A6" stroke-width="2"/>
  <text x="452" y="208" fill="#FFD1DE" font-size="20" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">docs/adr/0001-use-ring-promoter.md</text>

  <g>
    <rect x="452" y="232" width="656" height="72" rx="12" fill="#0D0B21"/>
    <text x="476" y="278" fill="#FFFFFF" font-size="26" font-weight="800">Title</text>
    <text x="640" y="278" fill="#D6D3F0" font-size="21">short noun phrase, numbered</text>

    <rect x="452" y="316" width="656" height="72" rx="12" fill="#0D0B21"/>
    <text x="476" y="362" fill="#FFFFFF" font-size="26" font-weight="800">Status</text>
    <text x="640" y="362" fill="#D6D3F0" font-size="21">proposed, accepted, superseded</text>

    <rect x="452" y="400" width="656" height="72" rx="12" fill="#0D0B21"/>
    <text x="476" y="446" fill="#FFFFFF" font-size="26" font-weight="800">Context</text>
    <text x="640" y="446" fill="#D6D3F0" font-size="21">forces, constraints, options</text>

    <rect x="452" y="484" width="656" height="72" rx="12" fill="#0D0B21" stroke="#FF004E" stroke-width="2"/>
    <text x="476" y="530" fill="#FFFFFF" font-size="26" font-weight="800">Decision</text>
    <text x="640" y="530" fill="#D6D3F0" font-size="21">&#8220;We will &#8230;&#8221; in active voice</text>

    <rect x="452" y="568" width="656" height="72" rx="12" fill="#0D0B21"/>
    <text x="476" y="614" fill="#FFFFFF" font-size="26" font-weight="800">Consequences</text>
    <text x="680" y="614" fill="#D6D3F0" font-size="21">good, bad, revisit triggers</text>
  </g>
</svg>
