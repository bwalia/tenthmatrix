<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Secure AI agents in healthcare">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a2e"/>
      <stop offset="1" stop-color="#132f4a"/>
    </linearGradient>
    <style>
      .title { fill: #ffffff; font: 800 38px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .sub { fill: #cbd5e1; font: 500 17px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .kicker { fill: #38bdf8; font: 700 12px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 2.5px; }
      .box { fill: #16324f; stroke: #475569; stroke-width: 1.5; }
      .a { fill: rgba(56,189,248,0.12); stroke: #38bdf8; stroke-width: 2; }
      .b { fill: rgba(16,185,129,0.12); stroke: #10b981; stroke-width: 2; }
      .c { fill: rgba(251,146,60,0.12); stroke: #fb923c; stroke-width: 2; }
      .lbl { fill: #f8fafc; font: 700 15px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .sm { fill: #94a3b8; font: 500 12px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; }
      .brand { fill: #64748b; font: 700 11px ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="630" fill="#38bdf8"/>
  <text class="kicker" x="48" y="52">HEALTHCARE AI AGENTS  |  SECURITY · GOVERNANCE · GUARDRAILS</text>
  <text class="title" x="48" y="108">How to Deploy Secure AI Agents</text>
  <text class="title" x="48" y="156">in Healthcare</text>
  <text class="sub" x="48" y="200">Right access for appointments, billing and clinical support — and no more</text>

  <rect class="a" x="48" y="250" width="340" height="150" rx="10"/>
  <text class="lbl" x="72" y="300">Keep PHI out of the model</text>
  <text class="sm" x="72" y="332">Hand off payments and sensitive</text>
  <text class="sm" x="72" y="354">steps to fixed workflows</text>

  <rect class="b" x="420" y="250" width="340" height="150" rx="10"/>
  <text class="lbl" x="444" y="300">System sets the limits</text>
  <text class="sm" x="444" y="332">AI understands intent;</text>
  <text class="sm" x="444" y="354">rules decide permissions</text>

  <rect class="c" x="792" y="250" width="360" height="150" rx="10"/>
  <text class="lbl" x="816" y="300">Audit what it did</text>
  <text class="sm" x="816" y="332">Trace tools and decisions</text>
  <text class="sm" x="816" y="354">without copying more PHI</text>

  <rect class="box" x="48" y="430" width="1104" height="110" rx="10"/>
  <text class="lbl" x="72" y="480">Citizen health services</text>
  <text class="sm" x="72" y="512">Dynamic answers for patients — with HIPAA / PCI guardrails and least-privilege tool access</text>

  <text class="brand" x="48" y="590">WORKSTATION · AI HEALTHCARE</text>
</svg>
