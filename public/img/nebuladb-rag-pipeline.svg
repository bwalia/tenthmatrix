<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="NebulaDB RAG pipeline: ingest, chunk, embed, index, search, generate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="1" stop-color="#0e1638"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .title { fill: #ffffff; font: 800 22px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .subtitle { fill: #9fb0ff; font: 500 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lane { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.10); stroke-width: 1.5; }
      .laneTitle { fill: #cfd6ff; font: 800 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
      .step { fill: #101a3a; stroke: #2c3a78; stroke-width: 1.5; }
      .step1 { fill: #0e1e3d; stroke: #2563eb; stroke-width: 1.5; }
      .step2 { fill: #1a103a; stroke: #7c3aed; stroke-width: 1.5; }
      .step3 { fill: #0c2e36; stroke: #00acc1; stroke-width: 1.5; }
      .step4 { fill: #3a1f08; stroke: #ef6c00; stroke-width: 1.5; }
      .step5 { fill: #0c2b18; stroke: #2e7d32; stroke-width: 1.5; }
      .step6 { fill: #2a0a1f; stroke: #ec4899; stroke-width: 1.5; }
      .num { fill: #ffffff; font: 800 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .stepLabel { fill: #ffffff; font: 700 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .stepText { fill: rgba(255,255,255,0.78); font: 400 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .code { fill: #ffd380; font: 600 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tag { fill: #9fb0ff; font: 700 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .flow { stroke: #ab47bc; stroke-width: 2; fill: none; }
      .api { fill: #312e81; stroke: #6366f1; stroke-width: 1; }
      .footnote { fill: rgba(255,255,255,0.55); font: 400 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ab47bc"/>
    </marker>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>

  <text class="title" x="600" y="36" text-anchor="middle">NebulaDB RAG pipeline</text>
  <text class="subtitle" x="600" y="56" text-anchor="middle">Complete ingest-to-generate in a single binary  /  REST, gRPC, Postgres entry points</text>

  <g transform="translate(20,80)">
    <rect width="180" height="170" rx="12" class="step1"/>
    <circle cx="36" cy="32" r="16" fill="#1d4ed8"/>
    <text class="num" x="36" y="38" text-anchor="middle">1</text>
    <text class="stepLabel" x="90" y="38">Ingest</text>
    <text class="stepText" x="14" y="76">REST  /  gRPC</text>
    <text class="code" x="14" y="92">POST /api/v1/bucket/{b}/document</text>
    <text class="stepText" x="14" y="112">payload: text + metadata JSON</text>
    <text class="stepText" x="14" y="128">multi-tenant per bucket</text>
    <text class="stepText" x="14" y="146">audit + lineage tagged</text>
    <text class="stepText" x="14" y="162">idempotency key respected</text>
  </g>

  <g transform="translate(216,80)">
    <rect width="180" height="170" rx="12" class="step2"/>
    <circle cx="36" cy="32" r="16" fill="#5b21b6"/>
    <text class="num" x="36" y="38" text-anchor="middle">2</text>
    <text class="stepLabel" x="90" y="38">Chunk</text>
    <text class="stepText" x="14" y="76">crate: nebula-chunk</text>
    <text class="stepText" x="14" y="92">fixed 500 chars or sentence</text>
    <text class="stepText" x="14" y="112">unicode-safe boundary splitter</text>
    <text class="stepText" x="14" y="128">50-char overlap</text>
    <text class="stepText" x="14" y="146">drops empty + dedup hash</text>
    <text class="stepText" x="14" y="162">emits chunk_id sequence</text>
  </g>

  <g transform="translate(412,80)">
    <rect width="180" height="170" rx="12" class="step3"/>
    <circle cx="36" cy="32" r="16" fill="#0e7490"/>
    <text class="num" x="36" y="38" text-anchor="middle">3</text>
    <text class="stepLabel" x="90" y="38">Embed</text>
    <text class="stepText" x="14" y="76">crate: nebula-embed</text>
    <text class="stepText" x="14" y="92">OpenAI compatible adapters</text>
    <text class="stepText" x="14" y="112">dim: 384 / 768 / 1536</text>
    <text class="stepText" x="14" y="128">LRU + Redis cache (SHA-256)</text>
    <text class="stepText" x="14" y="146">batch up to 64 chunks</text>
    <text class="stepText" x="14" y="162">model-aware retries</text>
  </g>

  <g transform="translate(608,80)">
    <rect width="180" height="170" rx="12" class="step4"/>
    <circle cx="36" cy="32" r="16" fill="#b45309"/>
    <text class="num" x="36" y="38" text-anchor="middle">4</text>
    <text class="stepLabel" x="90" y="38">Index</text>
    <text class="stepText" x="14" y="76">crate: nebula-vector</text>
    <text class="stepText" x="14" y="92">HNSW graph (M=16 default)</text>
    <text class="stepText" x="14" y="112">SIMD + rayon  /  zero-copy</text>
    <text class="stepText" x="14" y="128">cosine / L2 / dot product</text>
    <text class="stepText" x="14" y="146">WAL persisted on every write</text>
    <text class="stepText" x="14" y="162">snapshot for cold start</text>
  </g>

  <g transform="translate(804,80)">
    <rect width="180" height="170" rx="12" class="step5"/>
    <circle cx="36" cy="32" r="16" fill="#047857"/>
    <text class="num" x="36" y="38" text-anchor="middle">5</text>
    <text class="stepLabel" x="90" y="38">Search</text>
    <text class="stepText" x="14" y="76">semantic + SQL hybrid</text>
    <text class="code" x="14" y="92">SELECT semantic_match(...)</text>
    <text class="code" x="14" y="108">vector_distance(...)</text>
    <text class="stepText" x="14" y="128">metadata filters  /  top_k</text>
    <text class="stepText" x="14" y="146">rerank pluggable</text>
    <text class="stepText" x="14" y="162">explainable scores returned</text>
  </g>

  <g transform="translate(1000,80)">
    <rect width="180" height="170" rx="12" class="step6"/>
    <circle cx="36" cy="32" r="16" fill="#9d174d"/>
    <text class="num" x="36" y="38" text-anchor="middle">6</text>
    <text class="stepLabel" x="90" y="38">Generate</text>
    <text class="stepText" x="14" y="76">crate: nebula-llm</text>
    <text class="stepText" x="14" y="92">Ollama  /  OpenAI  /  mock</text>
    <text class="stepText" x="14" y="112">SSE streaming</text>
    <text class="code" x="14" y="128">event: context | answer_delta</text>
    <text class="stepText" x="14" y="148">cancellable on client disconnect</text>
    <text class="stepText" x="14" y="164">token + cost accounting</text>
  </g>

  <line x1="200" y1="165" x2="216" y2="165" class="flow" marker-end="url(#ar)"/>
  <line x1="396" y1="165" x2="412" y2="165" class="flow" marker-end="url(#ar)"/>
  <line x1="592" y1="165" x2="608" y2="165" class="flow" marker-end="url(#ar)"/>
  <line x1="788" y1="165" x2="804" y2="165" class="flow" marker-end="url(#ar)"/>
  <line x1="984" y1="165" x2="1000" y2="165" class="flow" marker-end="url(#ar)"/>

  <g transform="translate(20,280)">
    <rect width="1160" height="100" rx="12" class="lane"/>
    <text class="laneTitle" x="20" y="22">API ENDPOINTS</text>
    <g transform="translate(20,32)">
      <rect width="270" height="22" rx="4" class="api"/>
      <text class="code" x="14" y="16">POST /api/v1/ai/rag</text>
      <rect x="290" y="0" width="270" height="22" rx="4" class="api"/>
      <text class="code" x="304" y="16">POST /api/v1/ai/search</text>
      <rect x="580" y="0" width="270" height="22" rx="4" class="api"/>
      <text class="code" x="594" y="16">POST /api/v1/query (SQL)</text>
      <rect x="870" y="0" width="270" height="22" rx="4" class="api"/>
      <text class="code" x="884" y="16">POST /api/v1/bucket/{b}/document</text>
    </g>
    <g transform="translate(20,60)">
      <rect width="270" height="22" rx="4" class="api"/>
      <text class="code" x="14" y="16">gRPC AIService.Rag</text>
      <rect x="290" y="0" width="270" height="22" rx="4" class="api"/>
      <text class="code" x="304" y="16">psql SELECT semantic_match()</text>
      <rect x="580" y="0" width="270" height="22" rx="4" class="api"/>
      <text class="code" x="594" y="16">SSE stream=true</text>
      <rect x="870" y="0" width="270" height="22" rx="4" class="api"/>
      <text class="code" x="884" y="16">GET /metrics (Prometheus)</text>
    </g>
  </g>

  <g transform="translate(20,395)">
    <rect width="1160" height="80" rx="12" class="step"/>
    <text class="tag" x="20" y="22">SSE STREAM EXAMPLE</text>
    <text class="code" x="20" y="40">event: context  /  data: {chunk_index:0, text:"NebulaDB uses HNSW...", score:0.92}</text>
    <text class="code" x="20" y="56">event: answer_delta  /  data: {token:"Based on the retrieved context [1], NebulaDB..."}</text>
    <text class="code" x="20" y="72">event: done  /  data: {chunks_used:3, model:"llama3", elapsed_ms:412, prompt_tokens:217, completion_tokens:84}</text>
  </g>
</svg>
