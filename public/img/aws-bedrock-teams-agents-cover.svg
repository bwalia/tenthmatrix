<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Amazon Bedrock AgentCore SageMaker Amazon Q agents in Microsoft Teams">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#132a44"/>
      <stop offset="1" stop-color="#1a1528"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.25" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#ff9900" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#6264a7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6264a7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #ffb84d; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 44px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: -0.4px; }
      .sub { fill: rgba(255,255,255,0.88); font: 500 17px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.08); stroke: rgba(255,184,77,0.4); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .brand { fill: rgba(255,255,255,0.5); font: 700 12px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <text class="kicker" x="60" y="72">AWS GENAI  /  AGENTCORE  /  MICROSOFT TEAMS</text>
  <text class="title" x="60" y="145">Bedrock + AgentCore + Teams</text>
  <text class="sub" x="60" y="195">SageMaker for MLOps. Amazon Q for employees. Agents where work happens.</text>
  <rect class="chip" x="60" y="250" width="120" height="34" rx="8"/>
  <text class="chipText" x="80" y="272">Bedrock</text>
  <rect class="chip" x="195" y="250" width="140" height="34" rx="8"/>
  <text class="chipText" x="210" y="272">AgentCore</text>
  <rect class="chip" x="350" y="250" width="140" height="34" rx="8"/>
  <text class="chipText" x="365" y="272">SageMaker</text>
  <rect class="chip" x="505" y="250" width="120" height="34" rx="8"/>
  <text class="chipText" x="530" y="272">Amazon Q</text>
  <rect class="chip" x="640" y="250" width="100" height="34" rx="8"/>
  <text class="chipText" x="665" y="272">Teams</text>
  <rect x="60" y="330" width="1080" height="2" fill="rgba(255,184,77,0.25)"/>
  <text class="sub" x="60" y="390">FDE playbook: first Teams agent, RAG, tooling, and calendar estimates</text>
  <text class="brand" x="60" y="580">WORKSTATION.CO.UK</text>
</svg>
