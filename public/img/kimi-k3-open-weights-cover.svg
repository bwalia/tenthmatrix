<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Kimi K3 and open-weight models accelerate enterprise AI adoption">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.5" stop-color="#0f1c2e"/>
      <stop offset="1" stop-color="#13251f"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.2" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #67e8f9; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 42px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: -0.5px; }
      .sub { fill: rgba(255,255,255,0.86); font: 500 17px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.08); stroke: rgba(103,232,249,0.4); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 13px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .brand { fill: rgba(255,255,255,0.5); font: 700 12px system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <text class="kicker" x="60" y="78">KIMI K3  /  OPEN WEIGHTS  /  vLLM  /  MCP</text>
  <text class="title" x="60" y="150">Open-weight models</text>
  <text class="title" x="60" y="208">hit frontier agent work</text>
  <text class="sub" x="60" y="265">Moonshot Kimi K3, day-0 serving, and why production ops still decide winners.</text>
  <rect class="chip" x="60" y="320" width="110" height="36" rx="8"/>
  <text class="chipText" x="82" y="343">Kimi K3</text>
  <rect class="chip" x="185" y="320" width="100" height="36" rx="8"/>
  <text class="chipText" x="210" y="343">2.8T</text>
  <rect class="chip" x="300" y="320" width="90" height="36" rx="8"/>
  <text class="chipText" x="322" y="343">vLLM</text>
  <rect class="chip" x="405" y="320" width="150" height="36" rx="8"/>
  <text class="chipText" x="425" y="343">1M context</text>
  <text class="brand" x="60" y="580">WORKSTATION.CO.UK</text>
</svg>
