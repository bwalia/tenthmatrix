<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Couchbase High Availability: multi-region with XDCR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0710"/>
      <stop offset="0.55" stop-color="#3a0a14"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#ea2328" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#ea2328" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .kicker { fill: #ff8a80; font: 700 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #ffffff; font: 800 64px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .tagline { fill: #ff5252; font: 800 28px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub { fill: rgba(255,255,255,0.92); font: 500 17px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .chip { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.24); stroke-width: 1.5; }
      .chipText { fill: #ffffff; font: 700 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .num { fill: #ff5252; font: 800 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .brand { fill: rgba(255,255,255,0.55); font: 700 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
      .nodeLabel { fill: #ffffff; font: 700 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .nodeText { fill: rgba(255,255,255,0.75); font: 400 9px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .audience { fill: rgba(255,255,255,0.7); font: 600 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .laneLabel { fill: #ff8a80; font: 700 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2px; }
      .regionLabel { fill: #ffcc80; font: 700 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="rgba(255,255,255,0.55)"/>
    </marker>
    <marker id="arXdcr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ab47bc"/>
    </marker>
    <marker id="arData" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#4caf50"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text class="kicker" x="60" y="80">COUCHBASE  /  HIGH AVAILABILITY</text>
  <text class="title" x="60" y="160">Couchbase HA</text>
  <text class="tagline" x="60" y="206">Multi-region active-active with XDCR</text>
  <text class="sub" x="60" y="246">CAO orchestrates intra-region HA. XDCR replicates buckets across regions for DR + locality.</text>

  <g>
    <rect class="chip" x="60" y="288" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="314">01</text>
    <text class="chipText" x="120" y="314">App - nearest region</text>

    <rect class="chip" x="60" y="342" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="368">02</text>
    <text class="chipText" x="120" y="368">Intra-region replicas (3x)</text>

    <rect class="chip" x="60" y="396" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="422">03</text>
    <text class="chipText" x="120" y="422">XDCR continuous cross-region</text>

    <rect class="chip" x="60" y="450" rx="20" ry="20" width="290" height="42"/>
    <text class="num" x="80" y="476">04</text>
    <text class="chipText" x="120" y="476">CAO auto-failover + rebalance</text>
  </g>

  <g transform="translate(400,90)">
    <rect x="0" y="0" width="760" height="450" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

    <text class="laneLabel" x="20" y="28">CONTROL PLANE  /  CAO OPERATOR PER REGION</text>
    <rect x="20" y="40" width="720" height="40" rx="10" fill="#1a1240" stroke="#6a3eff" stroke-width="1.5"/>
    <text class="nodeLabel" x="40" y="64">CAO operator</text>
    <text class="nodeText" x="180" y="64">reconciles CouchbaseCluster CR per namespace</text>
    <text class="nodeText" x="480" y="64">auto-failover  /  rebalance  /  XDCR config</text>

    <text class="laneLabel" x="20" y="106">DATA PLANE  /  REGIONS (active-active)</text>

    <g transform="translate(20,120)">
      <rect x="0" y="0" width="230" height="170" rx="12" fill="rgba(255,82,82,0.08)" stroke="#ff5252" stroke-width="1.5"/>
      <text class="regionLabel" x="14" y="22">REGION  /  US-EAST</text>
      <rect x="14" y="36" width="60" height="50" rx="8" fill="#0f3a1c" stroke="#00ED64" stroke-width="1.5"/>
      <text class="nodeLabel" x="44" y="58" text-anchor="middle">KV</text>
      <text class="nodeText" x="44" y="74" text-anchor="middle">3 pods</text>
      <rect x="84" y="36" width="60" height="50" rx="8" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="114" y="58" text-anchor="middle">Index</text>
      <text class="nodeText" x="114" y="74" text-anchor="middle">2 pods</text>
      <rect x="154" y="36" width="60" height="50" rx="8" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="184" y="58" text-anchor="middle">Query</text>
      <text class="nodeText" x="184" y="74" text-anchor="middle">2 pods</text>
      <rect x="14" y="96" width="200" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text class="nodeText" x="114" y="116" text-anchor="middle">vbuckets: 1024  /  replicas: 2</text>
      <rect x="14" y="134" width="200" height="22" rx="6" fill="rgba(76,175,80,0.15)" stroke="#4caf50" stroke-width="1"/>
      <text class="nodeText" x="114" y="148" text-anchor="middle">SDK app traffic local</text>
    </g>

    <g transform="translate(265,120)">
      <rect x="0" y="0" width="230" height="170" rx="12" fill="rgba(255,82,82,0.08)" stroke="#ff5252" stroke-width="1.5"/>
      <text class="regionLabel" x="14" y="22">REGION  /  EU-WEST</text>
      <rect x="14" y="36" width="60" height="50" rx="8" fill="#0f3a1c" stroke="#00ED64" stroke-width="1.5"/>
      <text class="nodeLabel" x="44" y="58" text-anchor="middle">KV</text>
      <text class="nodeText" x="44" y="74" text-anchor="middle">3 pods</text>
      <rect x="84" y="36" width="60" height="50" rx="8" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="114" y="58" text-anchor="middle">Index</text>
      <text class="nodeText" x="114" y="74" text-anchor="middle">2 pods</text>
      <rect x="154" y="36" width="60" height="50" rx="8" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="184" y="58" text-anchor="middle">Query</text>
      <text class="nodeText" x="184" y="74" text-anchor="middle">2 pods</text>
      <rect x="14" y="96" width="200" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text class="nodeText" x="114" y="116" text-anchor="middle">vbuckets: 1024  /  replicas: 2</text>
      <rect x="14" y="134" width="200" height="22" rx="6" fill="rgba(76,175,80,0.15)" stroke="#4caf50" stroke-width="1"/>
      <text class="nodeText" x="114" y="148" text-anchor="middle">SDK app traffic local</text>
    </g>

    <g transform="translate(510,120)">
      <rect x="0" y="0" width="230" height="170" rx="12" fill="rgba(255,82,82,0.08)" stroke="#ff5252" stroke-width="1.5"/>
      <text class="regionLabel" x="14" y="22">REGION  /  AP-SOUTH</text>
      <rect x="14" y="36" width="60" height="50" rx="8" fill="#0f3a1c" stroke="#00ED64" stroke-width="1.5"/>
      <text class="nodeLabel" x="44" y="58" text-anchor="middle">KV</text>
      <text class="nodeText" x="44" y="74" text-anchor="middle">3 pods</text>
      <rect x="84" y="36" width="60" height="50" rx="8" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="114" y="58" text-anchor="middle">Index</text>
      <text class="nodeText" x="114" y="74" text-anchor="middle">2 pods</text>
      <rect x="154" y="36" width="60" height="50" rx="8" fill="#0c2b18" stroke="#2e7d32" stroke-width="1.5"/>
      <text class="nodeLabel" x="184" y="58" text-anchor="middle">Query</text>
      <text class="nodeText" x="184" y="74" text-anchor="middle">2 pods</text>
      <rect x="14" y="96" width="200" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text class="nodeText" x="114" y="116" text-anchor="middle">vbuckets: 1024  /  replicas: 2</text>
      <rect x="14" y="134" width="200" height="22" rx="6" fill="rgba(76,175,80,0.15)" stroke="#4caf50" stroke-width="1"/>
      <text class="nodeText" x="114" y="148" text-anchor="middle">SDK app traffic local</text>
    </g>

    <path d="M 250 200 Q 257 175 285 200" stroke="#ab47bc" stroke-width="2.5" stroke-dasharray="2 4" fill="none" marker-end="url(#arXdcr)"/>
    <path d="M 285 220 Q 257 245 250 220" stroke="#ab47bc" stroke-width="2.5" stroke-dasharray="2 4" fill="none" marker-end="url(#arXdcr)"/>
    <path d="M 495 200 Q 502 175 530 200" stroke="#ab47bc" stroke-width="2.5" stroke-dasharray="2 4" fill="none" marker-end="url(#arXdcr)"/>
    <path d="M 530 220 Q 502 245 495 220" stroke="#ab47bc" stroke-width="2.5" stroke-dasharray="2 4" fill="none" marker-end="url(#arXdcr)"/>
    <text class="nodeText" x="267" y="170" text-anchor="middle" fill="#ab47bc">XDCR</text>
    <text class="nodeText" x="512" y="170" text-anchor="middle" fill="#ab47bc">XDCR</text>

    <text class="laneLabel" x="20" y="320">FAILOVER WORKFLOW (intra-region)</text>
    <g transform="translate(20,332)">
      <rect x="0" y="0" width="720" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text class="nodeText" x="14" y="24">CAO detects pod failure  -  graceful failover after auto-failover timeout  -  replica vbuckets promoted  -  rebalance replicas back to N  -  SDK retries on new endpoint</text>
    </g>

    <g transform="translate(20,388)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#00ED64"/>
      <text class="nodeText" x="22" y="11">KV (data service)</text>
      <rect x="130" y="0" width="14" height="14" rx="3" fill="#2e7d32"/>
      <text class="nodeText" x="152" y="11">Index / Query</text>
      <rect x="240" y="0" width="14" height="14" rx="3" fill="#6a3eff"/>
      <text class="nodeText" x="262" y="11">CAO control plane</text>
      <line x1="380" y1="7" x2="410" y2="7" stroke="#ab47bc" stroke-width="2.5" stroke-dasharray="2 4"/>
      <text class="nodeText" x="416" y="11">XDCR cross-region</text>
      <line x1="560" y1="7" x2="590" y2="7" stroke="#4caf50" stroke-width="2"/>
      <text class="nodeText" x="596" y="11">SDK data path</text>
    </g>
  </g>

  <text class="brand" x="60" y="600">TENTHMATRIX.COM</text>
  <text class="audience" x="1140" y="600" text-anchor="end">SRE  /  DBA  /  PLATFORM TEAMS</text>
</svg>
