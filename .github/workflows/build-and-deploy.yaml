name: "Build and Deploy TenthMatrix Website"

# Adapted from Workstation's build-and-deploy.yaml:
#   - prod = static export → S3 (deploy-s3.yaml, also run by content-refresh.yaml)
#   - int/test/acc on k3s; no shop jobs
#   - image tm-frontend, chart devops/helm-charts/tm-chart, releases tm-<env>
#
# Releases go through Ring Promoter (https://rp.workstation.co.uk/?app=tenthmatrix-website),
# like www.workstation.co.uk:
#   push to main    → verify + build the image (tm-frontend:<sha7>) → seed that
#                     tag into Ring Promoter's int ring. Nothing on a push
#                     deploys by itself.
#   promote         → int → test → acc → prod from the Ring Promoter UI. Each is
#                     a deploy-only dispatch of this workflow (TARGET_ENV=<ring>,
#                     DEPLOYMENT_TYPE=deploy, IMAGE_TAG=<sha7>) of the exact
#                     image the ring before ran; Ring Promoter then checks the
#                     ring reports that tag (k3s: /api/health; prod: the S3
#                     bucket's /version.json).
#   prod            → the chat API release on k3s (tm-prod), then the static
#                     export of that same commit to S3 (deploy-s3.yaml).
#   manual dispatch → break-glass only: it bypasses Ring Promoter's record.

on:
  push:
    branches: [main]
    # Products (products/*) build and ship on their own; a commit that only
    # touches them must not rebuild and redeploy the website.
    paths-ignore:
      - 'products/**'

  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Target environment"
        default: "test"
        required: true
        options: [int, test, acc, prod]
      DEPLOYMENT_TYPE:
        type: choice
        description: "Build only, deploy only, or both"
        default: "build-and-deploy"
        required: true
        options: [build, deploy, build-and-deploy]
      IMAGE_TAG:
        type: string
        description: "Image tag to deploy (leave empty to build new)"
        required: false

env:
  IMAGE_NAME: tm-frontend
  IMAGE_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: tm-build-and-deploy-main
  cancel-in-progress: false

jobs:
  # ── Compute next release version (claims nothing; auto-tag pushes it) ──
  compute-version:
    name: "🔢 Compute Release Version"
    runs-on: k3s-linux
    outputs:
      next_version: ${{ steps.calc.outputs.next_version }}
      should_tag: ${{ steps.calc.outputs.should_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate next version
        id: calc
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ -z "$LATEST_TAG" ]; then
              NEXT_VERSION="v0.1.0"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
              NEXT_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            if git tag -l "$NEXT_VERSION" | grep -q "^$NEXT_VERSION$"; then
              echo "::warning::Tag $NEXT_VERSION already exists — no tag will be created."
              SHOULD_TAG=false
            else
              SHOULD_TAG=true
            fi
          else
            NEXT_VERSION="${LATEST_TAG:-v0.0.0}"
            SHOULD_TAG=false
          fi
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "should_tag=$SHOULD_TAG" >> "$GITHUB_OUTPUT"

  # ── Build ──────────────────────────────────────────────────────────────
  build:
    name: "🏗️ Verify, Build & Push Docker Image"
    runs-on: k3s-linux
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.DEPLOYMENT_TYPE != 'deploy')
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Self-hosted runners reuse one checkout folder per repo across every
      # workflow. Start from an empty folder so state left by another job (a
      # sparse checkout once left package-lock.json missing) can't leak in.
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

      - uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Same gates as prebuild (blog assets, SVG XML, OpsAPI host map, theme
      # copy, i18n) so a bad commit fails before the slow docker build.
      - name: Verify
        run: npm run verify

      - name: Build and push Docker image
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "${{ secrets.DOCKER_PASSWD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          # Shared BuildKit on k3s1 keeps the layer cache across ephemeral
          # runner pods (a cold in-pod build took 21 min). --pull keeps base
          # images fresh, which is what --no-cache was for.
          .github/scripts/docker-build-push.sh Dockerfile.prod . "${IMAGE}" "${IMAGE_TAG}" --pull

  # ── Cloudflare DNS: CNAME every env host → the wslproxy edge ──────────
  # Grey cloud (proxied=false): the edge terminates TLS. Hostnames are read
  # from the Helm values so DNS cannot drift from the Ingress. Gated on the
  # DNS_WSLPROXY_ENABLED repo variable.
  dns:
    name: "🌐 Cloudflare DNS (tenthmatrix.com)"
    runs-on: k3s-linux
    needs: [compute-version]
    if: >-
      vars.DNS_WSLPROXY_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.DEPLOYMENT_TYPE != 'build'))
    env:
      DNS_TARGET: lon1.pop0.uk
      DNS_PROXIED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CNAMEs for all env hosts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TM_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.TM_CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE: tenthmatrix.com
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/cloudflare-dns.sh
          for ENV in int test acc prod; do
            VALUES="devops/helm-charts/tm-chart/values-${ENV}.yaml"
            HOSTS=$(grep -E '^[[:space:]]*-[[:space:]]*host:' "$VALUES" | sed 's/.*host:[[:space:]]*//')
            for HOST in $HOSTS; do
              echo "Ensuring ${HOST} -> ${DNS_TARGET} (proxied=${DNS_PROXIED})"
              ./deploy/scripts/cloudflare-dns.sh --name "$HOST" --content "$DNS_TARGET" --proxied "$DNS_PROXIED"
            done
          done

  # ── Register the vhosts with the wslproxy control plane ────────────────
  wslproxy:
    name: "🧭 Register wslproxy domains"
    needs: [dns]
    if: >-
      vars.DNS_WSLPROXY_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.DEPLOYMENT_TYPE != 'build'))
    uses: ./.github/workflows/wslproxy-register-domains.yml
    with:
      TARGET_ENV: prod
      ACTIVATE_CONFIG: true
      runner_labels: '["self-hosted","macOS","ARM64"]'
    secrets: inherit

  # ── Resolve image tag (deploy-only dispatch reuses one) ───────────────
  resolve-tag:
    name: "🏷️ Resolve Image Tag"
    runs-on: k3s-linux
    needs: [build]
    if: >-
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    outputs:
      image_tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ needs.build.result }}" = "success" ] && [ -n "${{ needs.build.outputs.image_tag }}" ]; then
            echo "tag=${{ needs.build.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.IMAGE_TAG }}" ]; then
            echo "tag=${{ github.event.inputs.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

  # ── Merge to main: hand the new image to Ring Promoter's int ring ──────
  # Ring Promoter (rp.workstation.co.uk, app tenthmatrix-website) dispatches
  # this workflow with TARGET_ENV=int + IMAGE_TAG, checks /api/health reports
  # that tag and records it; int → test → acc → prod are promoted from the RP
  # UI. Needs repo secret RING_PROMOTER_TOKEN (the RP_API_TOKEN of the
  # workstation-ring-promoter instance), same as bwalia/workstation-website.
  seed-ring-promoter:
    name: "💍 Seed Ring Promoter (tenthmatrix-website → int)"
    runs-on: k3s-linux
    needs: [build]
    timeout-minutes: 10
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.build.result == 'success'
    steps:
      - name: Seed int with this image
        env:
          RP_BASE: https://rp.workstation.co.uk
          RP_TOKEN: ${{ secrets.RING_PROMOTER_TOKEN }}
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          [ -n "${RP_TOKEN:-}" ] || { echo "::error::Secret RING_PROMOTER_TOKEN is missing: ${TAG} is built but NOT deploying. Seed it into int at ${RP_BASE}/?app=tenthmatrix-website."; exit 1; }
          [ -n "${TAG:-}" ] || { echo "::error::build produced no image_tag: nothing to seed"; exit 1; }
          echo "Seeding tenthmatrix-website int with ${TAG}"
          # async=true: RP validates synchronously (4xx on a bad ring/version)
          # and returns a job id; the deploy itself is the run RP dispatches.
          BODY=$(mktemp)
          CODE=$(curl -sS --max-time 60 -o "$BODY" -w "%{http_code}" \
            -X POST "${RP_BASE}/api/apps/tenthmatrix-website/seed?async=true" \
            -H "Authorization: Bearer ${RP_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"ring\":\"int\",\"version\":\"${TAG}\"}" || echo 000)
          echo "HTTP $CODE"; cat "$BODY"; echo
          case "$CODE" in
            200|202) echo "::notice::Ring Promoter accepted ${TAG} for int: ${RP_BASE}/?app=tenthmatrix-website" ;;
            000) echo "::error::could not reach ${RP_BASE}: ${TAG} is pushed but NOT deploying. Seed it in the RP UI."; exit 1 ;;
            *) echo "::error::Ring Promoter rejected the seed (HTTP $CODE). ${TAG} is pushed; seed it by hand once fixed."; exit 1 ;;
          esac

  # ── Stage 1: INT (Ring Promoter dispatch) ─────────────────────────────
  deploy-int:
    name: "🧪 INT → K3S"
    needs: [resolve-tag, wslproxy]
    if: >-
      always() &&
      needs.resolve-tag.result == 'success' &&
      (needs.wslproxy.result == 'success' || needs.wslproxy.result == 'skipped') &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.DEPLOYMENT_TYPE != 'build' &&
      github.event.inputs.TARGET_ENV == 'int'
    uses: ./.github/workflows/deploy-k3s.yaml
    with:
      environment: int
      namespace: int
      release_name: tm-int
      values_file: values-int.yaml
      image_tag: ${{ needs.resolve-tag.outputs.image_tag }}
      smoke_test_port: "8180"
      runner_labels: '["k3s-linux"]'
    secrets:
      KUBE_CONFIG_DATA_K3S: ${{ secrets.KUBE_CONFIG_DATA_K3S }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ── PROD 1/2: API on k3s (Ring Promoter prod promotion) ───────────────
  # Prod pages are the S3 export; this release serves only what the export
  # can't: the edge sends www.tenthmatrix.com/api/chat here (rule
  # tm-website-chat-api), everything else stays on S3.
  deploy-prod-api:
    name: "🛰️ PROD API → K3S"
    needs: [resolve-tag]
    if: >-
      always() &&
      needs.resolve-tag.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.DEPLOYMENT_TYPE != 'build' &&
      github.event.inputs.TARGET_ENV == 'prod'
    uses: ./.github/workflows/deploy-k3s.yaml
    with:
      environment: prod
      namespace: prod
      release_name: tm-prod
      values_file: values-prod.yaml
      image_tag: ${{ needs.resolve-tag.outputs.image_tag }}
      smoke_test_port: "8183"
      runner_labels: '["k3s-linux"]'
    secrets:
      KUBE_CONFIG_DATA_K3S: ${{ secrets.KUBE_CONFIG_DATA_K3S }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ── Stage 2: TEST (Ring Promoter dispatch) ────────────────────────────────────────
  deploy-test:
    name: "🔍 TEST → K3S"
    needs: [resolve-tag]
    if: >-
      always() &&
      needs.resolve-tag.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.DEPLOYMENT_TYPE != 'build' &&
      github.event.inputs.TARGET_ENV == 'test'
    uses: ./.github/workflows/deploy-k3s.yaml
    with:
      environment: test
      namespace: test
      release_name: tm-test
      values_file: values-test.yaml
      image_tag: ${{ needs.resolve-tag.outputs.image_tag }}
      smoke_test_port: "8181"
      runner_labels: '["k3s-linux"]'
    secrets:
      KUBE_CONFIG_DATA_K3S: ${{ secrets.KUBE_CONFIG_DATA_K3S }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ── Stage 3: ACC (Ring Promoter dispatch, client sign-off gate) ───────
  deploy-acc:
    name: "✅ ACC → K3S"
    needs: [resolve-tag]
    if: >-
      always() &&
      needs.resolve-tag.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.DEPLOYMENT_TYPE != 'build' &&
      github.event.inputs.TARGET_ENV == 'acc'
    uses: ./.github/workflows/deploy-k3s.yaml
    with:
      environment: acc
      namespace: acc
      release_name: tm-acc
      values_file: values-acc.yaml
      image_tag: ${{ needs.resolve-tag.outputs.image_tag }}
      smoke_test_port: "8182"
      runner_labels: '["k3s-linux"]'
    secrets:
      KUBE_CONFIG_DATA_K3S: ${{ secrets.KUBE_CONFIG_DATA_K3S }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ── PROD 2/2: static export of the same commit → S3 ───────────────────
  # www.tenthmatrix.com + apex are served by wslproxy (rule
  # tm-website-s3-proxy) from the bucket's website endpoint. Exports the
  # promoted image tag (= git SHA7) and writes /version.json last, which is
  # what Ring Promoter's prod ring health-checks. The job lives in
  # deploy-s3.yaml, shared with content-refresh.yaml (which re-exports the
  # release prod already runs).
  deploy-s3:
    needs: [resolve-tag, deploy-prod-api]
    if: >-
      always() &&
      needs.deploy-prod-api.result == 'success'
    uses: ./.github/workflows/deploy-s3.yaml
    with:
      sha: ${{ needs.resolve-tag.outputs.image_tag }}
    secrets: inherit

  # ── Cut the release tag LAST (only after the image is pushed) ─────────
  auto-tag:
    name: "🏷️ Cut Release Tag"
    needs: [compute-version, build]
    if: needs.compute-version.outputs.should_tag == 'true'
    runs-on: k3s-linux
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push tag
        id: create_tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEXT_VERSION="${{ needs.compute-version.outputs.next_version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$NEXT_VERSION" >/dev/null 2>&1; then
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
          else
            git tag -a "$NEXT_VERSION" -m "Release $NEXT_VERSION"
            git push origin "$NEXT_VERSION"
            echo "tag_created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        if: steps.create_tag.outputs.tag_created == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.compute-version.outputs.next_version }}
          name: Release ${{ needs.compute-version.outputs.next_version }}
          generate_release_notes: true
