[package]
name = "secret-engine"
version = "0.1.0"
edition = "2021"
description = "KV and dynamic secret engine service"
license = "Apache-2.0"

[[bin]]
name = "secret-engine"
path = "src/main.rs"

[dependencies]
vault10x-core = { path = "../../crates/vault10x-core" }
vault10x-storage = { path = "../../crates/vault10x-storage" }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
config = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
# Verifies vault10x JWTs (HS256, shared VAULT_JWT_SECRET) presented as
# X-Vault-Token by Vault clients on the KV v2 compat mount — see src/kv2.rs.
jsonwebtoken = { workspace = true }
prometheus = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
