[package]
name = "region-health"
version = "0.1.0"
edition = "2021"
description = "Multi-region health monitoring, failover detection, and region status API"
license = "Apache-2.0"

[[bin]]
name = "region-health"
path = "src/main.rs"

[dependencies]
vault10x-core = { path = "../../crates/vault10x-core" }
vault10x-storage = { path = "../../crates/vault10x-storage" }
vault10x-cluster = { path = "../../crates/vault10x-cluster" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
prometheus = { workspace = true }
