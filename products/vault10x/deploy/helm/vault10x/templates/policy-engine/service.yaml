{{- if .Values.policyEngine.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault10x.componentFullname" (dict "component" "policy-engine" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault10x.componentLabels" (dict "component" "policy-engine" "componentType" "core" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vault10x.componentSelectorLabels" (dict "component" "policy-engine" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.policyEngine.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.policyEngine.grpcPort }}
      targetPort: grpc
      protocol: TCP
{{- end }}
