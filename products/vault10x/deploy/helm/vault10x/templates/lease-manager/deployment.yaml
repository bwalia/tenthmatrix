{{/*
lease-manager/deployment.yaml
The lease-manager owns the lifecycle of secret leases: it tracks TTLs, handles
renewals, and triggers revocation calls back to the secret-engine and
crypto-service when leases expire.
*/}}
{{- if .Values.leaseManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault10x.componentFullname" (dict "component" "lease-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault10x.componentLabels" (dict "component" "lease-manager" "componentType" "core" "context" $) | nindent 4 }}
  {{- with .Values.leaseManager.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.leaseManager.replicaCount }}
  selector:
    matchLabels:
      {{- include "vault10x.componentSelectorLabels" (dict "component" "lease-manager" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vault10x.componentLabels" (dict "component" "lease-manager" "componentType" "core" "context" $) | nindent 8 }}
      {{- if .Values.monitoring.enabled }}
      annotations:
        {{- toYaml .Values.monitoring.scrapeAnnotations | nindent 8 }}
        prometheus.io/port: {{ .Values.leaseManager.httpPort | quote }}
        {{- with .Values.leaseManager.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.leaseManager.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vault10x.serviceAccountName" . }}
      {{- include "vault10x.podSecurityContext" . | nindent 6 }}
      containers:
        - name: lease-manager
          image: {{ include "vault10x.image" (dict "image" .Values.leaseManager.image "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "vault10x.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.leaseManager.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.leaseManager.grpcPort }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: {{ .Values.leaseManager.httpPort | quote }}
            - name: GRPC_PORT
              value: {{ .Values.leaseManager.grpcPort | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vault10x.dbCredentialsSecretName" . }}
                  key: {{ include "vault10x.dbAppPasswordSecretKey" . }}
                  optional: false
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:$(DB_PASSWORD)@%s:%s/%s"
                          (include "vault10x.dbAppUser" .)
                          (include "vault10x.postgresHost" .)
                          (include "vault10x.postgresPort" .)
                          .Values.postgresql.auth.database }}
            - name: VAULT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vault10x.jwtSecretName" . }}
                  key: {{ include "vault10x.jwtSecretKey" . }}
                  optional: false
            - name: VAULT_JWKS_URL
              value: "http://{{ include "vault10x.componentFullname" (dict "component" "identity-service" "context" $) }}:8082/v1/identity/.well-known/jwks.json"
            - name: IDENTITY_SERVICE_GRPC
              value: {{ printf "http://%s:%s"
                          (include "vault10x.componentFullname" (dict "component" "identity-service" "context" $))
                          (.Values.identityService.grpcPort | toString) }}
            {{- with .Values.leaseManager.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.leaseManager.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "vault10x.podScheduling" (dict "service" .Values.leaseManager "context" $) | nindent 6 }}
{{- end }}
