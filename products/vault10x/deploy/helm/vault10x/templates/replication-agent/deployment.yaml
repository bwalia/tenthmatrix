{{/*
replication-agent/deployment.yaml
Consumes replication events from peer regions and applies them to the local
database with LWW or vector-clock conflict resolution.  Leader election (via
PostgreSQL advisory locks) ensures only one active replica per region.
*/}}
{{- if .Values.replicationAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault10x.componentFullname" (dict "component" "replication-agent" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault10x.componentLabels" (dict "component" "replication-agent" "componentType" "replication" "context" $) | nindent 4 }}
  {{- with .Values.replicationAgent.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicationAgent.replicaCount }}
  selector:
    matchLabels:
      {{- include "vault10x.componentSelectorLabels" (dict "component" "replication-agent" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vault10x.componentLabels" (dict "component" "replication-agent" "componentType" "replication" "context" $) | nindent 8 }}
      {{- if .Values.monitoring.enabled }}
      annotations:
        {{- toYaml .Values.monitoring.scrapeAnnotations | nindent 8 }}
        prometheus.io/port: {{ .Values.replicationAgent.httpPort | quote }}
        {{- with .Values.replicationAgent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.replicationAgent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vault10x.serviceAccountName" . }}
      {{- include "vault10x.podSecurityContext" . | nindent 6 }}
      containers:
        - name: replication-agent
          image: {{ include "vault10x.image" (dict "image" .Values.replicationAgent.image "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "vault10x.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.replicationAgent.httpPort }}
              protocol: TCP
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vault10x.dbCredentialsSecretName" . }}
                  key: {{ include "vault10x.dbAppPasswordSecretKey" . }}
                  optional: false
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:$(DB_PASSWORD)@%s:%s/%s"
                          (include "vault10x.dbAppUser" .)
                          (include "vault10x.postgresHost" .)
                          (include "vault10x.postgresPort" .)
                          .Values.postgresql.auth.database }}
            {{- include "vault10x.regionEnv" . | nindent 12 }}
            # Peers to pull replication events from, as "<region_id>=<url>"
            # pairs (services/replication-agent/src/config.rs). Built from
            # global.region.peers with the local region filtered out, so every
            # region can share one identical roster.
            - name: REPLICATION_PEERS
              value: {{ include "vault10x.replicationPeers" . | quote }}
            - name: REPLICATION_LISTEN_ADDR
              value: {{ printf "0.0.0.0:%d" (int .Values.replicationAgent.httpPort) | quote }}
            - name: REPLICATION_POLL_INTERVAL_MS
              value: {{ .Values.replicationAgent.pollIntervalMs | quote }}
            - name: REPLICATION_BATCH_SIZE
              value: {{ .Values.replicationAgent.batchSize | quote }}
            - name: REPLICATION_CONFLICT_STRATEGY
              value: {{ .Values.replicationAgent.conflictStrategy | quote }}
            # Shared bearer token the peer-facing replication API requires and
            # this region's own peer polls present. The API fails CLOSED
            # without it: the outbox carries cleartext policy documents and the
            # tenant roster, and regions peer over the public internet.
            - name: REPLICATION_PEER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vault10x.peerTokenSecretName" . }}
                  key: {{ include "vault10x.peerTokenSecretKey" . }}
                  optional: true
            {{- with .Values.replicationAgent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.replicationAgent.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "vault10x.podScheduling" (dict "service" .Values.replicationAgent "context" $) | nindent 6 }}
{{- end }}
