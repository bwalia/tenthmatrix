[package]
name = "registry10x-signing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Image signing and verification traits for Registry10x (design 001)"

[[bin]]
name = "registry10x-sign"
path = "src/bin/registry10x-sign.rs"

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }
reqwest = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
# Crypto-only: avoid pulling Fulcio/OAuth/OCI client for keyed signing.
sigstore = { version = "0.14", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "fs"] }
tempfile.workspace = true
