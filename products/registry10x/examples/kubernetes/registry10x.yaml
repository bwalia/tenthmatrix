# A Registry10x managed by the operator (registry10x-controller).
# Requires the chart installed with `operator.enabled=true` (or the CRD and
# controller applied some other way). See docs/operator.md.
apiVersion: registry10x.com/v1alpha1
kind: Registry10x
metadata:
  name: registry10x
  namespace: acc
spec:
  image:
    repository: bwalia/tenthmatrix
    tag: latest
  # Track the digest behind `latest` and roll when it moves (replaces
  # deploy/auto-deploy/image-updater.yaml).
  autoUpdate:
    enabled: true
    intervalSeconds: 300

  # Must contain registry.yaml and auth.yaml.
  configMapName: registry10x-config
  signingKeySecret: registry10x-jwt

  registry:
    replicas: 2
    nodeSelector:
      kubernetes.io/hostname: debian001
    env:
      - name: REGISTRY10X_LOG_LEVEL
        value: info
  auth:
    replicas: 2

  # Filesystem storage backend. Omit for S3/GCS/Azure and pass the
  # credentials through registry.env / registry.envFrom instead.
  storage:
    pvcClaimName: registry10x-data

  backup:
    schedule: "0 2 * * *"
    beforeUpgrade: true
    retentionDays: 7
    pvcClaimName: registry10x-backups
    postgres:
      host: registry10x-postgres
      secretName: registry10x-postgres
