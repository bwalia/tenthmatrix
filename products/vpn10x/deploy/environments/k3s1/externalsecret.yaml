# Every secret comes from vpn10x's own wslvault tenant
# (01a0f39f-c438-7681-ac92-8ddfe4848d65) through the namespaced `wslvault`
# SecretStore in wslvault-store.yaml — not the cluster-wide store other apps
# share, which serves a different tenant. The key is mount-relative:
# `vpn10x/prod/config` is GET /v1/kv/data/vpn10x/prod/config.
#
# Nothing secret is in this repository. Load the object once with
#   WSLVAULT_TENANT_ID=01a0f39f-c438-7681-ac92-8ddfe4848d65 \
#     deploy/scripts/vault-load-secrets.sh prod
#
# One wslvault object, two Kubernetes Secrets: Postgres only ever sees its own
# password, and the control plane gets a connection string built from it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn10x-secrets
  namespace: vpn10x
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: wslvault
  target:
    name: vpn10x-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        VPN10X_DATABASE_URL: "postgres://vpn10x:{{ .POSTGRES_PASSWORD }}@vpn10x-postgres.vpn10x.svc:5432/vpn10x"
        VPN10X_OIDC_CLIENT_SECRET: "{{ .VPN10X_OIDC_CLIENT_SECRET }}"
        VPN10X_OPS_SERVICE_TOKEN: "{{ .VPN10X_OPS_SERVICE_TOKEN }}"
        VPN10X_GATEWAY_REGISTRATION_TOKEN: "{{ .VPN10X_GATEWAY_REGISTRATION_TOKEN }}"
        VPN10X_SCIM_SERVICE_TOKEN: "{{ .VPN10X_SCIM_SERVICE_TOKEN }}"
  dataFrom:
    - extract:
        key: vpn10x/prod/config
        # ESO's admission-webhook defaults, spelled out so GitOps never reports
        # a cosmetic diff on them.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn10x-postgres
  namespace: vpn10x
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: wslvault
  target:
    name: vpn10x-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: vpn10x/prod/config
        property: POSTGRES_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
