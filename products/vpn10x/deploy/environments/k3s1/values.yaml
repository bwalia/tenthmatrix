# Helm values for the control plane on k3s1.
#
#   helm upgrade --install vpn10x oci://ghcr.io/bwalia/charts/vpn10x \
#     --version 0.1.0 -n vpn10x -f deploy/environments/k3s1/values.yaml \
#     --set config.publicUrl=https://$HOST --set ingress.host=$HOST
#   (after filling the __PLACEHOLDERS__; see ../README.md)
#
# $HOST is the control plane's public name; Google's redirect URI is
# https://$HOST/auth/oidc/callback. Secrets come from externalsecret.yaml.

replicaCount: 2

image:
  repository: ghcr.io/bwalia/vpn10x-control
  tag: "0.1.0"

ingress:
  enabled: true
  # Published the way every other site on k3s1 is: the traefik-edge class, no
  # TLS block here, and a DNS name pointing at the proxy10x edge, which
  # terminates HTTPS with its own Let's Encrypt certificate. There is no
  # cert-manager on this cluster and none is needed.
  className: traefik-edge
  annotations:
    # workstation.co.uk is outside external-dns's --domain-filter on k3s1, so
    # this annotation is inert. The record is managed in Cloudflare directly:
    # vpn.workstation.co.uk CNAME lon1.pop0.uk (already in place). The edge's
    # side is registered by ../proxy10x-edge/add-vpn-host.sh.
    external-dns.alpha.kubernetes.io/hostname: "vpn.workstation.co.uk"
    # The chart's default is for ingress-nginx; null removes it here.
    nginx.ingress.kubernetes.io/force-ssl-redirect: null
  host: "vpn.workstation.co.uk"
  tls:
    enabled: false

config:
  publicUrl: "https://vpn.workstation.co.uk"
  # Shown on the landing page at / and anywhere else the product names itself.
  productDisplayName: "Workstation vpn10x"
  exposeDocs: false
  oidc:
    issuer: https://accounts.google.com
    clientId: "__GOOGLE_CLIENT_ID__"
    scopes: [openid, email, profile]
    clockSkewSecs: 60
    nativeSchemes: [io.vpn10x.zerotrust]
  # Google signs in anyone with a Google account. Only people OpsAPI has
  # provisioned are admitted. Add hostedDomains once sign-in is on a Google
  # Workspace domain; a consumer @gmail.com account carries no `hd` claim and
  # would be refused by it.
  admission:
    provisioning: directory
    hostedDomains: []
  adminEmails:
    - "__ADMIN_EMAIL__"
  gitops:
    enabled: false
