# Production template.
#
# Secrets are read from the environment rather than written here, so this file
# is safe to keep in version control. A referenced variable that is not set is a
# startup error.
#
# The control plane speaks plain HTTP and expects TLS to be terminated in front
# of it (ingress controller, load balancer, or service mesh). It must never be
# exposed directly to an untrusted network.

server:
  listen: "0.0.0.0:8080"
  public_url: "https://vpn.example.com"
  expose_docs: false

product:
  namespace: vpn10x
  display_name: "VPN10x"

database:
  # sslmode=require at minimum; verify-full where the CA is available.
  url: "${VPN10X_DATABASE_URL}"
  max_connections: 25
  min_connections: 5
  acquire_timeout_secs: 5
  idle_timeout_secs: 300
  max_lifetime_secs: 1800

identity:
  dev_login_enabled: false
  oidc:
    issuer: "${VPN10X_OIDC_ISSUER}"
    client_id: "${VPN10X_OIDC_CLIENT_ID}"
    client_secret: "${VPN10X_OIDC_CLIENT_SECRET}"
    scopes:
      - openid
      - profile
      - email
    redirect_uri: "https://vpn.example.com/auth/oidc/callback"
    # Tolerance when comparing an id_token's exp and iat to local time.
    clock_skew_secs: 60
    # Set when the control plane reaches the provider at a different address
    # from the issuer — an in-cluster provider addressed by service DNS while
    # its tokens name the public hostname. Only the address dialled changes;
    # the issuer is still checked against discovery and every token's iss.
    # internal_url: "http://dex.identity.svc:5556/dex"
    # Uncomment to allow the iOS client to sign in. Schemes must derive from a
    # domain name you control; a bare word is refused because private-use
    # schemes are first come, first served. See docs/IOS.md.
    # native_schemes:
    #   - io.vpn10x.zerotrust
  # Who may sign in, beyond "the provider verified them". The provider proves
  # who someone is; this decides whether they belong here. See docs/OIDC.md.
  admission:
    # `directory`: only people OpsAPI (or SCIM) has provisioned may sign in; a
    # first login links to the provisioned user and never creates one.
    # `jit`: a first login by any verified identity creates a user.
    provisioning: directory
    # Google Workspace only: accept accounts whose id_token `hd` claim is one of
    # these. Required with Google unless provisioning is `directory`, because
    # Google signs in anyone with a Google account.
    # hosted_domains:
    #   - example.com
  # Signing in with an OpsAPI account. The app sends the password to OpsAPI;
  # the control plane checks the resulting session with OpsAPI's /auth/me and
  # the person's record over SCIM, and checks SCIM again on every connect.
  # See docs/OPSAPI.md and ADR-0004.
  # opsapi:
  #   url: "https://api.example.com"
  #   namespace: "workstation"          # workspace people must belong to
  #   api_key: "${VPN10X_OPSAPI_API_KEY}"  # opsk_ key of a platform administrator
  #   verify_on_connect: true
  #   # Also require one of these OpsAPI namespace roles in the workspace, at
  #   # sign-in and on every connect (ADR-0005). The key then needs the `user`
  #   # scope too. Empty or absent: membership alone admits.
  #   allowed_roles: ["owner", "admin", "vpn-user"]

wireguard:
  default_port: 51820

gitops:
  enabled: true
  path: "/etc/vpn10x/gitops"

security:
  rate_limit:
    auth:
      enabled: true
      requests: 20
      window_secs: 60
    api:
      enabled: true
      requests: 600
      window_secs: 60

bootstrap:
  ops_service_token: "${VPN10X_OPS_SERVICE_TOKEN}"
  gateway_registration_token: "${VPN10X_GATEWAY_REGISTRATION_TOKEN}"
  scim_service_token: "${VPN10X_SCIM_SERVICE_TOKEN}"
  admin_emails:
    - "security@example.com"
