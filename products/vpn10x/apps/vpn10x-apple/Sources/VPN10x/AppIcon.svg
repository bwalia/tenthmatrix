<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- iOS app icon: the desktop icon (apps/vpn10x-desktop/src-tauri/icons/icon.svg)
       full-bleed, since iOS applies its own mask and rejects transparency.
       Regenerate: rsvg-convert -w 1024 -h 1024 Sources/VPN10x/AppIcon.svg -o /tmp/i.png
       then flatten (no alpha) into Assets.xcassets/AppIcon.appiconset/AppIcon.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3a4a"/>
      <stop offset="1" stop-color="#0b141c"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(1.2427) translate(-512 -512)">
    <path d="M512 232 L744 322 V520 C744 660 646 764 512 812 C378 764 280 660 280 520 V322 Z"
          fill="none" stroke="#3db8a0" stroke-width="44" stroke-linejoin="round"/>
    <circle cx="512" cy="500" r="54" fill="#3db8a0"/>
    <path d="M512 554 V650" stroke="#3db8a0" stroke-width="44" stroke-linecap="round"/>
  </g>
</svg>
