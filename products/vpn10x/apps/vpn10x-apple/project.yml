# Generated with XcodeGen: `xcodegen generate` in this directory.
#
# The project file is not committed. A .pbxproj is a merge conflict generator
# and an unreviewable diff; this file is the thing to read and to change.

name: VPN10x
options:
  bundleIdPrefix: io.vpn10x.zerotrust
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # A local package wrapping upstream WireGuardKit, whose own manifest does not
  # build under Xcode 26. `make bootstrap` fetches the sources it compiles,
  # pinned to WIREGUARD_REVISION. See Packages/WireGuardKit/Package.swift.
  WireGuardKit:
    path: Packages/WireGuardKit

settings:
  base:
    DEVELOPMENT_TEAM: PAS2QUVJHC
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  # Everything both the app and the tunnel need, and nothing that only one of
  # them needs. In particular it does not link WireGuardKit: that pulls in a Go
  # static library which has no simulator slice, and keeping it out is what lets
  # this target - and its tests - build and run on a simulator.
  #
  # One target for both platforms: the iPhone/iPad app and the Mac app share
  # every line of it, and the few platform differences (device name, posture,
  # app group) are `#if os(macOS)` inside.
  VPN10xKit:
    type: framework
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/VPN10xKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vpn10x.zerotrust.ios.kit
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        # Embedded in the app, not installed on its own: a framework in the
        # archive's Products/Library makes Xcode treat it as a generic archive
        # that cannot be exported to App Store Connect.
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  VPN10x:
    type: application
    platform: iOS
    sources:
      - path: Sources/VPN10x
        excludes: [AppIcon.svg]
    dependencies:
      - target: VPN10xKit
      - target: VPN10xTunnel
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vpn10x.zerotrust.ios
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        INFOPLIST_FILE: Sources/VPN10x/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/VPN10x/VPN10x.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # The packet tunnel. This is the only target that links WireGuardKit, and the
  # only one that cannot be built for a simulator.
  VPN10xTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/VPN10xTunnel
    dependencies:
      - target: VPN10xKit
      - package: WireGuardKit
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vpn10x.zerotrust.ios.tunnel
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        INFOPLIST_FILE: Sources/VPN10xTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/VPN10xTunnel/VPN10xTunnel.entitlements
        # The Makefile below writes libwg-go.a into CONFIGURATION_BUILD_DIR.
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(CONFIGURATION_BUILD_DIR)
    preBuildScripts:
      # WireGuardKitGo ships Go sources and a Makefile, not a binary: SwiftPM
      # declares `-lwg-go` and expects something else to have produced it. That
      # something is this. The Makefile copies GOROOT and patches the Go runtime
      # to use mach_continuous_time, so that timers keep running across a device
      # suspend - which on a phone is most of the time. It reads PLATFORM_NAME
      # and ARCHS from Xcode, so the same step builds the Mac library.
      - &build-wireguard-go
        name: Build wireguard-go
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          CHECKOUT="${SRCROOT}/Packages/WireGuardKit/upstream/Sources/WireGuardKitGo"
          if [ ! -d "$CHECKOUT" ]; then
            echo "error: WireGuardKitGo not found at $CHECKOUT" >&2
            echo "note: run 'make bootstrap' to fetch the pinned WireGuard sources" >&2
            exit 1
          fi
          # Go is not on a GUI build's PATH; the Makefile adds the usual
          # locations itself, but be explicit so the failure is legible.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v go >/dev/null || { echo "error: go is required to build wireguard-go" >&2; exit 1; }
          make -C "$CHECKOUT" build

  # The Mac app: the same SwiftUI sources as VPN10x, sandboxed, with the same
  # packet tunnel embedded as a macOS app extension. That is the Mac App Store /
  # TestFlight shape; a Developer ID build outside the store would need the
  # tunnel as a system extension instead.
  VPN10xMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/VPN10x
        excludes: [AppIcon.svg, Info.plist, VPN10x.entitlements]
      - path: Sources/VPN10xMac
        excludes: [Info.plist, VPN10xMac.entitlements]
    dependencies:
      - target: VPN10xKit
      - target: VPN10xMacTunnel
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vpn10x.zerotrust.mac
        PRODUCT_NAME: VPN10x
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        INFOPLIST_FILE: Sources/VPN10xMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/VPN10xMac/VPN10xMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  # The Mac packet tunnel: the same PacketTunnelProvider, built for macOS.
  VPN10xMacTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/VPN10xTunnel
        excludes: [Info.plist, VPN10xTunnel.entitlements]
    dependencies:
      - target: VPN10xKit
      - package: WireGuardKit
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vpn10x.zerotrust.mac.tunnel
        PRODUCT_NAME: VPN10xTunnel
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        INFOPLIST_FILE: Sources/VPN10xMacTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/VPN10xMacTunnel/VPN10xMacTunnel.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(CONFIGURATION_BUILD_DIR)
    preBuildScripts:
      - *build-wireguard-go

  # The app without its tunnel, so it can be run on a simulator.
  #
  # Not a convenience: a packet tunnel cannot work on a simulator at all.
  # WireGuardKit links a Go archive with no simulator slice, so VPN10xTunnel does
  # not even link there — and if it did, the Network Extension would still not
  # load, because the Simulator does not implement them. Everything above the
  # tunnel is real, runs, and talks to a real control plane over the host's
  # loopback. `TunnelController` says so plainly rather than failing obscurely.
  VPN10xPreview:
    type: application
    platform: iOS
    sources:
      - path: Sources/VPN10x
        excludes: [AppIcon.svg]
    dependencies:
      - target: VPN10xKit
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vpn10x.zerotrust.ios.preview
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        INFOPLIST_FILE: Sources/VPN10x/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: VPN10x
        # Signed, ad-hoc, for the simulator.
        #
        # Not cosmetic: an unsigned app carries no entitlements at all, and
        # without an application-identifier every keychain call returns
        # errSecMissingEntitlement (-34018). The symptom is a sign-in that gets
        # its token, fails to store it, and stops — with a successful request in
        # the network log and nothing to explain what went wrong.
        #
        # No entitlements file: the Network Extension and shared keychain group
        # are granted by Apple against a real App ID, and this target wants
        # neither. Ad-hoc signing gives it the identity the keychain needs and
        # nothing more.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_ENTITLEMENTS: ""
        DEVELOPMENT_TEAM: ""

  # Drives the running app against a live control plane. Kept out of the
  # default schemes on purpose: it needs `make dev` up.
  VPN10xUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/VPN10xUITests
    dependencies:
      - target: VPN10xPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vpn10x.zerotrust.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VPN10xPreview

  VPN10xKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/VPN10xKitTests
    dependencies:
      - target: VPN10xKit
      - target: VPN10xPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.vpn10x.zerotrust.ios.kit.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VPN10x.app/VPN10x
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""

schemes:
  VPN10x:
    build:
      targets:
        VPN10x: all
        VPN10xTunnel: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VPN10xKitTests

  VPN10xMac:
    build:
      targets:
        VPN10xMac: all
        VPN10xMacTunnel: all
    run:
      config: Debug

  VPN10xPreview:
    build:
      targets:
        VPN10xPreview: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VPN10xUITests

  # Builds and tests only what does not depend on the Go library, so it runs on
  # a simulator. This is the scheme CI can use.
  VPN10xKit:
    build:
      targets:
        VPN10xKit: all
        VPN10xPreview: [test]
        VPN10xKitTests: [test]
    test:
      config: Debug
      targets:
        - VPN10xKitTests
