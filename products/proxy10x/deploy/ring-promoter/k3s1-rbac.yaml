# RBAC so Ring Promoter's k8sjob runner can helm-deploy Proxy10x control plane on k3s1.
#
# Apply against k3s1 (once):
#   kubectl apply -f deploy/ring-promoter/k3s1-rbac.yaml
#
# Assumes the shared platform already exists (owned by diy-tax-return-uk /
# ring-promoter, not this file):
#   * namespace ring-exec
#   * ServiceAccount ring-exec/ring-deploy-job
#
# This file adds:
#   * namespaces proxy10x-system (prod) and proxy10x-{int,test,acc}
#   * namespaced helm-deploy rights in those namespaces
#   * cluster-scoped rights the chart needs (IngressClass, controller
#     ClusterRole/Binding, Proxy10x CRDs)
apiVersion: v1
kind: Namespace
metadata:
  name: proxy10x-system
  labels:
    app.kubernetes.io/part-of: proxy10x
    app.kubernetes.io/component: ingress
---
apiVersion: v1
kind: Namespace
metadata:
  name: proxy10x-int
  labels:
    app.kubernetes.io/part-of: proxy10x
    app.kubernetes.io/component: ingress
---
apiVersion: v1
kind: Namespace
metadata:
  name: proxy10x-test
  labels:
    app.kubernetes.io/part-of: proxy10x
    app.kubernetes.io/component: ingress
---
apiVersion: v1
kind: Namespace
metadata:
  name: proxy10x-acc
  labels:
    app.kubernetes.io/part-of: proxy10x
    app.kubernetes.io/component: ingress
---
# Namespaced kinds the ingress Helm chart creates/updates, plus Helm release Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rp-deploy-proxy10x-ingress
  labels:
    app.kubernetes.io/part-of: proxy10x
    app.kubernetes.io/managed-by: ring-promoter
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts", "pods", "persistentvolumeclaims", "events", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Zalando Postgres operator CR (control-plane DB in proxy10x-system)
  - apiGroups: ["acid.zalan.do"]
    resources: ["postgresqls"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rp-deploy-proxy10x-ingress
  namespace: proxy10x-system
  labels:
    app.kubernetes.io/part-of: proxy10x
subjects:
  - kind: ServiceAccount
    name: ring-deploy-job
    namespace: ring-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rp-deploy-proxy10x-ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rp-deploy-proxy10x-ingress
  namespace: proxy10x-int
  labels:
    app.kubernetes.io/part-of: proxy10x
subjects:
  - kind: ServiceAccount
    name: ring-deploy-job
    namespace: ring-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rp-deploy-proxy10x-ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rp-deploy-proxy10x-ingress
  namespace: proxy10x-test
  labels:
    app.kubernetes.io/part-of: proxy10x
subjects:
  - kind: ServiceAccount
    name: ring-deploy-job
    namespace: ring-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rp-deploy-proxy10x-ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rp-deploy-proxy10x-ingress
  namespace: proxy10x-acc
  labels:
    app.kubernetes.io/part-of: proxy10x
subjects:
  - kind: ServiceAccount
    name: ring-deploy-job
    namespace: ring-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rp-deploy-proxy10x-ingress
---
# Cluster-scoped objects the chart + CRD apply need. IngressClass names and
# controller ClusterRole names are pinned to the four ring fullnames.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rp-deploy-proxy10x-ingress-cluster
  labels:
    app.kubernetes.io/part-of: proxy10x
    app.kubernetes.io/managed-by: ring-promoter
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - proxy10xbackends.proxy10x.io
      - proxy10xroutes.proxy10x.io
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    resourceNames:
      - proxy10x-ingress
      - proxy10x-ingress-int
      - proxy10x-ingress-test
      - proxy10x-ingress-acc
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["create"]
  # Mirror the controller ClusterRole the chart templates (rbac.yaml) so Helm
  # can create it without escalate/bind. Keep this in sync with
  # ingress-controller/deploy/helm/templates/rbac.yaml.
  - apiGroups: ["proxy10x.io"]
    resources: ["proxy10xbackends", "proxy10xroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["proxy10x.io"]
    resources: ["proxy10xbackends/status", "proxy10xroutes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["proxy10x.io"]
    resources: ["proxy10xbackends/finalizers", "proxy10xroutes/finalizers"]
    verbs: ["update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rp-deploy-proxy10x-ingress-cluster
  labels:
    app.kubernetes.io/part-of: proxy10x
    app.kubernetes.io/managed-by: ring-promoter
subjects:
  - kind: ServiceAccount
    name: ring-deploy-job
    namespace: ring-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rp-deploy-proxy10x-ingress-cluster
