apiVersion: v1
kind: Service
metadata:
  name: {{ include "proxy10x.fullname" . }}-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxy10x.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: {{ .Values.controller.metrics.serviceType | default "ClusterIP" }}
  ports:
  - name: metrics
    port: {{ .Values.controller.metrics.port }}
    targetPort: metrics
    protocol: TCP
  selector:
    {{- include "proxy10x.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
