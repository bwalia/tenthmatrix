{{- if not .Values.openresty.useBuiltinConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "proxy10x.fullname" . }}-openresty-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxy10x.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
data:
  nginx.conf: |
{{ .Files.Get "files/nginx.conf" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "proxy10x.fullname" . }}-lua-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxy10x.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
data:
  dynamic_upstream.lua: |
{{ .Files.Get "files/lua/upstream/dynamic_upstream.lua" | indent 4 }}
  update_backend.lua: |
{{ .Files.Get "files/lua/api/update_backend.lua" | indent 4 }}
  delete_backend.lua: |
{{ .Files.Get "files/lua/api/delete_backend.lua" | indent 4 }}
  get_backend.lua: |
{{ .Files.Get "files/lua/api/get_backend.lua" | indent 4 }}
  list_backends.lua: |
{{ .Files.Get "files/lua/api/list_backends.lua" | indent 4 }}
  prometheus.lua: |
{{ .Files.Get "files/lua/metrics/prometheus.lua" | indent 4 }}
{{- end }}
