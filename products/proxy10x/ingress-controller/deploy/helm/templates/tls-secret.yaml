{{- if not .Values.certManager.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "proxy10x.fullname" . }}-default-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxy10x.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  # Self-signed certificate for local development, generated at install time
  {{- $cert := genSelfSignedCert "localhost" nil (list "localhost") 365 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
