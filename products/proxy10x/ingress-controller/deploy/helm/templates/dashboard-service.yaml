{{- if and .Values.openresty.controlPlane.enabled .Values.openresty.controlPlane.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "proxy10x.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxy10x.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.openresty.controlPlane.dashboard.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "proxy10x.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
{{- end }}
