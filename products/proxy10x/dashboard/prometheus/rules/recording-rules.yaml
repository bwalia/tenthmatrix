# Prometheus recording rules for Proxy10x - Backend Health
# Pre-computes the expensive aggregations used by the dashboard so heavy panels
# (per-backend p95, error ratios) stay fast. Load via rule_files: in prometheus.yml.
#
# All expressions use ONLY metrics that exist on prod-our.proxy10x.com/metrics.
groups:
  - name: proxy10x_backend.recording
    interval: 30s
    rules:
      # ---- request rates -------------------------------------------------
      - record: proxy10x:backend_requests:rate5m
        expr: sum by (backend_label) (rate(proxy10x_backend_requests_total[5m]))

      - record: proxy10x:backend_requests_by_rule:rate5m
        expr: sum by (rule_id, backend_label) (rate(proxy10x_backend_requests_total[5m]))

      # ---- error rates ---------------------------------------------------
      - record: proxy10x:backend_5xx:rate5m
        expr: sum by (backend_label) (rate(proxy10x_backend_requests_total{status=~"5.."}[5m]))

      - record: proxy10x:backend_error_ratio:5m
        expr: |
          sum by (backend_label) (rate(proxy10x_backend_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum by (backend_label) (rate(proxy10x_backend_requests_total[5m])), 0.0001)

      # ---- latency percentiles ------------------------------------------
      - record: proxy10x:backend_latency_p95:5m
        expr: histogram_quantile(0.95, sum by (backend_label, le) (rate(proxy10x_backend_response_seconds_bucket[5m])))

      - record: proxy10x:backend_latency_p99:5m
        expr: histogram_quantile(0.99, sum by (backend_label, le) (rate(proxy10x_backend_response_seconds_bucket[5m])))

  - name: proxy10x_edge.recording
    interval: 30s
    rules:
      - record: proxy10x:http_requests:rate5m
        expr: sum(rate(nginx_http_requests_total[5m]))

      - record: proxy10x:http_error_ratio:5m
        expr: |
          sum(rate(nginx_http_errors_total[5m]))
            / clamp_min(sum(rate(nginx_http_requests_total[5m])), 1)

      - record: proxy10x:http_5xx_ratio:5m
        expr: |
          sum(rate(nginx_http_5xx_errors_total[5m]))
            / clamp_min(sum(rate(nginx_http_requests_total[5m])), 1)

      - record: proxy10x:availability:5m
        expr: 100 * (1 - (sum(rate(nginx_http_5xx_errors_total[5m])) / clamp_min(sum(rate(nginx_http_requests_total[5m])), 1)))

      - record: proxy10x:fleet_availability:ratio
        expr: 100 * count(proxy10x_backend_healthy == 1) / clamp_min(count(proxy10x_backend_healthy), 1)
